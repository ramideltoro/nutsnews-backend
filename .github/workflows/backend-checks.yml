name: Backend Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate backend repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags --prune --depth=1 origin "$BASE_REF"
            git diff --check "origin/$BASE_REF...HEAD"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            git diff --check HEAD~1..HEAD
          else
            git diff --check "$(git hash-object -t tree /dev/null)" HEAD
          fi

      - name: Validate repository guardrails
        shell: bash
        run: python3 scripts/validate_no_secret_files.py

      - name: Validate credential inventory
        shell: bash
        run: python3 scripts/validate_backend_credential_inventory.py

      - name: Validate service baseline inventory
        shell: bash
        run: python3 scripts/validate_service_baseline.py

      - name: Validate backup service matrix
        shell: bash
        run: python3 scripts/validate_backup_service_matrix.py

      - name: Validate PostgreSQL backup restore proof example
        shell: bash
        run: python3 scripts/validate_backend_postgres_backup_proof.py

      - name: Validate Grafana metrics dashboards
        shell: bash
        run: python3 scripts/provision_grafana_metrics.py --check

      - name: Validate New Relic observability definitions
        shell: bash
        run: python3 scripts/validate_newrelic_observability.py

      - name: Validate New Relic dashboard provisioning check mode
        shell: bash
        run: python3 scripts/provision_newrelic_dashboards.py --check

      - name: Validate New Relic observability offline mode
        shell: bash
        run: python3 scripts/backend_newrelic_observability_check.py --offline

      - name: Validate New Relic change tracking check mode
        shell: bash
        run: python3 scripts/newrelic_change_tracking.py --check

      - name: Validate abuse protection decision
        shell: bash
        run: python3 scripts/validate_abuse_protection_decision.py

      - name: Validate recovery workflow guardrails
        shell: bash
        run: python3 scripts/validate_recovery_workflows.py

      - name: Validate Redis Valkey decision
        shell: bash
        run: python3 scripts/validate_redis_valkey_decision.py

      - name: Validate search service decision
        shell: bash
        run: python3 scripts/validate_search_service_decision.py

      - name: Validate PostgreSQL replacement plan
        shell: bash
        run: python3 scripts/validate_postgres_replacement_plan.py

      - name: Validate Supabase backend PostgreSQL parity manifest
        shell: bash
        run: python3 scripts/validate_supabase_backend_postgres_parity.py

      - name: Validate Supabase platform parity decision
        shell: bash
        run: python3 scripts/validate_supabase_platform_parity_decision.py

      - name: Report migration drift gate status
        shell: bash
        run: python3 scripts/check_supabase_migration_drift.py

      - name: Validate migration access preflight offline mode
        shell: bash
        run: python3 scripts/backend_postgres_migration_access_preflight.py --offline

      - name: Validate parity comparison offline mode
        shell: bash
        run: python3 scripts/backend_postgres_parity_validate.py --offline

      - name: Validate backend API compatibility contract
        shell: bash
        run: python3 scripts/validate_backend_api_compatibility_contract.py

      - name: Validate backend database provider switch
        shell: bash
        run: python3 scripts/validate_backend_database_provider_switch.py

      - name: Validate backend DB rollback guardrails
        shell: bash
        run: python3 scripts/validate_backend_db_rollback_guardrails.py

      - name: Validate backend production cutover plan
        shell: bash
        run: python3 scripts/validate_backend_production_cutover_plan.py

      - name: Validate PostgreSQL logical replication plan
        shell: bash
        run: python3 scripts/validate_backend_postgres_logical_replication_plan.py

      - name: Validate PostgreSQL replication health offline mode
        shell: bash
        run: python3 scripts/backend_postgres_replication_health.py --offline

      - name: Validate PostgreSQL smoke tests offline mode
        shell: bash
        run: python3 scripts/backend_postgres_smoke_tests.py --offline

      - name: Validate PostgreSQL benchmark offline mode
        shell: bash
        run: python3 scripts/backend_postgres_benchmark_tuning.py --offline

      - name: Run backend drift check tests
        shell: bash
        run: python3 -m unittest discover -s tests

      - name: Install Ansible in temporary venv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ansible-venv"
          "$RUNNER_TEMP/ansible-venv/bin/python" -m pip install ansible-core
          echo "$RUNNER_TEMP/ansible-venv/bin" >> "$GITHUB_PATH"

      - name: Install Ansible collections
        shell: bash
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Ansible syntax check
        shell: bash
        working-directory: ansible
        run: ansible-playbook playbooks/bootstrap.yml --syntax-check -i inventories/production/hosts.yml
