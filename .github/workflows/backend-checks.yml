      - name: Validate backend-to-Supabase standby reconciliation guardrails
        shell: bash
        run: python3 scripts/validate_backend_supabase_standby_reconciliation.py

      - name: Validate backend-to-Supabase standby reconciliation offline mode
        shell: bash
        run: python3 scripts/backend_supabase_standby_reconcile.py --offline --enforce

      - name: Run backend-to-Supabase standby reconciliation tests
        shell: bash
        run: python3 -m unittest tests.test_backend_supabase_standby_reconcile

      - name: Validate backend-to-Supabase sync relay guardrails
        shell: bash
        run: python3 scripts/validate_backend_supabase_sync_relay.py

      - name: Validate backend-to-Supabase sync relay health guardrails
        shell: bash
        run: python3 scripts/validate_backend_supabase_sync_relay_health.py

      - name: Validate Supabase standby lag gate guardrails
        shell: bash
        run: python3 scripts/validate_backend_supabase_standby_lag_gate.py

      - name: Validate Supabase standby parity gate guardrails
        shell: bash
        run: python3 scripts/validate_backend_supabase_standby_parity_gate.py

      - name: Validate Supabase standby schema gate guardrails
        shell: bash
        run: python3 scripts/validate_backend_supabase_standby_schema_gate.py

      - name: Validate Supabase standby sequence gate guardrails
        shell: bash
        run: python3 scripts/validate_backend_supabase_standby_sequence_gate.py

      - name: Validate Supabase standby writer pause gate guardrails
        shell: bash
        run: python3 scripts/validate_backend_supabase_standby_writer_pause_gate.py

      - name: Validate Supabase standby split-brain fence gate guardrails
        shell: bash
        run: python3 scripts/validate_backend_supabase_standby_split_brain_fence_gate.py

      - name: Validate Supabase standby promotion decision guardrails
        shell: bash
        run: python3 scripts/validate_backend_supabase_standby_promotion_decision.py

      - name: Validate backend-supabase-standby-recovery-boundaries guardrails
        shell: bash
        run: python3 scripts/validate_backend_supabase_standby_recovery_boundaries.py

      - name: Validate backend-supabase-standby-failover guardrails
        shell: bash
        run: python3 scripts/validate_backend_supabase_standby_failover.py

      - name: Validate backend-to-Supabase sync relay offline mode
        shell: bash
        run: python3 scripts/backend_supabase_sync_relay.py --offline --enforce

      - name: Run backend-to-Supabase sync relay tests
        shell: bash
        run: python3 -m unittest tests.test_backend_supabase_sync_relay

      - name: Run backend-to-Supabase sync relay smoke tests
        shell: bash
        run: python3 -m unittest tests.test_backend_supabase_sync_relay_smoke

      - name: Run Supabase standby lag gate tests
        shell: bash
        run: python3 -m unittest tests.test_backend_supabase_standby_lag_gate

      - name: Run Supabase standby parity gate tests
        shell: bash
        run: python3 -m unittest tests.test_backend_supabase_standby_parity_gate

      - name: Run Supabase standby schema gate tests
        shell: bash
        run: python3 -m unittest tests.test_backend_supabase_standby_schema_gate

      - name: Run Supabase standby sequence gate tests
        shell: bash
        run: python3 -m unittest tests.test_backend_supabase_standby_sequence_gate

      - name: Run Supabase standby writer pause gate tests
        shell: bash
        run: python3 -m unittest tests.test_backend_supabase_standby_writer_pause_gate

      - name: Run Supabase standby split-brain fence gate tests
        shell: bash
        run: python3 -m unittest tests.test_backend_supabase_standby_split_brain_fence_gate

      - name: Run Supabase standby promotion decision tests
        shell: bash
        run: python3 -m unittest tests.test_backend_supabase_standby_promotion_decision

      - name: Run Supabase standby recovery boundary tests
        shell: bash
        run: python3 -m unittest tests.test_backend_supabase_standby_recovery_boundaries

      - name: Run Supabase standby failover tests
        shell: bash
        run: python3 -m unittest tests.test_backend_supabase_standby_failover

      - name: Run backend writer pause manager tests
        shell: bash
        run: python3 -m unittest tests.test_backend_writer_pause_manager

      - name: Run backend PostgreSQL write position tests
        shell: bash
        run: python3 -m unittest tests.test_backend_postgres_write_position

      - name: Report migration drift gate status
        shell: bash
        run: python3 scripts/check_supabase_migration_drift.py

      - name: Validate migration access preflight offline mode
        shell: bash
        run: python3 scripts/backend_postgres_migration_access_preflight.py --offline

      - name: Validate parity comparison offline mode
        shell: bash
        run: python3 scripts/backend_postgres_parity_validate.py --offline

      - name: Validate behavior parity comparison offline mode
        shell: bash
        run: python3 scripts/backend_postgres_behavior_parity_validate.py --offline

      - name: Validate backend API compatibility contract
        shell: bash
        run: python3 scripts/validate_backend_api_compatibility_contract.py

      - name: Validate worker uplift API/admin compatibility contract
        shell: bash
        run: python3 scripts/validate_worker_uplift_api_admin_contract.py

      - name: Validate worker uplift architecture ADR
        shell: bash
        run: python3 scripts/validate_worker_uplift_architecture_adr.py

      - name: Validate worker uplift RabbitMQ capacity and security decision
        shell: bash
        run: python3 scripts/validate_worker_uplift_rabbitmq_capacity_security.py

      - name: Validate worker uplift RabbitMQ provisioning
        shell: bash
        run: python3 scripts/validate_worker_uplift_rabbitmq_provisioning.py

      - name: Validate worker uplift RabbitMQ network security
        shell: bash
        run: python3 scripts/validate_worker_uplift_rabbitmq_network_security.py

      - name: Validate worker uplift RabbitMQ recovery
        shell: bash
        run: python3 scripts/validate_worker_uplift_rabbitmq_recovery.py

      - name: Validate worker uplift RabbitMQ protected operations
        shell: bash
        run: python3 scripts/validate_worker_uplift_rabbitmq_operations.py

      - name: Validate worker uplift service runtime
        shell: bash
        run: python3 scripts/validate_worker_uplift_service_runtime.py

      - name: Validate worker uplift non-AI shadow deployment
        shell: bash
        run: python3 scripts/validate_worker_uplift_non_ai_shadow_deployment.py

      - name: Validate worker uplift AI shadow deployment
        shell: bash
        run: python3 scripts/validate_worker_uplift_ai_shadow_deployment.py

      - name: Validate worker uplift final shadow deployment
        shell: bash
        run: python3 scripts/validate_worker_uplift_final_shadow_deployment.py

      - name: Validate worker uplift API probe offline mode
        shell: bash
        run: python3 scripts/backend_worker_uplift_api_probe.py --offline --enforce

      - name: Validate worker uplift parity report wiring
        shell: bash
        run: python3 scripts/validate_worker_uplift_parity_report.py

      - name: Validate worker uplift parity report offline mode
        shell: bash
        run: python3 scripts/backend_worker_uplift_parity_report.py --offline --enforce

      - name: Validate worker uplift soak/capacity report wiring
        shell: bash
        run: python3 scripts/validate_worker_uplift_soak_report.py

      - name: Validate worker uplift soak/capacity report offline mode
        shell: bash
        run: python3 scripts/backend_worker_uplift_soak_report.py --offline --enforce

      - name: Validate worker uplift RabbitMQ metrics
        shell: bash
        run: python3 scripts/validate_worker_uplift_rabbitmq_metrics.py

      - name: Validate worker uplift logs and deferred traces
        shell: bash
        run: python3 scripts/validate_worker_uplift_logs_traces.py

      - name: Validate backend database provider switch
        shell: bash
        run: python3 scripts/validate_backend_database_provider_switch.py

      - name: Validate backend DB rollback guardrails
        shell: bash
        run: python3 scripts/validate_backend_db_rollback_guardrails.py

      - name: Validate backend production cutover plan
        shell: bash
        run: python3 scripts/validate_backend_production_cutover_plan.py

      - name: Validate PostgreSQL logical replication plan
        shell: bash
        run: python3 scripts/validate_backend_postgres_logical_replication_plan.py

      - name: Validate PostgreSQL replication health offline mode
        shell: bash
        run: python3 scripts/backend_postgres_replication_health.py --offline

      - name: Validate PostgreSQL smoke tests offline mode
        shell: bash
        run: python3 scripts/backend_postgres_smoke_tests.py --offline

      - name: Validate PostgreSQL benchmark offline mode
        shell: bash
        run: python3 scripts/backend_postgres_benchmark_tuning.py --offline

      - name: Run backend drift check tests
        shell: bash
        run: python3 -m unittest discover -s tests

      - name: Install Ansible in temporary venv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ansible-venv"
          "$RUNNER_TEMP/ansible-venv/bin/python" -m pip install ansible-core
          echo "$RUNNER_TEMP/ansible-venv/bin" >> "$GITHUB_PATH"

      - name: Install Ansible collections
        shell: bash
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Ansible syntax check
        shell: bash
        working-directory: ansible
        run: ansible-playbook playbooks/bootstrap.yml --syntax-check -i inventories/production/hosts.yml

      - name: Supabase standby forced-command probe Ansible syntax check
        shell: bash
        working-directory: ansible
        run: ansible-playbook playbooks/supabase_standby_probe.yml --syntax-check -i inventories/production/hosts.yml

  rabbitmq_benchmark:
    name: Benchmark RabbitMQ queue types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, 'RabbitMQ')) || (github.event_name == 'push' && contains(github.event.head_commit.message, 'RabbitMQ')) }}

    services:
      rabbitmq:
        image: rabbitmq@sha256:c427b73a15d01416346f429042125e663452e2a27e07fb3096fadb08f7033fc7
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install benchmark dependency
        shell: bash
        run: python3 -m pip install --disable-pip-version-check pika==1.3.2

      - name: Run benchmark
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/worker_uplift_rabbitmq_capacity_benchmark.py \
            --messages-per-queue 50 \
            --message-bytes 1024 \
            --output rabbitmq-capacity-benchmark.json

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: rabbitmq-capacity-benchmark
          path: rabbitmq-capacity-benchmark.json
          if-no-files-found: error
