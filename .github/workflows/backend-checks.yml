name: Backend Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate backend repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags --prune --depth=1 origin "$BASE_REF"
            git diff --check "origin/$BASE_REF...HEAD"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            git diff --check HEAD~1..HEAD
          else
            git diff --check "$(git hash-object -t tree /dev/null)" HEAD
          fi

      - name: Validate repository guardrails
        shell: bash
        run: python3 scripts/validate_no_secret_files.py

      - name: Validate credential inventory
        shell: bash
        run: python3 scripts/validate_backend_credential_inventory.py

      - name: Validate backend Grafana handoff
        shell: bash
        run: python3 scripts/validate_backend_grafana_handoff.py

      - name: Validate worker uplift operation map
        shell: bash
        run: python3 scripts/validate_worker_uplift_operation_map.py

      - name: Validate worker uplift credential readiness
        shell: bash
        run: python3 scripts/validate_worker_uplift_runtime_readiness.py

      - name: Validate worker uplift runtime identities
        shell: bash
        run: python3 scripts/validate_worker_uplift_runtime_identities.py

      - name: Validate worker uplift shadow data model offline
        shell: bash
        run: python3 scripts/backend_worker_uplift_shadow_model_check.py --offline --enforce

      - name: Validate service baseline inventory
        shell: bash
        run: python3 scripts/validate_service_baseline.py

      - name: Validate backup service matrix
        shell: bash
        run: python3 scripts/validate_backup_service_matrix.py

      - name: Validate PostgreSQL backup restore proof example
        shell: bash
        run: python3 scripts/validate_backend_postgres_backup_proof.py

      - name: Validate PostgreSQL primary shadow backup restore proof plan
        shell: bash
        run: python3 scripts/validate_backend_postgres_primary_shadow_backup_restore_proof_plan.py

      - name: Validate Grafana metrics dashboards
        shell: bash
        run: python3 scripts/provision_grafana_metrics.py --check

      - name: Validate New Relic observability definitions
        shell: bash
        run: python3 scripts/validate_newrelic_observability.py

      - name: Validate New Relic dashboard provisioning check mode
        shell: bash
        run: python3 scripts/provision_newrelic_dashboards.py --check

      - name: Validate New Relic observability offline mode
        shell: bash
        run: python3 scripts/backend_newrelic_observability_check.py --offline

      - name: Validate New Relic change tracking check mode
        shell: bash
        run: python3 scripts/newrelic_change_tracking.py --check

      - name: Validate abuse protection decision
        shell: bash
        run: python3 scripts/validate_abuse_protection_decision.py

      - name: Validate recovery workflow guardrails
        shell: bash
        run: python3 scripts/validate_recovery_workflows.py

      - name: Validate Redis Valkey decision
        shell: bash
        run: python3 scripts/validate_redis_valkey_decision.py

      - name: Validate search service decision
        shell: bash
        run: python3 scripts/validate_search_service_decision.py

      - name: Validate PostgreSQL replacement plan
        shell: bash
        run: python3 scripts/validate_postgres_replacement_plan.py

      - name: Validate future-primary PostgreSQL topology
        shell: bash
        run: python3 scripts/validate_backend_postgres_future_primary_topology.py

      - name: Validate PostgreSQL primary shadow restore plan
        shell: bash
        run: python3 scripts/validate_backend_postgres_primary_shadow_restore_plan.py

      - name: Validate PostgreSQL primary shadow restore report example
        shell: bash
        run: python3 scripts/validate_backend_postgres_primary_shadow_restore_report.py

      - name: Validate PostgreSQL primary shadow sync proof plan
        shell: bash
        run: python3 scripts/validate_backend_postgres_primary_shadow_sync_proof_plan.py

      - name: Validate PostgreSQL primary shadow monitoring plan
        shell: bash
        run: python3 scripts/validate_backend_postgres_primary_shadow_monitoring_plan.py

      - name: Validate Supabase backend PostgreSQL parity manifest
        shell: bash
        run: python3 scripts/validate_supabase_backend_postgres_parity.py

      - name: Validate Supabase backend PostgreSQL behavior parity manifest
        shell: bash
        run: python3 scripts/validate_supabase_backend_postgres_behavior_parity.py

      - name: Validate Supabase platform parity decision
        shell: bash
        run: python3 scripts/validate_supabase_platform_parity_decision.py

      - name: Validate Supabase standby forced-command probe boundary
        shell: bash
        run: python3 scripts/validate_supabase_standby_probe_boundary.py

      - name: Validate Supabase standby forced-command probe implementation
        shell: bash
