name: Backend Cloudflare Routing

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: Plan, apply, or roll back the backend DNS record.
        required: true
        default: check
        type: choice
        options:
          - check
          - apply
          - rollback
      confirm_apply:
        description: For apply or rollback, type backend.nutsnews.com. Leave blank for check mode.
        required: false
        default: ""
        type: string
      record_name:
        description: Backend DNS record name.
        required: true
        default: backend.nutsnews.com
        type: string
      target_ipv4:
        description: Backend origin IPv4 address.
        required: true
        default: 65.75.201.18
        type: string
      proxied:
        description: Whether Cloudflare should proxy this A record.
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: production-backend-cloudflare-routing
  cancel-in-progress: false

jobs:
  route:
    name: Backend Cloudflare route
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-backend

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Validate dispatch inputs
        shell: bash
        env:
          RUN_MODE: ${{ inputs.run_mode }}
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
          RECORD_NAME: ${{ inputs.record_name }}
          TARGET_IPV4: ${{ inputs.target_ipv4 }}
          PROXIED: ${{ inputs.proxied }}
        run: |
          set -euo pipefail

          if [[ "$RUN_MODE" != "check" && "$RUN_MODE" != "apply" && "$RUN_MODE" != "rollback" ]]; then
            echo "Unsupported run_mode: $RUN_MODE" >&2
            exit 1
          fi

          if [[ "$RUN_MODE" != "check" && "$CONFIRM_APPLY" != "backend.nutsnews.com" ]]; then
            echo "Apply and rollback require confirm_apply to be exactly backend.nutsnews.com." >&2
            exit 1
          fi

          if [[ "$RECORD_NAME" != "backend.nutsnews.com" ]]; then
            echo "This workflow only manages backend.nutsnews.com." >&2
            exit 1
          fi

          if [[ "$TARGET_IPV4" != "65.75.201.18" ]]; then
            echo "This workflow only targets 65.75.201.18." >&2
            exit 1
          fi

          if [[ "$PROXIED" != "false" && "$PROXIED" != "true" ]]; then
            echo "proxied must be false or true." >&2
            exit 1
          fi

      - name: Validate required Cloudflare secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail

          missing=0
          for secret_name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ZONE_ID; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing required production-backend environment secret: $secret_name" >&2
              missing=1
            fi
          done

          exit "$missing"

      - name: Verify origin reachability before DNS apply
        if: inputs.run_mode == 'apply'
        shell: bash
        env:
          RECORD_NAME: ${{ inputs.record_name }}
          TARGET_IPV4: ${{ inputs.target_ipv4 }}
        run: |
          set -euo pipefail

          body_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$body_file" --write-out "%{http_code}" \
            --retry 5 --retry-delay 5 \
            --resolve "$RECORD_NAME:80:$TARGET_IPV4" \
            "http://$RECORD_NAME/healthz")"
          body="$(cat "$body_file")"
          rm -f "$body_file"

          if [[ "$status" == "200" && "$body" == "ok" ]]; then
            exit 0
          fi

          if [[ "$status" == "308" ]]; then
            echo "Origin returned the expected Caddy HTTP-to-HTTPS redirect before DNS apply."
            exit 0
          fi

          echo "Unexpected origin response before DNS apply: HTTP $status" >&2
          exit 1

      - name: Manage Cloudflare backend DNS record
        shell: bash
        env:
          RUN_MODE: ${{ inputs.run_mode }}
          RECORD_NAME: ${{ inputs.record_name }}
          TARGET_IPV4: ${{ inputs.target_ipv4 }}
          PROXIED: ${{ inputs.proxied }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail

          python3 scripts/cloudflare_backend_dns.py \
            --mode "$RUN_MODE" \
            --zone-id "$CLOUDFLARE_ZONE_ID" \
            --api-token "$CLOUDFLARE_API_TOKEN" \
            --record-name "$RECORD_NAME" \
            --target-ipv4 "$TARGET_IPV4" \
            --proxied "$PROXIED" \
            --ttl 300 \
            --output "$RUNNER_TEMP/backend-cloudflare-routing.json"

      - name: Verify backend HTTPS health after DNS mutation
        if: inputs.run_mode == 'apply'
        shell: bash
        env:
          RECORD_NAME: ${{ inputs.record_name }}
          TARGET_IPV4: ${{ inputs.target_ipv4 }}
        run: |
          set -euo pipefail

          for attempt in {1..12}; do
            response="$(curl --fail --silent --show-error --connect-timeout 10 \
              --resolve "$RECORD_NAME:443:$TARGET_IPV4" \
              "https://$RECORD_NAME/healthz" || true)"

            if [[ "$response" == "ok" ]]; then
              exit 0
            fi

            echo "HTTPS health is not ready yet; retry $attempt/12."
            sleep 10
          done

          echo "backend HTTPS health did not return ok after DNS mutation." >&2
          exit 1

      - name: Verify public DNS answer after DNS mutation
        if: inputs.run_mode == 'apply'
        shell: bash
        env:
          RECORD_NAME: ${{ inputs.record_name }}
          TARGET_IPV4: ${{ inputs.target_ipv4 }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import random
          import socket
          import struct
          import sys

          name = os.environ["RECORD_NAME"].rstrip(".")
          expected = os.environ["TARGET_IPV4"]

          def skip_name(packet: bytes, offset: int) -> int:
              while True:
                  length = packet[offset]
                  if length & 0xC0 == 0xC0:
                      return offset + 2
                  if length == 0:
                      return offset + 1
                  offset += length + 1

          def query_a(resolver: str) -> list[str]:
              query_id = random.randint(0, 65535)
              qname = b"".join(bytes([len(part)]) + part.encode("ascii") for part in name.split(".")) + b"\0"
              packet = struct.pack("!HHHHHH", query_id, 0x0100, 1, 0, 0, 0) + qname + struct.pack("!HH", 1, 1)

              with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as sock:
                  sock.settimeout(5)
                  sock.sendto(packet, (resolver, 53))
                  response, _ = sock.recvfrom(2048)

              rid, flags, qdcount, ancount, _, _ = struct.unpack("!HHHHHH", response[:12])
              if rid != query_id:
                  raise RuntimeError(f"{resolver} returned a mismatched DNS response id")
              rcode = flags & 0x000F
              if rcode != 0:
                  return []

              offset = 12
              for _ in range(qdcount):
                  offset = skip_name(response, offset) + 4

              answers = []
              for _ in range(ancount):
                  offset = skip_name(response, offset)
                  rtype, rclass, _, rdlength = struct.unpack("!HHIH", response[offset : offset + 10])
                  offset += 10
                  rdata = response[offset : offset + rdlength]
                  offset += rdlength
                  if rtype == 1 and rclass == 1 and rdlength == 4:
                      answers.append(socket.inet_ntoa(rdata))
              return answers

          for resolver in ("1.1.1.1", "8.8.8.8"):
              answers = query_a(resolver)
              if expected not in answers:
                  print(f"{resolver} returned {answers!r} for {name}, expected {expected}.", file=sys.stderr)
                  sys.exit(1)
          PY

      - name: Upload routing result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: backend-cloudflare-routing
          path: ${{ runner.temp }}/backend-cloudflare-routing.json
          if-no-files-found: ignore
