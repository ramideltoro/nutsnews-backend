name: Backend Credential Readiness

on:
  workflow_dispatch:
    inputs:
      group:
        description: Optional credential group to check, such as cloudflare, grafana, supabase, rabbitmq, restic, reporting_email, worker_api, worker_uplift_ai, backend_apply.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: backend-credential-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readiness:
    name: Check production-backend credential metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Validate credential inventory
        shell: bash
        run: python3 scripts/validate_backend_credential_inventory.py

      - name: Read production-backend credential metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.NUTSNEWS_MAINTENANCE_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$GH_TOKEN" ]]; then
            echo "Missing required repository metadata-reader secret: NUTSNEWS_MAINTENANCE_GITHUB_TOKEN" >&2
            exit 1
          fi

          gh api \
            --paginate \
            --slurp \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/environments/production-backend/secrets?per_page=100" \
            > "$RUNNER_TEMP/production-backend-secret-metadata.json"
          gh api \
            --paginate \
            --slurp \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/environments/production-backend/variables?per_page=100" \
            > "$RUNNER_TEMP/production-backend-variable-metadata.json"

      - name: Check credential readiness
        shell: bash
        env:
          REQUESTED_GROUP: ${{ inputs.group }}
        run: |
          set -euo pipefail

          args=(
            --json
            --environment-secrets-json "$RUNNER_TEMP/production-backend-secret-metadata.json"
            --environment-variables-json "$RUNNER_TEMP/production-backend-variable-metadata.json"
          )
          if [[ -n "$REQUESTED_GROUP" ]]; then
            args+=(--group "$REQUESTED_GROUP")
          fi

          python3 scripts/check_backend_credential_readiness.py "${args[@]}"
