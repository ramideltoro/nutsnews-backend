name: Backend Drift Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-drift-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  drift:
    name: Check backend drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-backend

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Prepare SSH material
        shell: bash
        env:
          NUTSNEWS_BACKEND_SSH_PRIVATE_KEY: ${{ secrets.NUTSNEWS_BACKEND_SSH_PRIVATE_KEY }}
          NUTSNEWS_BACKEND_KNOWN_HOSTS: ${{ secrets.NUTSNEWS_BACKEND_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$NUTSNEWS_BACKEND_SSH_PRIVATE_KEY" > "$HOME/.ssh/nutsnews_backend"
          chmod 0600 "$HOME/.ssh/nutsnews_backend"

          printf '%s\n' "$NUTSNEWS_BACKEND_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

          ssh-keygen -y -f "$HOME/.ssh/nutsnews_backend" > /dev/null
          ssh-keygen -F 65.75.201.18 -f "$HOME/.ssh/known_hosts" > /dev/null

      - name: Run read-only drift check
        shell: bash
        env:
          NUTSNEWS_BACKEND_HOST: ${{ vars.NUTSNEWS_BACKEND_HOST }}
          NUTSNEWS_BACKEND_ANSIBLE_USER: ${{ secrets.NUTSNEWS_BACKEND_ANSIBLE_USER }}
        run: |
          set -euo pipefail

          ssh_user="${NUTSNEWS_BACKEND_ANSIBLE_USER:-rami}"
          python3 scripts/backend_drift_check.py \
            --ssh-host "$NUTSNEWS_BACKEND_HOST" \
            --ssh-user "$ssh_user" \
            --ssh-key "$HOME/.ssh/nutsnews_backend" \
            --known-hosts "$HOME/.ssh/known_hosts" \
            --output "$RUNNER_TEMP/backend-drift-report.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Print drift report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/backend-drift-report.json" ]]; then
            cat "$RUNNER_TEMP/backend-drift-report.json"
          else
            echo "No drift report was generated."
          fi

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: backend-drift-report
          path: ${{ runner.temp }}/backend-drift-report.json
          if-no-files-found: ignore
