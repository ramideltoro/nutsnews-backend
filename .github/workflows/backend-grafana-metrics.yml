name: Backend Grafana Spec Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-grafana-spec-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate backend Grafana catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Validate dashboard specs
        shell: bash
        run: python3 scripts/provision_grafana_metrics.py --check --output "$RUNNER_TEMP/backend-grafana-metrics-report.json"

      - name: Upload Grafana metrics report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: backend-grafana-metrics-report
          path: ${{ runner.temp }}/backend-grafana-metrics-report.json
          if-no-files-found: ignore
