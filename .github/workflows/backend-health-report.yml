name: Backend Health Report

on:
  workflow_dispatch:
    inputs:
      send_email:
        description: Send the report through configured SMTP credentials.
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "17 12 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: backend-health-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    name: Generate backend health report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Prepare restricted SSH material
        shell: bash
        env:
          NUTSNEWS_BACKEND_SSH_PRIVATE_KEY: ${{ secrets.NUTSNEWS_BACKEND_SSH_PRIVATE_KEY }}
          NUTSNEWS_BACKEND_KNOWN_HOSTS: ${{ secrets.NUTSNEWS_BACKEND_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          missing=0
          for secret_name in NUTSNEWS_BACKEND_SSH_PRIVATE_KEY NUTSNEWS_BACKEND_KNOWN_HOSTS; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing required repository secret: $secret_name" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit "$missing"
          fi

          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$NUTSNEWS_BACKEND_SSH_PRIVATE_KEY" > "$HOME/.ssh/nutsnews_backend_report"
          chmod 0600 "$HOME/.ssh/nutsnews_backend_report"

          printf '%s\n' "$NUTSNEWS_BACKEND_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

          ssh-keygen -y -f "$HOME/.ssh/nutsnews_backend_report" > /dev/null
          ssh-keygen -F 65.75.201.18 -f "$HOME/.ssh/known_hosts" > /dev/null

      - name: Download previous health report state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/previous-health"
          previous_run="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow backend-health-report.yml \
              --branch main \
              --status completed \
              --limit 5 \
              --json databaseId \
            | jq -r --arg current "$GITHUB_RUN_ID" '[.[] | select((.databaseId | tostring) != $current)][0].databaseId // empty'
          )"
          if [[ -n "$previous_run" ]]; then
            gh run download "$previous_run" \
              --repo "$GITHUB_REPOSITORY" \
              --name backend-health-report \
              --dir "$RUNNER_TEMP/previous-health" || true
          fi

      - name: Generate report
        id: health_report
        shell: bash
        env:
          NUTSNEWS_BACKEND_HOST: ${{ vars.NUTSNEWS_BACKEND_HOST || '65.75.201.18' }}
          NUTSNEWS_BACKEND_ANSIBLE_USER: ${{ secrets.NUTSNEWS_BACKEND_ANSIBLE_USER }}
          NUTSNEWS_REPORT_SMTP_HOST: ${{ secrets.NUTSNEWS_REPORT_SMTP_HOST }}
          NUTSNEWS_REPORT_SMTP_USERNAME: ${{ secrets.NUTSNEWS_REPORT_SMTP_USERNAME }}
          NUTSNEWS_REPORT_SMTP_PASSWORD: ${{ secrets.NUTSNEWS_REPORT_SMTP_PASSWORD }}
          NUTSNEWS_REPORT_EMAIL_FROM: ${{ secrets.NUTSNEWS_REPORT_EMAIL_FROM }}
          NUTSNEWS_REPORT_EMAIL_TO: ${{ secrets.NUTSNEWS_REPORT_EMAIL_TO }}
          NUTSNEWS_REPORT_SMTP_PORT: ${{ vars.NUTSNEWS_REPORT_SMTP_PORT || '587' }}
          NUTSNEWS_REPORT_SMTP_STARTTLS: ${{ vars.NUTSNEWS_REPORT_SMTP_STARTTLS || 'true' }}
          NUTSNEWS_REPORT_SUBJECT_PREFIX: ${{ vars.NUTSNEWS_REPORT_SUBJECT_PREFIX || '[NutsNews backend]' }}
          SEND_EMAIL_INPUT: ${{ github.event_name == 'schedule' && 'true' || inputs.send_email }}
        run: |
          set -euo pipefail

          args=(
            --ssh-host "$NUTSNEWS_BACKEND_HOST"
            --ssh-user "${NUTSNEWS_BACKEND_ANSIBLE_USER:-rami}"
            --ssh-key "$HOME/.ssh/nutsnews_backend_report"
            --known-hosts "$HOME/.ssh/known_hosts"
            --output "$RUNNER_TEMP/backend-health-report.json"
            --summary "$GITHUB_STEP_SUMMARY"
            --previous-state "$RUNNER_TEMP/previous-health/backend-health-report.json"
            --fail-on-critical
          )

          if [[ "$SEND_EMAIL_INPUT" == "true" ]]; then
            args+=(--send-email)
          fi

          python3 scripts/backend_health_report.py "${args[@]}"

      - name: Publish bounded health audit state to host metrics
        if: always()
        shell: bash
        env:
          HEALTH_REPORT_STEP_OUTCOME: ${{ steps.health_report.outcome }}
          NUTSNEWS_BACKEND_HOST: ${{ vars.NUTSNEWS_BACKEND_HOST || '65.75.201.18' }}
          NUTSNEWS_BACKEND_ANSIBLE_USER: ${{ secrets.NUTSNEWS_BACKEND_ANSIBLE_USER }}
        run: |
          set -euo pipefail

          ssh_host="$NUTSNEWS_BACKEND_HOST"
          ssh_user="${NUTSNEWS_BACKEND_ANSIBLE_USER:-rami}"
          if [[ ! "$ssh_host" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "NUTSNEWS_BACKEND_HOST is not a safe SSH host." >&2
            exit 1
          fi
          if [[ ! "$ssh_user" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo "NUTSNEWS_BACKEND_ANSIBLE_USER is not a safe SSH user." >&2
            exit 1
          fi

          ssh_options=(
            -i "$HOME/.ssh/nutsnews_backend_report"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          previous_host_state="$RUNNER_TEMP/previous-host-health-audit-state.json"
          if ! ssh "${ssh_options[@]}" "$ssh_user@$ssh_host" \
            'if test -r /var/lib/nutsnews/health-audit/last-run.json; then cat /var/lib/nutsnews/health-audit/last-run.json; else printf "{}\n"; fi' \
            > "$previous_host_state"; then
            echo "Unable to read prior bounded host state; refusing to overwrite it." >&2
            exit 1
          fi

          python3 scripts/backend_health_audit_state.py \
            --report "$RUNNER_TEMP/backend-health-report.json" \
            --previous-report "$RUNNER_TEMP/previous-health/backend-health-report.json" \
            --previous-state "$previous_host_state" \
            --step-outcome "$HEALTH_REPORT_STEP_OUTCOME" \
            --output "$RUNNER_TEMP/backend-health-audit-state.json"

          if ! remote_tmp="$(
            ssh "${ssh_options[@]}" "$ssh_user@$ssh_host" \
              'mktemp /tmp/nutsnews-health-audit.XXXXXXXX.json'
          )"; then
            echo "Unable to allocate bounded remote health-audit state." >&2
            exit 1
          fi
          if [[ ! "$remote_tmp" =~ ^/tmp/nutsnews-health-audit\.[A-Za-z0-9]+\.json$ ]]; then
            echo "Remote health-audit state path failed validation." >&2
            exit 1
          fi

          scp "${ssh_options[@]}" \
            "$RUNNER_TEMP/backend-health-audit-state.json" \
            "$ssh_user@$ssh_host:$remote_tmp"
          # The only client-expanded value in the remote command is constrained
          # above to the fixed mktemp path grammar.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$ssh_user@$ssh_host" \
            "set -eu; test -f '$remote_tmp'; sudo -n install -d -m 0755 -o root -g root /var/lib/nutsnews/health-audit; stage=\$(sudo -n mktemp /var/lib/nutsnews/health-audit/.last-run.XXXXXXXX.json); case \"\$stage\" in /var/lib/nutsnews/health-audit/.last-run.*.json) ;; *) exit 1 ;; esac; sudo -n install -m 0644 -o root -g root '$remote_tmp' \"\$stage\"; sudo -n mv -T -- \"\$stage\" /var/lib/nutsnews/health-audit/last-run.json; rm -- '$remote_tmp'"

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: backend-health-report
          path: ${{ runner.temp }}/backend-health-report.json
          if-no-files-found: error
