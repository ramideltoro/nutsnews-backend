name: Backend Health Report

on:
  workflow_dispatch:
    inputs:
      send_email:
        description: Send the report through configured SMTP credentials.
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "17 12 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: backend-health-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    name: Generate backend health report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Prepare read-only SSH material
        shell: bash
        env:
          NUTSNEWS_BACKEND_HOST: ${{ vars.NUTSNEWS_BACKEND_HOST || '65.75.201.18' }}
          NUTSNEWS_BACKEND_ANSIBLE_USER: ${{ secrets.NUTSNEWS_BACKEND_ANSIBLE_USER }}
          NUTSNEWS_BACKEND_SSH_PRIVATE_KEY: ${{ secrets.NUTSNEWS_BACKEND_SSH_PRIVATE_KEY }}
          NUTSNEWS_BACKEND_KNOWN_HOSTS: ${{ secrets.NUTSNEWS_BACKEND_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          ssh_user="${NUTSNEWS_BACKEND_ANSIBLE_USER:-rami}"
          if [[ "$NUTSNEWS_BACKEND_HOST" != "65.75.201.18" ]]; then
            echo "NUTSNEWS_BACKEND_HOST must be the canonical backend IPv4 address." >&2
            exit 1
          fi
          if [[ "$ssh_user" != "rami" ]]; then
            echo "NUTSNEWS_BACKEND_ANSIBLE_USER must select the fixed read-only audit account." >&2
            exit 1
          fi

          missing=0
          for secret_name in NUTSNEWS_BACKEND_SSH_PRIVATE_KEY NUTSNEWS_BACKEND_KNOWN_HOSTS; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing required repository secret: $secret_name" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit "$missing"
          fi

          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$NUTSNEWS_BACKEND_SSH_PRIVATE_KEY" > "$HOME/.ssh/nutsnews_backend_report"
          chmod 0600 "$HOME/.ssh/nutsnews_backend_report"

          printf '%s\n' "$NUTSNEWS_BACKEND_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

          ssh-keygen -y -f "$HOME/.ssh/nutsnews_backend_report" > /dev/null
          ssh-keygen -F "$NUTSNEWS_BACKEND_HOST" -f "$HOME/.ssh/known_hosts" > /dev/null

      - name: Download previous health report state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/previous-health"
          previous_run="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow backend-health-report.yml \
              --branch main \
              --status completed \
              --limit 5 \
              --json databaseId \
            | jq -r --arg current "$GITHUB_RUN_ID" '[.[] | select((.databaseId | tostring) != $current)][0].databaseId // empty'
          )"
          if [[ -n "$previous_run" ]]; then
            gh run download "$previous_run" \
              --repo "$GITHUB_REPOSITORY" \
              --name backend-health-report \
              --dir "$RUNNER_TEMP/previous-health" || true
          fi

      - name: Generate report and bounded publication event
        id: generate_report
        shell: bash
        env:
          NUTSNEWS_BACKEND_HOST: ${{ vars.NUTSNEWS_BACKEND_HOST || '65.75.201.18' }}
          NUTSNEWS_BACKEND_ANSIBLE_USER: ${{ secrets.NUTSNEWS_BACKEND_ANSIBLE_USER }}
          NUTSNEWS_REPORT_SMTP_HOST: ${{ secrets.NUTSNEWS_REPORT_SMTP_HOST }}
          NUTSNEWS_REPORT_SMTP_USERNAME: ${{ secrets.NUTSNEWS_REPORT_SMTP_USERNAME }}
          NUTSNEWS_REPORT_SMTP_PASSWORD: ${{ secrets.NUTSNEWS_REPORT_SMTP_PASSWORD }}
          NUTSNEWS_REPORT_EMAIL_FROM: ${{ secrets.NUTSNEWS_REPORT_EMAIL_FROM }}
          NUTSNEWS_REPORT_EMAIL_TO: ${{ secrets.NUTSNEWS_REPORT_EMAIL_TO }}
          NUTSNEWS_REPORT_SMTP_PORT: ${{ vars.NUTSNEWS_REPORT_SMTP_PORT || '587' }}
          NUTSNEWS_REPORT_SMTP_STARTTLS: ${{ vars.NUTSNEWS_REPORT_SMTP_STARTTLS || 'true' }}
          NUTSNEWS_REPORT_SUBJECT_PREFIX: ${{ vars.NUTSNEWS_REPORT_SUBJECT_PREFIX || '[NutsNews backend]' }}
          SEND_EMAIL_INPUT: ${{ github.event_name == 'schedule' && 'true' || inputs.send_email }}
        run: |
          set -euo pipefail

          args=(
            --ssh-host "$NUTSNEWS_BACKEND_HOST"
            --ssh-user "${NUTSNEWS_BACKEND_ANSIBLE_USER:-rami}"
            --ssh-key "$HOME/.ssh/nutsnews_backend_report"
            --known-hosts "$HOME/.ssh/known_hosts"
            --output "$RUNNER_TEMP/backend-health-report.json"
            --summary "$GITHUB_STEP_SUMMARY"
            --previous-state "$RUNNER_TEMP/previous-health/backend-health-report.json"
          )

          if [[ "$SEND_EMAIL_INPUT" == "true" ]]; then
            args+=(--send-email)
          fi

          report_exit=0
          python3 scripts/backend_health_report.py "${args[@]}" || report_exit=$?

          umask 077
          python3 ansible/roles/backend_baseline/files/nutsnews_health_audit_state.py event \
            --report "$RUNNER_TEMP/backend-health-report.json" \
            > "$RUNNER_TEMP/backend-health-audit-event.json"

          exit "$report_exit"

      - name: Publish bounded health-audit state to backend
        if: ${{ always() && vars.NUTSNEWS_HEALTH_AUDIT_REMOTE_PUBLISH_ENABLED == 'true' }}
        shell: bash
        env:
          NUTSNEWS_BACKEND_HOST: ${{ vars.NUTSNEWS_BACKEND_HOST || '65.75.201.18' }}
          NUTSNEWS_BACKEND_ANSIBLE_USER: ${{ secrets.NUTSNEWS_BACKEND_ANSIBLE_USER }}
        run: |
          set -euo pipefail

          ssh_user="${NUTSNEWS_BACKEND_ANSIBLE_USER:-rami}"
          if [[ "$NUTSNEWS_BACKEND_HOST" != "65.75.201.18" || "$ssh_user" != "rami" ]]; then
            echo "Refusing health-audit publication to a non-canonical SSH target." >&2
            exit 1
          fi
          if [[ ! -s "$RUNNER_TEMP/backend-health-audit-event.json" ]]; then
            echo "The bounded health-audit event was not produced." >&2
            exit 1
          fi

          ssh_args=(
            -i "$HOME/.ssh/nutsnews_backend_report"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$HOME/.ssh/known_hosts"
            -o ConnectTimeout=10
          )
          timeout 30s ssh "${ssh_args[@]}" \
            "$ssh_user@$NUTSNEWS_BACKEND_HOST" \
            'sudo -n /usr/local/sbin/nutsnews-health-audit-state write' \
            < "$RUNNER_TEMP/backend-health-audit-event.json"
          echo "- Remote bounded state publication: \`success\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: backend-health-report
          path: ${{ runner.temp }}/backend-health-report.json
          if-no-files-found: error
