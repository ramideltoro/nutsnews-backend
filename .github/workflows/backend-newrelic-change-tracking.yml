name: Backend New Relic Change Tracking

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-newrelic-change-tracking-${{ github.ref }}
  cancel-in-progress: false

jobs:
  marker:
    name: Record deployment marker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Record New Relic change marker
        shell: bash
        env:
          NEW_RELIC_USER_KEY: ${{ secrets.NEW_RELIC_USER_KEY }}
          NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION || 'us' }}
          NEW_RELIC_ENTITY_GUID: ${{ secrets.NEW_RELIC_ENTITY_GUID }}
          NEW_RELIC_DEPLOY_ENVIRONMENT: production
          NEW_RELIC_DEPLOY_VERSION: ${{ github.sha }}
          NEW_RELIC_DEPLOY_DESCRIPTION: ${{ github.ref_name }}
          NEW_RELIC_DEPLOY_USER: ${{ github.actor }}
        run: python3 scripts/newrelic_change_tracking.py --skip-without-credentials
