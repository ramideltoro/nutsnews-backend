name: Backend PostgreSQL Parity Validation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run offline validation, compare staging Supabase to backend rehearsal PostgreSQL, or compare production Supabase behavior to backend primary shadow.
        required: true
        default: offline
        type: choice
        options:
          - offline
          - validate-staging
          - validate-production-shadow

permissions:
  contents: read

concurrency:
  group: backend-postgres-parity-validation
  cancel-in-progress: false

jobs:
  validate:
    name: PostgreSQL parity validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-backend

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Validate inputs
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "$MODE" in
            offline|validate-staging|validate-production-shadow) ;;
            *) echo "Unsupported mode: $MODE" >&2; exit 1 ;;
          esac

      - name: Run offline parity validator
        if: inputs.mode == 'offline'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/backend_postgres_parity_validate.py \
            --offline \
            --output "$RUNNER_TEMP/backend-postgres-parity-validation.json"
          python3 scripts/backend_postgres_behavior_parity_validate.py \
            --offline \
            --output "$RUNNER_TEMP/backend-postgres-behavior-parity-validation.json"

      - name: Validate protected staging comparison secrets
        if: inputs.mode == 'validate-staging'
        shell: bash
        env:
          NUTSNEWS_STAGING_SUPABASE_DB_URL: ${{ secrets.NUTSNEWS_STAGING_SUPABASE_DB_URL }}
          NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD }}
          NUTSNEWS_BACKEND_SSH_PRIVATE_KEY: ${{ secrets.NUTSNEWS_BACKEND_SSH_PRIVATE_KEY }}
          NUTSNEWS_BACKEND_KNOWN_HOSTS: ${{ secrets.NUTSNEWS_BACKEND_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=0
          for name in NUTSNEWS_STAGING_SUPABASE_DB_URL NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD NUTSNEWS_BACKEND_SSH_PRIVATE_KEY NUTSNEWS_BACKEND_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required production-backend secret: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Validate protected production shadow behavior secrets
        if: inputs.mode == 'validate-production-shadow'
        shell: bash
        env:
          NUTSNEWS_PRODUCTION_SUPABASE_DB_DIRECT_URL: ${{ secrets.NUTSNEWS_PRODUCTION_SUPABASE_DB_DIRECT_URL }}
          NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD }}
          NUTSNEWS_BACKEND_SSH_PRIVATE_KEY: ${{ secrets.NUTSNEWS_BACKEND_SSH_PRIVATE_KEY }}
          NUTSNEWS_BACKEND_KNOWN_HOSTS: ${{ secrets.NUTSNEWS_BACKEND_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=0
          for name in NUTSNEWS_PRODUCTION_SUPABASE_DB_DIRECT_URL NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD NUTSNEWS_BACKEND_SSH_PRIVATE_KEY NUTSNEWS_BACKEND_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required production-backend secret: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Prepare SSH material
        if: inputs.mode == 'validate-staging' || inputs.mode == 'validate-production-shadow'
        shell: bash
        env:
          NUTSNEWS_BACKEND_SSH_PRIVATE_KEY: ${{ secrets.NUTSNEWS_BACKEND_SSH_PRIVATE_KEY }}
          NUTSNEWS_BACKEND_KNOWN_HOSTS: ${{ secrets.NUTSNEWS_BACKEND_KNOWN_HOSTS }}
          NUTSNEWS_BACKEND_HOST: ${{ vars.NUTSNEWS_BACKEND_HOST || '65.75.201.18' }}
          NUTSNEWS_BACKEND_ANSIBLE_USER: ${{ secrets.NUTSNEWS_BACKEND_ANSIBLE_USER }}
        run: |
          set -euo pipefail
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$NUTSNEWS_BACKEND_SSH_PRIVATE_KEY" > "$HOME/.ssh/nutsnews_backend"
          chmod 0600 "$HOME/.ssh/nutsnews_backend"
          printf '%s\n' "$NUTSNEWS_BACKEND_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/nutsnews_backend" > /dev/null
          ssh-keygen -F "$NUTSNEWS_BACKEND_HOST" -f "$HOME/.ssh/known_hosts" > /dev/null

          ssh_user="${NUTSNEWS_BACKEND_ANSIBLE_USER:-rami}"
          ssh \
            -i "$HOME/.ssh/nutsnews_backend" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$ssh_user@$NUTSNEWS_BACKEND_HOST" true

      - name: Run protected staging parity validation
        if: inputs.mode == 'validate-staging'
        shell: bash
        env:
          NUTSNEWS_STAGING_SUPABASE_DB_URL: ${{ secrets.NUTSNEWS_STAGING_SUPABASE_DB_URL }}
          NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD }}
          NUTSNEWS_BACKEND_POSTGRES_REHEARSAL_DATABASE: ${{ vars.NUTSNEWS_BACKEND_POSTGRES_REHEARSAL_DATABASE || 'nutsnews_restore_rehearsal' }}
          NUTSNEWS_BACKEND_HOST: ${{ vars.NUTSNEWS_BACKEND_HOST || '65.75.201.18' }}
          NUTSNEWS_BACKEND_ANSIBLE_USER: ${{ secrets.NUTSNEWS_BACKEND_ANSIBLE_USER }}
        run: |
          set -euo pipefail

          target_url="$(python3 - <<'PY'
          import os
          from urllib.parse import quote

          user = quote("nutsnews_migration_validation", safe="")
          password = quote(os.environ["NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD"], safe="")
          database = quote(os.environ["NUTSNEWS_BACKEND_POSTGRES_REHEARSAL_DATABASE"], safe="")
          print(f"postgresql://{user}:{password}@127.0.0.1:5432/{database}")
          PY
          )"
          echo "::add-mask::$NUTSNEWS_STAGING_SUPABASE_DB_URL"
          echo "::add-mask::$target_url"
          ssh_user="${NUTSNEWS_BACKEND_ANSIBLE_USER:-rami}"
          remote_dir="/tmp/nutsnews-postgres-parity-validation-${GITHUB_RUN_ID}"
          ssh -i "$HOME/.ssh/nutsnews_backend" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$ssh_user@$NUTSNEWS_BACKEND_HOST" \
            "install -m 0700 -d '$remote_dir/scripts' '$remote_dir/docs'"
          scp -i "$HOME/.ssh/nutsnews_backend" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            scripts/backend_postgres_parity_validate.py \
            "$ssh_user@$NUTSNEWS_BACKEND_HOST:$remote_dir/scripts/"
          scp -i "$HOME/.ssh/nutsnews_backend" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            docs/supabase-backend-postgres-parity.json \
            "$ssh_user@$NUTSNEWS_BACKEND_HOST:$remote_dir/docs/"
          set +e
          ssh -i "$HOME/.ssh/nutsnews_backend" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$ssh_user@$NUTSNEWS_BACKEND_HOST" \
            "cd '$remote_dir' && NUTSNEWS_STAGING_SUPABASE_DB_URL='$NUTSNEWS_STAGING_SUPABASE_DB_URL' NUTSNEWS_BACKEND_TARGET_DB_URL='$target_url' python3 scripts/backend_postgres_parity_validate.py --source-db-url-env NUTSNEWS_STAGING_SUPABASE_DB_URL --target-db-url-env NUTSNEWS_BACKEND_TARGET_DB_URL --enforce --output '$remote_dir/backend-postgres-parity-validation.json'"
          rc="$?"
          set -e
          scp -i "$HOME/.ssh/nutsnews_backend" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$ssh_user@$NUTSNEWS_BACKEND_HOST:$remote_dir/backend-postgres-parity-validation.json" \
            "$RUNNER_TEMP/backend-postgres-parity-validation.json" || true
          exit "$rc"

      - name: Run protected production shadow behavior parity validation
        if: inputs.mode == 'validate-production-shadow'
        shell: bash
        env:
          NUTSNEWS_PRODUCTION_SUPABASE_DB_DIRECT_URL: ${{ secrets.NUTSNEWS_PRODUCTION_SUPABASE_DB_DIRECT_URL }}
          NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD }}
          NUTSNEWS_BACKEND_POSTGRES_PRIMARY_SHADOW_DATABASE: ${{ vars.NUTSNEWS_BACKEND_POSTGRES_PRIMARY_SHADOW_DATABASE || 'nutsnews_primary_shadow' }}
          NUTSNEWS_BACKEND_HOST: ${{ vars.NUTSNEWS_BACKEND_HOST || '65.75.201.18' }}
          NUTSNEWS_BACKEND_ANSIBLE_USER: ${{ secrets.NUTSNEWS_BACKEND_ANSIBLE_USER }}
        run: |
          set -euo pipefail

          if [[ "$NUTSNEWS_BACKEND_POSTGRES_PRIMARY_SHADOW_DATABASE" != "nutsnews_primary_shadow" ]]; then
            echo "Production shadow behavior validation is fixed to nutsnews_primary_shadow." >&2
            exit 1
          fi

          target_url="$(python3 - <<'PY'
          import os
          from urllib.parse import quote

          user = quote("nutsnews_migration_validation", safe="")
          password = quote(os.environ["NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD"], safe="")
          database = quote(os.environ["NUTSNEWS_BACKEND_POSTGRES_PRIMARY_SHADOW_DATABASE"], safe="")
          print(f"postgresql://{user}:{password}@127.0.0.1:5432/{database}")
          PY
          )"
          echo "::add-mask::$NUTSNEWS_PRODUCTION_SUPABASE_DB_DIRECT_URL"
          echo "::add-mask::$target_url"
          ssh_user="${NUTSNEWS_BACKEND_ANSIBLE_USER:-rami}"
          remote_dir="/tmp/nutsnews-postgres-behavior-parity-${GITHUB_RUN_ID}"
          ssh -i "$HOME/.ssh/nutsnews_backend" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$ssh_user@$NUTSNEWS_BACKEND_HOST" \
            "install -m 0700 -d '$remote_dir/scripts' '$remote_dir/docs'"
          scp -i "$HOME/.ssh/nutsnews_backend" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            scripts/backend_postgres_behavior_parity_validate.py \
            "$ssh_user@$NUTSNEWS_BACKEND_HOST:$remote_dir/scripts/"
          scp -i "$HOME/.ssh/nutsnews_backend" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            docs/supabase-backend-postgres-behavior-parity.json \
            "$ssh_user@$NUTSNEWS_BACKEND_HOST:$remote_dir/docs/"
          set +e
          ssh -i "$HOME/.ssh/nutsnews_backend" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$ssh_user@$NUTSNEWS_BACKEND_HOST" \
            "cd '$remote_dir' && NUTSNEWS_PRODUCTION_SUPABASE_DB_DIRECT_URL='$NUTSNEWS_PRODUCTION_SUPABASE_DB_DIRECT_URL' NUTSNEWS_BACKEND_TARGET_DB_URL='$target_url' python3 scripts/backend_postgres_behavior_parity_validate.py --manifest docs/supabase-backend-postgres-behavior-parity.json --source-db-url-env NUTSNEWS_PRODUCTION_SUPABASE_DB_DIRECT_URL --target-db-url-env NUTSNEWS_BACKEND_TARGET_DB_URL --source-label production_supabase --target-label nutsnews_primary_shadow --enforce --output '$remote_dir/backend-postgres-behavior-parity-validation.json'"
          rc="$?"
          set -e
          scp -i "$HOME/.ssh/nutsnews_backend" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$ssh_user@$NUTSNEWS_BACKEND_HOST:$remote_dir/backend-postgres-behavior-parity-validation.json" \
            "$RUNNER_TEMP/backend-postgres-behavior-parity-validation.json" || true
          exit "$rc"

      - name: Summarize safe metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Backend PostgreSQL parity validation"
            echo
            echo "- Mode: \`${{ inputs.mode }}\`"
            echo "- Report artifact contains safe metadata only."
            echo "- Database URLs, passwords, tokens, service-role keys, and row data are not printed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload parity validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: backend-postgres-parity-validation
          path: ${{ runner.temp }}/backend-postgres-parity-validation.json
          if-no-files-found: ignore

      - name: Upload behavior parity validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: backend-postgres-behavior-parity-validation
          path: ${{ runner.temp }}/backend-postgres-behavior-parity-validation.json
          if-no-files-found: ignore
