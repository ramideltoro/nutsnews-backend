name: Backend PostgreSQL Smoke Tests

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run offline metadata checks or protected staging backend PostgreSQL smoke tests.
        required: true
        default: offline
        type: choice
        options:
          - offline
          - validate-staging

permissions:
  contents: read

concurrency:
  group: backend-postgres-smoke-tests
  cancel-in-progress: false

jobs:
  smoke:
    name: PostgreSQL smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-backend

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Validate inputs
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "$MODE" in
            offline|validate-staging) ;;
            *) echo "Unsupported mode: $MODE" >&2; exit 1 ;;
          esac

      - name: Run offline smoke metadata
        if: inputs.mode == 'offline'
        shell: bash
        run: python3 scripts/backend_postgres_smoke_tests.py --offline --output "$RUNNER_TEMP/backend-postgres-smoke-tests.json"

      - name: Validate protected staging secrets
        if: inputs.mode == 'validate-staging'
        shell: bash
        env:
          NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD }}
          NUTSNEWS_BACKEND_SSH_PRIVATE_KEY: ${{ secrets.NUTSNEWS_BACKEND_SSH_PRIVATE_KEY }}
          NUTSNEWS_BACKEND_KNOWN_HOSTS: ${{ secrets.NUTSNEWS_BACKEND_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD \
            NUTSNEWS_BACKEND_SSH_PRIVATE_KEY \
            NUTSNEWS_BACKEND_KNOWN_HOSTS
          do
            if [[ -z "${!name}" ]]; then
              echo "Missing required production-backend secret: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Prepare backend tunnel
        if: inputs.mode == 'validate-staging'
        shell: bash
        env:
          NUTSNEWS_BACKEND_SSH_PRIVATE_KEY: ${{ secrets.NUTSNEWS_BACKEND_SSH_PRIVATE_KEY }}
          NUTSNEWS_BACKEND_KNOWN_HOSTS: ${{ secrets.NUTSNEWS_BACKEND_KNOWN_HOSTS }}
          NUTSNEWS_BACKEND_HOST: ${{ vars.NUTSNEWS_BACKEND_HOST || '65.75.201.18' }}
          NUTSNEWS_BACKEND_ANSIBLE_USER: ${{ secrets.NUTSNEWS_BACKEND_ANSIBLE_USER }}
        run: |
          set -euo pipefail
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$NUTSNEWS_BACKEND_SSH_PRIVATE_KEY" > "$HOME/.ssh/nutsnews_backend"
          chmod 0600 "$HOME/.ssh/nutsnews_backend"
          printf '%s\n' "$NUTSNEWS_BACKEND_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/nutsnews_backend" > /dev/null
          ssh-keygen -F "$NUTSNEWS_BACKEND_HOST" -f "$HOME/.ssh/known_hosts" > /dev/null

          ssh_user="${NUTSNEWS_BACKEND_ANSIBLE_USER:-rami}"
          ssh -fN -L 15432:127.0.0.1:5432 \
            -i "$HOME/.ssh/nutsnews_backend" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$ssh_user@$NUTSNEWS_BACKEND_HOST"

      - name: Run protected staging smoke tests
        if: inputs.mode == 'validate-staging'
        shell: bash
        env:
          NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD }}
          NUTSNEWS_BACKEND_POSTGRES_REHEARSAL_DATABASE: ${{ vars.NUTSNEWS_BACKEND_POSTGRES_REHEARSAL_DATABASE || 'nutsnews_restore_rehearsal' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          target_url="$(python3 - <<'PY'
          import os
          from urllib.parse import quote

          user = quote("nutsnews_migration_validation", safe="")
          password = quote(os.environ["NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD"], safe="")
          database = quote(os.environ["NUTSNEWS_BACKEND_POSTGRES_REHEARSAL_DATABASE"], safe="")
          print(f"postgresql://{user}:{password}@127.0.0.1:15432/{database}")
          PY
          )"
          echo "::add-mask::$target_url"
          NUTSNEWS_BACKEND_TARGET_DB_URL="$target_url" \
            python3 scripts/backend_postgres_smoke_tests.py \
              --target-db-url-env NUTSNEWS_BACKEND_TARGET_DB_URL \
              --enforce \
              --output "$RUNNER_TEMP/backend-postgres-smoke-tests.json"

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: backend-postgres-smoke-tests
          path: ${{ runner.temp }}/backend-postgres-smoke-tests.json
          if-no-files-found: ignore
