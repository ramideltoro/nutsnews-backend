name: Backend RabbitMQ Canary

on:
  workflow_dispatch:
    inputs:
      action:
        description: Fixed RabbitMQ canary action.
        required: true
        default: status
        type: choice
        options:
          - status
          - canary
          - drill
      drill:
        description: Fixed drill to run when action is drill.
        required: false
        default: consumer-loss
        type: choice
        options:
          - restart
          - consumer-loss
          - network-interruption
          - disk-watermark
          - invalid-credentials
          - unroutable
          - full-queue
          - poison-message
          - grafana-connectivity-loss
      confirm_target:
        description: For canary or drill, type backend.nutsnews.com.
        required: false
        default: ""
        type: string
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: backend-rabbitmq-canary
  cancel-in-progress: false

jobs:
  rabbitmq-canary:
    name: RabbitMQ private canary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-backend

    steps:
      - name: Validate dispatch inputs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event_name == 'schedule' && 'canary' || inputs.action }}
          DRILL: ${{ inputs.drill }}
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
        run: |
          set -euo pipefail

          case "$ACTION" in
            status|canary|drill) ;;
            *)
              echo "Unsupported RabbitMQ canary action: $ACTION" >&2
              exit 1
              ;;
          esac

          case "$DRILL" in
            restart|consumer-loss|network-interruption|disk-watermark|invalid-credentials|unroutable|full-queue|poison-message|grafana-connectivity-loss) ;;
            *)
              echo "Unsupported RabbitMQ canary drill: $DRILL" >&2
              exit 1
              ;;
          esac

          if [[ "$EVENT_NAME" != "schedule" && "$ACTION" != "status" && "$CONFIRM_TARGET" != "backend.nutsnews.com" ]]; then
            echo "RabbitMQ canary action $ACTION requires confirm_target to be exactly backend.nutsnews.com." >&2
            exit 1
          fi

      - name: Prepare SSH material
        shell: bash
        env:
          NUTSNEWS_BACKEND_SSH_PRIVATE_KEY: ${{ secrets.NUTSNEWS_BACKEND_SSH_PRIVATE_KEY }}
          NUTSNEWS_BACKEND_KNOWN_HOSTS: ${{ secrets.NUTSNEWS_BACKEND_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          missing=0
          for secret_name in NUTSNEWS_BACKEND_SSH_PRIVATE_KEY NUTSNEWS_BACKEND_KNOWN_HOSTS; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing required production-backend environment secret: $secret_name" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit "$missing"
          fi

          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$NUTSNEWS_BACKEND_SSH_PRIVATE_KEY" > "$HOME/.ssh/nutsnews_backend"
          chmod 0600 "$HOME/.ssh/nutsnews_backend"

          printf '%s\n' "$NUTSNEWS_BACKEND_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

          ssh-keygen -y -f "$HOME/.ssh/nutsnews_backend" > /dev/null
          ssh-keygen -F 65.75.201.18 -f "$HOME/.ssh/known_hosts" > /dev/null

      - name: Run fixed RabbitMQ canary action
        shell: bash
        env:
          ACTION: ${{ github.event_name == 'schedule' && 'canary' || inputs.action }}
          DRILL: ${{ inputs.drill }}
          NUTSNEWS_BACKEND_HOST: ${{ vars.NUTSNEWS_BACKEND_HOST || '65.75.201.18' }}
          NUTSNEWS_BACKEND_ANSIBLE_USER: ${{ secrets.NUTSNEWS_BACKEND_ANSIBLE_USER }}
        run: |
          set -euo pipefail

          ssh_user="${NUTSNEWS_BACKEND_ANSIBLE_USER:-rami}"
          ssh_base=(
            ssh
            -i "$HOME/.ssh/nutsnews_backend"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )

          case "$ACTION" in
            status)
              fixed_action="if sudo -n test -r /var/lib/nutsnews/rabbitmq-probes/last-canary.json; then sudo -n cat /var/lib/nutsnews/rabbitmq-probes/last-canary.json; else printf '%s\n' '{\"action\":\"status\",\"status\":\"not_configured\"}'; fi"
              ;;
            canary)
              fixed_action="sudo -n /usr/local/sbin/nutsnews-rabbitmq-probe canary --env /etc/nutsnews-rabbitmq/rabbitmq.env --credentials-env /etc/nutsnews-rabbitmq/topology.env --definition /etc/nutsnews-rabbitmq/worker-uplift-topology.json --output /var/lib/nutsnews/rabbitmq-probes/last-canary.json --metrics-output /var/lib/nutsnews/metrics/rabbitmq-canary.prom"
              ;;
            drill)
              fixed_action="sudo -n /usr/local/sbin/nutsnews-rabbitmq-probe drill --env /etc/nutsnews-rabbitmq/rabbitmq.env --credentials-env /etc/nutsnews-rabbitmq/topology.env --definition /etc/nutsnews-rabbitmq/worker-uplift-topology.json --drill '$DRILL' --output /var/lib/nutsnews/rabbitmq-probes/last-canary-drill.json --metrics-output /var/lib/nutsnews/metrics/rabbitmq-canary.prom"
              ;;
          esac

          "${ssh_base[@]}" "$ssh_user@$NUTSNEWS_BACKEND_HOST" "$fixed_action" \
            | tee "$RUNNER_TEMP/backend-rabbitmq-canary-report.json"

      - name: Summarize RabbitMQ canary report
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "$RUNNER_TEMP/backend-rabbitmq-canary-report.json" ]]; then
            echo "No RabbitMQ canary report was generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 - "$RUNNER_TEMP/backend-rabbitmq-canary-report.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          lines = [
              "# Backend RabbitMQ Canary",
              "",
              f"- Action: `{report.get('action', 'unknown')}`",
              f"- Status: `{report.get('status', 'unknown')}`",
              f"- Failure mode: `{report.get('failure_mode', report.get('drill', 'none'))}`",
          ]
          checks = report.get("checks") or report.get("steps")
          if isinstance(checks, list):
              lines.extend(["", "| Check | Status | Summary |", "| --- | --- | --- |"])
              for check in checks:
                  lines.append(f"| `{check.get('name', 'unknown')}` | `{check.get('status', 'unknown')}` | {check.get('summary', '')} |")
          Path(sys.argv[2]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload RabbitMQ canary report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: backend-rabbitmq-canary-report
          path: ${{ runner.temp }}/backend-rabbitmq-canary-report.json
          if-no-files-found: ignore
