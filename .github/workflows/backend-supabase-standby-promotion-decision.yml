name: Backend Supabase Standby Promotion Decision

on:
  workflow_dispatch:
    inputs:
      failover_attempt_id:
        description: Stable failover attempt identifier shared by all six gate artifacts.
        required: true
        type: string
      candidate_application_revision:
        description: Backend commit SHA expected to match this protected main run.
        required: true
        type: string
      fence_epoch:
        description: Explicit provider lease epoch used by the split-brain fence gate.
        required: true
        type: string
      lag_gate_run_id:
        description: Successful Backend Supabase Standby Lag Gate run id for this attempt.
        required: true
        type: string
      parity_gate_run_id:
        description: Successful Backend Supabase Standby Parity Gate run id for this attempt.
        required: true
        type: string
      schema_gate_run_id:
        description: Successful Backend Supabase Standby Schema Gate run id for this attempt.
        required: true
        type: string
      sequence_gate_run_id:
        description: Successful Backend Supabase Standby Sequence Gate run id for this attempt.
        required: true
        type: string
      writer_pause_gate_run_id:
        description: Successful Backend Supabase Standby Writer Pause Gate run id for this attempt.
        required: true
        type: string
      split_brain_fence_gate_run_id:
        description: Successful Backend Supabase Standby Split-Brain Fence Gate run id for this attempt.
        required: true
        type: string
      confirmation:
        description: Type evaluate-standby-promotion-decision to run the combined decision.
        required: true
        type: string
      enforce:
        description: Return non-zero when the decision is NO-GO.
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: backend-supabase-standby-promotion-decision-${{ inputs.failover_attempt_id }}
  cancel-in-progress: false

jobs:
  decide:
    name: Evaluate standby promotion decision
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-backend
    env:
      CANDIDATE_APPLICATION_REVISION: ${{ inputs.candidate_application_revision }}
      CONFIRMATION: ${{ inputs.confirmation }}
      ENFORCE: ${{ inputs.enforce }}
      FAILOVER_ATTEMPT_ID: ${{ inputs.failover_attempt_id }}
      FENCE_EPOCH: ${{ inputs.fence_epoch }}
      GH_TOKEN: ${{ github.token }}
      LAG_GATE_RUN_ID: ${{ inputs.lag_gate_run_id }}
      PARITY_GATE_RUN_ID: ${{ inputs.parity_gate_run_id }}
      SCHEMA_GATE_RUN_ID: ${{ inputs.schema_gate_run_id }}
      SEQUENCE_GATE_RUN_ID: ${{ inputs.sequence_gate_run_id }}
      SPLIT_BRAIN_FENCE_GATE_RUN_ID: ${{ inputs.split_brain_fence_gate_run_id }}
      WRITER_PAUSE_GATE_RUN_ID: ${{ inputs.writer_pause_gate_run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Validate dispatch inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "This decision only runs from main." >&2
            exit 1
          fi
          if [[ "$CONFIRMATION" != "evaluate-standby-promotion-decision" ]]; then
            echo "Invalid promotion decision confirmation." >&2
            exit 1
          fi
          if ! [[ "$FAILOVER_ATTEMPT_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]; then
            echo "Invalid failover_attempt_id." >&2
            exit 1
          fi
          if ! [[ "$FENCE_EPOCH" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]; then
            echo "Invalid fence_epoch." >&2
            exit 1
          fi
          if ! [[ "$CANDIDATE_APPLICATION_REVISION" =~ ^[A-Fa-f0-9]{40}$ ]]; then
            echo "Invalid candidate_application_revision." >&2
            exit 1
          fi
          if [[ "$CANDIDATE_APPLICATION_REVISION" != "$GITHUB_SHA" ]]; then
            echo "Candidate application revision must match this main revision." >&2
            exit 1
          fi
          for run_id in \
            "$LAG_GATE_RUN_ID" \
            "$PARITY_GATE_RUN_ID" \
            "$SCHEMA_GATE_RUN_ID" \
            "$SEQUENCE_GATE_RUN_ID" \
            "$WRITER_PAUSE_GATE_RUN_ID" \
            "$SPLIT_BRAIN_FENCE_GATE_RUN_ID"
          do
            if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
              echo "Gate run ids must be numeric." >&2
              exit 1
            fi
          done

      - name: Validate promotion decision implementation
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/validate_backend_supabase_standby_promotion_decision.py
          python3 -m unittest tests.test_backend_supabase_standby_promotion_decision
          python3 -m unittest tests.test_backend_database_provider_switch

      - name: Download gate artifacts
        shell: bash
        run: |
          set -euo pipefail

          download_gate() {
            local run_id="$1"
            local artifact_name="$2"
            local dir_name="$3"
            local file_name="$4"
            mkdir -p "$RUNNER_TEMP/$dir_name"
            gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$artifact_name" \
              --dir "$RUNNER_TEMP/$dir_name"
            test -s "$RUNNER_TEMP/$dir_name/$file_name"
          }

          download_gate "$LAG_GATE_RUN_ID" "backend-supabase-standby-lag-gate" "lag-gate" "backend-supabase-standby-lag-gate.json"
          download_gate "$PARITY_GATE_RUN_ID" "backend-supabase-standby-parity-gate" "parity-gate" "backend-supabase-standby-parity-gate.json"
          download_gate "$SCHEMA_GATE_RUN_ID" "backend-supabase-standby-schema-gate" "schema-gate" "backend-supabase-standby-schema-gate.json"
          download_gate "$SEQUENCE_GATE_RUN_ID" "backend-supabase-standby-sequence-gate" "sequence-gate" "backend-supabase-standby-sequence-gate.json"
          download_gate "$WRITER_PAUSE_GATE_RUN_ID" "backend-supabase-standby-writer-pause-gate" "writer-pause-gate" "backend-supabase-standby-writer-pause-gate.json"
          download_gate "$SPLIT_BRAIN_FENCE_GATE_RUN_ID" "backend-supabase-standby-split-brain-fence-gate" "split-brain-fence-gate" "backend-supabase-standby-split-brain-fence-gate.json"

      - name: Evaluate combined promotion decision
        shell: bash
        run: |
          set -euo pipefail

          args=(
            --lag-gate "$RUNNER_TEMP/lag-gate/backend-supabase-standby-lag-gate.json"
            --parity-gate "$RUNNER_TEMP/parity-gate/backend-supabase-standby-parity-gate.json"
            --schema-gate "$RUNNER_TEMP/schema-gate/backend-supabase-standby-schema-gate.json"
            --sequence-gate "$RUNNER_TEMP/sequence-gate/backend-supabase-standby-sequence-gate.json"
            --writer-pause-gate "$RUNNER_TEMP/writer-pause-gate/backend-supabase-standby-writer-pause-gate.json"
            --split-brain-fence-gate "$RUNNER_TEMP/split-brain-fence-gate/backend-supabase-standby-split-brain-fence-gate.json"
            --failover-attempt-id "$FAILOVER_ATTEMPT_ID"
            --candidate-application-revision "$CANDIDATE_APPLICATION_REVISION"
            --repository-revision "$GITHUB_SHA"
            --fence-epoch "$FENCE_EPOCH"
            --output "$RUNNER_TEMP/backend-supabase-standby-promotion-decision.json"
            --summary "$GITHUB_STEP_SUMMARY"
          )
          if [[ "$ENFORCE" == "true" ]]; then
            args+=(--enforce)
          fi

          python3 scripts/backend_supabase_standby_promotion_decision.py "${args[@]}"

      - name: Upload promotion decision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: backend-supabase-standby-promotion-decision
          path: ${{ runner.temp }}/backend-supabase-standby-promotion-decision.json
          if-no-files-found: error
