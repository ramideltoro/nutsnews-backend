name: Backend Supabase Standby Recovery Boundaries

on:
  workflow_dispatch:
    inputs:
      boundary:
        description: Recovery boundary to evaluate without mutation.
        required: true
        default: switch_back_to_backend_postgres
        type: choice
        options:
          - pre_switch_abort
          - post_supabase_failover_forward_recovery
          - switch_back_to_backend_postgres
      provider_switch_performed:
        description: Whether the Supabase provider switch has completed for this modeled boundary.
        required: true
        default: unknown
        type: choice
        options:
          - unknown
          - true
          - false
      failover_attempt_id:
        description: Optional failover attempt identifier to include as safe metadata.
        required: false
        default: ""
        type: string
      fence_epoch:
        description: Optional fence epoch to include as safe metadata.
        required: false
        default: ""
        type: string
      confirmation:
        description: Type evaluate-supabase-standby-recovery-boundaries to render the boundary report.
        required: true
        type: string
      enforce:
        description: Return non-zero when the modeled boundary is blocked.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: backend-supabase-standby-recovery-boundaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate recovery boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-backend
    env:
      BOUNDARY: ${{ inputs.boundary }}
      CONFIRMATION: ${{ inputs.confirmation }}
      ENFORCE: ${{ inputs.enforce }}
      FAILOVER_ATTEMPT_ID: ${{ inputs.failover_attempt_id }}
      FENCE_EPOCH: ${{ inputs.fence_epoch }}
      PROVIDER_SWITCH_PERFORMED: ${{ inputs.provider_switch_performed }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Validate dispatch inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "This boundary report only runs from main." >&2
            exit 1
          fi
          if [[ "$CONFIRMATION" != "evaluate-supabase-standby-recovery-boundaries" ]]; then
            echo "Invalid recovery boundary confirmation." >&2
            exit 1
          fi
          case "$BOUNDARY" in
            pre_switch_abort|post_supabase_failover_forward_recovery|switch_back_to_backend_postgres) ;;
            *)
              echo "Invalid boundary." >&2
              exit 1
              ;;
          esac
          case "$PROVIDER_SWITCH_PERFORMED" in
            unknown|true|false) ;;
            *)
              echo "Invalid provider_switch_performed value." >&2
              exit 1
              ;;
          esac
          if [[ -n "$FAILOVER_ATTEMPT_ID" ]] && ! [[ "$FAILOVER_ATTEMPT_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]; then
            echo "Invalid failover_attempt_id." >&2
            exit 1
          fi
          if [[ -n "$FENCE_EPOCH" ]] && ! [[ "$FENCE_EPOCH" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]; then
            echo "Invalid fence_epoch." >&2
            exit 1
          fi

      - name: Validate recovery boundary implementation
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/validate_backend_supabase_standby_recovery_boundaries.py
          python3 -m unittest tests.test_backend_supabase_standby_recovery_boundaries

      - name: Render non-mutating recovery boundary report
        shell: bash
        run: |
          set -euo pipefail

          args=(
            --boundary "$BOUNDARY"
            --provider-switch-performed "$PROVIDER_SWITCH_PERFORMED"
            --failover-attempt-id "$FAILOVER_ATTEMPT_ID"
            --fence-epoch "$FENCE_EPOCH"
            --output "$RUNNER_TEMP/backend-supabase-standby-recovery-boundaries.json"
            --summary "$GITHUB_STEP_SUMMARY"
          )
          if [[ "$ENFORCE" == "true" ]]; then
            args+=(--enforce)
          fi

          python3 scripts/backend_supabase_standby_recovery_boundaries.py "${args[@]}"

      - name: Upload recovery boundary report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: backend-supabase-standby-recovery-boundaries
          path: ${{ runner.temp }}/backend-supabase-standby-recovery-boundaries.json
          if-no-files-found: error
