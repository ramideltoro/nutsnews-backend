name: Backend Supabase Standby Relay

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: Run relay Ansible in check mode or apply mode.
        required: true
        default: check
        type: choice
        options:
          - check
          - apply
      relay_state:
        description: Install/update or remove the backend-local standby relay.
        required: true
        default: present
        type: choice
        options:
          - present
          - absent
      confirm_apply:
        description: For apply mode only, type backend.nutsnews.com. Leave blank for check mode.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: backend-supabase-standby-relay
  cancel-in-progress: false

jobs:
  relay:
    name: Backend-local Supabase standby relay
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production-backend

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Validate dispatch inputs
        shell: bash
        env:
          GITHUB_REF_NAME_SAFE: ${{ github.ref }}
          RUN_MODE: ${{ inputs.run_mode }}
          RELAY_STATE: ${{ inputs.relay_state }}
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME_SAFE" != "refs/heads/main" ]]; then
            echo "This protected standby relay workflow must run from main." >&2
            exit 1
          fi

          if [[ "$RUN_MODE" != "check" && "$RUN_MODE" != "apply" ]]; then
            echo "Unsupported run_mode." >&2
            exit 1
          fi

          if [[ "$RELAY_STATE" != "present" && "$RELAY_STATE" != "absent" ]]; then
            echo "Unsupported relay_state." >&2
            exit 1
          fi

          if [[ "$RUN_MODE" == "apply" && "$CONFIRM_APPLY" != "backend.nutsnews.com" ]]; then
            echo "Apply mode requires confirm_apply to be exactly backend.nutsnews.com." >&2
            exit 1
          fi

      - name: Validate repository relay contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_backend_supabase_standby_relay.py
          python3 scripts/backend_supabase_standby_relay.py --mode offline --enforce
          python3 -m unittest tests.test_backend_supabase_standby_relay

      - name: Install Ansible in temporary venv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ansible-venv"
          "$RUNNER_TEMP/ansible-venv/bin/python" -m pip install ansible-core
          echo "$RUNNER_TEMP/ansible-venv/bin" >> "$GITHUB_PATH"

      - name: Install Ansible collections
        shell: bash
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Validate required protected material
        shell: bash
        env:
          NUTSNEWS_BACKEND_SSH_PRIVATE_KEY: ${{ secrets.NUTSNEWS_BACKEND_SSH_PRIVATE_KEY }}
          NUTSNEWS_BACKEND_KNOWN_HOSTS: ${{ secrets.NUTSNEWS_BACKEND_KNOWN_HOSTS }}
          NUTSNEWS_BACKEND_POSTGRES_MIGRATION_REPLICATION_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_MIGRATION_REPLICATION_PASSWORD }}
          NUTSNEWS_PRODUCTION_SUPABASE_DB_URL: ${{ secrets.NUTSNEWS_PRODUCTION_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            NUTSNEWS_BACKEND_SSH_PRIVATE_KEY \
            NUTSNEWS_BACKEND_KNOWN_HOSTS \
            NUTSNEWS_BACKEND_POSTGRES_MIGRATION_REPLICATION_PASSWORD \
            NUTSNEWS_PRODUCTION_SUPABASE_DB_URL
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required production-backend secret: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Prepare SSH material
        shell: bash
        env:
          NUTSNEWS_BACKEND_SSH_PRIVATE_KEY: ${{ secrets.NUTSNEWS_BACKEND_SSH_PRIVATE_KEY }}
          NUTSNEWS_BACKEND_KNOWN_HOSTS: ${{ secrets.NUTSNEWS_BACKEND_KNOWN_HOSTS }}
          NUTSNEWS_BACKEND_HOST: ${{ vars.NUTSNEWS_BACKEND_HOST || '65.75.201.18' }}
        run: |
          set -euo pipefail
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$NUTSNEWS_BACKEND_SSH_PRIVATE_KEY" > "$HOME/.ssh/nutsnews_backend"
          chmod 0600 "$HOME/.ssh/nutsnews_backend"
          printf '%s\n' "$NUTSNEWS_BACKEND_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/nutsnews_backend" > /dev/null
          ssh-keygen -F "$NUTSNEWS_BACKEND_HOST" -f "$HOME/.ssh/known_hosts" > /dev/null

      - name: Build relay extra vars
        shell: bash
        env:
          RELAY_STATE: ${{ inputs.relay_state }}
          NUTSNEWS_BACKEND_POSTGRES_MIGRATION_REPLICATION_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_MIGRATION_REPLICATION_PASSWORD }}
          NUTSNEWS_PRODUCTION_SUPABASE_DB_URL: ${{ secrets.NUTSNEWS_PRODUCTION_SUPABASE_DB_URL }}
          NUTSNEWS_BACKEND_POSTGRES_PRIMARY_DATABASE: ${{ vars.NUTSNEWS_BACKEND_POSTGRES_PRIMARY_DATABASE || vars.NUTSNEWS_BACKEND_POSTGRES_PRIMARY_SHADOW_DATABASE || 'nutsnews_primary_shadow' }}
        run: |
          set -euo pipefail
          echo "::add-mask::$NUTSNEWS_BACKEND_POSTGRES_MIGRATION_REPLICATION_PASSWORD"
          echo "::add-mask::$NUTSNEWS_PRODUCTION_SUPABASE_DB_URL"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          extra_vars = {
              "backend_supabase_standby_relay_state": os.environ["RELAY_STATE"],
              "backend_supabase_standby_relay_enabled": True,
              "backend_supabase_standby_relay_source_database": os.environ["NUTSNEWS_BACKEND_POSTGRES_PRIMARY_DATABASE"],
              "backend_supabase_standby_relay_source_password": os.environ["NUTSNEWS_BACKEND_POSTGRES_MIGRATION_REPLICATION_PASSWORD"],
              "backend_supabase_standby_relay_target_db_url": os.environ["NUTSNEWS_PRODUCTION_SUPABASE_DB_URL"],
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "backend-supabase-standby-relay-extra-vars.json"
          path.write_text(json.dumps(extra_vars), encoding="utf-8")
          PY

      - name: Run relay Ansible
        shell: bash
        working-directory: ansible
        env:
          RUN_MODE: ${{ inputs.run_mode }}
          NUTSNEWS_BACKEND_HOST: ${{ vars.NUTSNEWS_BACKEND_HOST || '65.75.201.18' }}
          NUTSNEWS_BACKEND_ANSIBLE_USER: ${{ secrets.NUTSNEWS_BACKEND_ANSIBLE_USER }}
          ANSIBLE_HOST_KEY_CHECKING: "true"
        run: |
          set -euo pipefail

          ssh_user="${NUTSNEWS_BACKEND_ANSIBLE_USER:-rami}"
          args=(
            playbooks/backend_supabase_standby_relay.yml
            -i inventories/production/hosts.yml
            --private-key "$HOME/.ssh/nutsnews_backend"
            -u "$ssh_user"
            --extra-vars "ansible_host=$NUTSNEWS_BACKEND_HOST"
            --extra-vars "@$RUNNER_TEMP/backend-supabase-standby-relay-extra-vars.json"
          )
          if [[ "$RUN_MODE" == "check" ]]; then
            args+=(--check)
          fi
          ansible-playbook "${args[@]}"

      - name: Summarize safe metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Backend Supabase standby relay"
            echo
            echo "- Run mode: \`${{ inputs.run_mode }}\`"
            echo "- Relay state: \`${{ inputs.relay_state }}\`"
            echo "- Source: private backend PostgreSQL primary."
            echo "- Target: existing production Supabase standby through outbound direct 5432."
            echo "- Backend PostgreSQL public 5432 remains forbidden."
            echo "- Reports are safe metadata only; database URLs, passwords, host metadata, SQL errors, and row data are not printed."
          } >> "$GITHUB_STEP_SUMMARY"
