name: Backend Supabase Write Watermarks

on:
  workflow_dispatch:
    inputs:
      observe_seconds:
        description: Seconds between aggregate-only Supabase watermark snapshots.
        required: true
        default: "120"
        type: string

permissions:
  contents: read

concurrency:
  group: backend-supabase-write-watermarks
  cancel-in-progress: false

jobs:
  watermarks:
    name: Supabase no-new-write watermarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-backend

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Validate input
        shell: bash
        env:
          OBSERVE_SECONDS: ${{ inputs.observe_seconds }}
        run: |
          set -euo pipefail
          if [[ ! "$OBSERVE_SECONDS" =~ ^[0-9]+$ ]]; then
            echo "observe_seconds must be an integer." >&2
            exit 1
          fi
          if (( OBSERVE_SECONDS < 30 || OBSERVE_SECONDS > 600 )); then
            echo "observe_seconds must be between 30 and 600." >&2
            exit 1
          fi

      - name: Validate protected material
        shell: bash
        env:
          NUTSNEWS_PRODUCTION_SUPABASE_DB_URL: ${{ secrets.NUTSNEWS_PRODUCTION_SUPABASE_DB_URL }}
          NUTSNEWS_BACKEND_SSH_PRIVATE_KEY: ${{ secrets.NUTSNEWS_BACKEND_SSH_PRIVATE_KEY }}
          NUTSNEWS_BACKEND_KNOWN_HOSTS: ${{ secrets.NUTSNEWS_BACKEND_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in \
            NUTSNEWS_PRODUCTION_SUPABASE_DB_URL \
            NUTSNEWS_BACKEND_SSH_PRIVATE_KEY \
            NUTSNEWS_BACKEND_KNOWN_HOSTS
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required production-backend secret: $name" >&2
              exit 1
            fi
          done

      - name: Prepare backend SSH
        shell: bash
        env:
          NUTSNEWS_BACKEND_SSH_PRIVATE_KEY: ${{ secrets.NUTSNEWS_BACKEND_SSH_PRIVATE_KEY }}
          NUTSNEWS_BACKEND_KNOWN_HOSTS: ${{ secrets.NUTSNEWS_BACKEND_KNOWN_HOSTS }}
          NUTSNEWS_BACKEND_HOST: ${{ vars.NUTSNEWS_BACKEND_HOST || '65.75.201.18' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 0700 "$HOME/.ssh"
          printf '%s\n' "$NUTSNEWS_BACKEND_SSH_PRIVATE_KEY" > "$HOME/.ssh/nutsnews_backend"
          chmod 0600 "$HOME/.ssh/nutsnews_backend"
          printf '%s\n' "$NUTSNEWS_BACKEND_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/nutsnews_backend" > /dev/null
          ssh-keygen -F "$NUTSNEWS_BACKEND_HOST" -f "$HOME/.ssh/known_hosts" > /dev/null

      - name: Compare Supabase write watermarks on backend host
        shell: bash
        env:
          NUTSNEWS_PRODUCTION_SUPABASE_DB_URL: ${{ secrets.NUTSNEWS_PRODUCTION_SUPABASE_DB_URL }}
          NUTSNEWS_BACKEND_HOST: ${{ vars.NUTSNEWS_BACKEND_HOST || '65.75.201.18' }}
          NUTSNEWS_BACKEND_ANSIBLE_USER: ${{ secrets.NUTSNEWS_BACKEND_ANSIBLE_USER }}
          OBSERVE_SECONDS: ${{ inputs.observe_seconds }}
        run: |
          set -euo pipefail
          echo "::add-mask::$NUTSNEWS_PRODUCTION_SUPABASE_DB_URL"
          ssh_user="${NUTSNEWS_BACKEND_ANSIBLE_USER:-rami}"
          ssh_base=(
            ssh
            -i "$HOME/.ssh/nutsnews_backend"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          scp_base=(
            scp
            -i "$HOME/.ssh/nutsnews_backend"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          remote_dir=""
          secret_file=""
          # shellcheck disable=SC2329
          cleanup() {
            if [[ -n "$secret_file" ]]; then
              rm -f "$secret_file"
            fi
            if [[ -n "$remote_dir" ]]; then
              "${ssh_base[@]}" "$ssh_user@$NUTSNEWS_BACKEND_HOST" "rm -rf '$remote_dir'" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          remote_dir="$("${ssh_base[@]}" "$ssh_user@$NUTSNEWS_BACKEND_HOST" 'mktemp -d')"
          if [[ "$remote_dir" != /tmp/* && "$remote_dir" != /var/tmp/* ]]; then
            echo "Refusing unexpected remote temp dir: $remote_dir" >&2
            exit 1
          fi
          "${ssh_base[@]}" "$ssh_user@$NUTSNEWS_BACKEND_HOST" "mkdir -p '$remote_dir/scripts'"
          "${scp_base[@]}" scripts/backend_supabase_write_watermarks.py "$ssh_user@$NUTSNEWS_BACKEND_HOST:$remote_dir/scripts/"

          secret_file="$RUNNER_TEMP/backend-supabase-db-url"
          printf '%s' "$NUTSNEWS_PRODUCTION_SUPABASE_DB_URL" > "$secret_file"
          chmod 0600 "$secret_file"
          "${scp_base[@]}" "$secret_file" "$ssh_user@$NUTSNEWS_BACKEND_HOST:$remote_dir/db-url"
          "${ssh_base[@]}" "$ssh_user@$NUTSNEWS_BACKEND_HOST" "chmod 0600 '$remote_dir/db-url' '$remote_dir/scripts/backend_supabase_write_watermarks.py'"

          set +e
          "${ssh_base[@]}" "$ssh_user@$NUTSNEWS_BACKEND_HOST" "set -euo pipefail
          cd '$remote_dir'
          export NUTSNEWS_PRODUCTION_SUPABASE_DB_URL=\"\$(cat db-url)\"
          python3 scripts/backend_supabase_write_watermarks.py \
            --observe-seconds '$OBSERVE_SECONDS' \
            --output backend-supabase-write-watermarks.json"
          rc=$?
          set -e

          if "${ssh_base[@]}" "$ssh_user@$NUTSNEWS_BACKEND_HOST" "test -f '$remote_dir/backend-supabase-write-watermarks.json'"; then
            "${scp_base[@]}" "$ssh_user@$NUTSNEWS_BACKEND_HOST:$remote_dir/backend-supabase-write-watermarks.json" \
              "$RUNNER_TEMP/backend-supabase-write-watermarks.json"
          fi
          exit "$rc"

      - name: Summarize safe metadata
        if: always()
        shell: bash
        run: |
          {
            echo "## Supabase write watermarks"
            echo
            echo "- Observation seconds: \`${{ inputs.observe_seconds }}\`"
            echo "- Report contains aggregate watermarks only."
            echo "- Database URLs, passwords, tokens, and row data are not printed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload watermark report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: backend-supabase-write-watermarks
          path: ${{ runner.temp }}/backend-supabase-write-watermarks.json
          if-no-files-found: ignore
