name: Protected Backend Ansible Apply

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: Run the backend baseline in check mode or apply mode.
        required: true
        default: check
        type: choice
        options:
          - check
          - apply
      confirm_apply:
        description: For apply mode only, type backend.nutsnews.com. Leave blank for check mode.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: production-backend-ansible-baseline
  cancel-in-progress: false

jobs:
  baseline:
    name: Backend baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-backend

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Validate dispatch inputs
        shell: bash
        env:
          RUN_MODE: ${{ inputs.run_mode }}
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
        run: |
          set -euo pipefail

          if [[ "$RUN_MODE" != "check" && "$RUN_MODE" != "apply" ]]; then
            echo "Unsupported run_mode: $RUN_MODE" >&2
            exit 1
          fi

          if [[ "$RUN_MODE" == "apply" && "$CONFIRM_APPLY" != "backend.nutsnews.com" ]]; then
            echo "Apply mode requires confirm_apply to be exactly backend.nutsnews.com." >&2
            exit 1
          fi

      - name: Install Ansible in temporary venv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ansible-venv"
          "$RUNNER_TEMP/ansible-venv/bin/python" -m pip install ansible-core
          echo "$RUNNER_TEMP/ansible-venv/bin" >> "$GITHUB_PATH"

      - name: Install Ansible collections
        shell: bash
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Validate required environment secrets
        shell: bash
        env:
          NUTSNEWS_BACKEND_SSH_PRIVATE_KEY: ${{ secrets.NUTSNEWS_BACKEND_SSH_PRIVATE_KEY }}
          NUTSNEWS_BACKEND_KNOWN_HOSTS: ${{ secrets.NUTSNEWS_BACKEND_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          missing=0
          for secret_name in \
            NUTSNEWS_BACKEND_SSH_PRIVATE_KEY \
            NUTSNEWS_BACKEND_KNOWN_HOSTS
          do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing required production-backend environment secret: $secret_name" >&2
              missing=1
            fi
          done

          exit "$missing"

      - name: Prepare SSH material
        shell: bash
        env:
          NUTSNEWS_BACKEND_SSH_PRIVATE_KEY: ${{ secrets.NUTSNEWS_BACKEND_SSH_PRIVATE_KEY }}
          NUTSNEWS_BACKEND_KNOWN_HOSTS: ${{ secrets.NUTSNEWS_BACKEND_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$NUTSNEWS_BACKEND_SSH_PRIVATE_KEY" > "$HOME/.ssh/nutsnews_backend"
          chmod 0600 "$HOME/.ssh/nutsnews_backend"

          printf '%s\n' "$NUTSNEWS_BACKEND_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

          ssh-keygen -y -f "$HOME/.ssh/nutsnews_backend" > /dev/null
          ssh-keygen -F 65.75.201.18 -f "$HOME/.ssh/known_hosts" > /dev/null

      - name: Reset fixed backup one-shot failure state
        if: inputs.run_mode == 'apply'
        shell: bash
        env:
          NUTSNEWS_BACKEND_HOST: ${{ vars.NUTSNEWS_BACKEND_HOST || '65.75.201.18' }}
          NUTSNEWS_BACKEND_ANSIBLE_USER: ${{ secrets.NUTSNEWS_BACKEND_ANSIBLE_USER }}
        run: |
          set -euo pipefail

          ssh_user="${NUTSNEWS_BACKEND_ANSIBLE_USER:-rami}"
          ssh -i "$HOME/.ssh/nutsnews_backend" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$ssh_user@$NUTSNEWS_BACKEND_HOST" \
            'set -eu
            for unit in nutsnews-backup.service nutsnews-backup-verify.service nutsnews-restore-drill.service; do
              if systemctl list-unit-files "$unit" --no-legend 2>/dev/null | grep -q "$unit"; then
                sudo -n systemctl reset-failed "$unit"
              fi
            done'

      - name: Run deployment safety preflight
        shell: bash
        env:
          RUN_MODE: ${{ inputs.run_mode }}
          NUTSNEWS_BACKEND_HOST: ${{ vars.NUTSNEWS_BACKEND_HOST || '65.75.201.18' }}
          NUTSNEWS_BACKEND_ANSIBLE_USER: ${{ secrets.NUTSNEWS_BACKEND_ANSIBLE_USER }}
          NUTSNEWS_BACKEND_SSH_PRIVATE_KEY: ${{ secrets.NUTSNEWS_BACKEND_SSH_PRIVATE_KEY }}
          NUTSNEWS_BACKEND_KNOWN_HOSTS: ${{ secrets.NUTSNEWS_BACKEND_KNOWN_HOSTS }}
          RESTIC_REPOSITORY: ${{ secrets.RESTIC_REPOSITORY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GRAFANA_CLOUD_PROMETHEUS_URL: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_URL }}
          GRAFANA_CLOUD_PROMETHEUS_USERNAME: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_USERNAME }}
          GRAFANA_CLOUD_PROMETHEUS_PASSWORD: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_PASSWORD }}
          GRAFANA_CLOUD_LOKI_URL: ${{ secrets.GRAFANA_CLOUD_LOKI_URL }}
          GRAFANA_CLOUD_LOKI_USERNAME: ${{ secrets.GRAFANA_CLOUD_LOKI_USERNAME }}
          GRAFANA_CLOUD_LOKI_PASSWORD: ${{ secrets.GRAFANA_CLOUD_LOKI_PASSWORD }}
          NUTSNEWS_BACKEND_POSTGRES_ENABLED: ${{ vars.NUTSNEWS_BACKEND_POSTGRES_ENABLED || 'true' }}
          NUTSNEWS_BACKEND_DB_DASHBOARD_ENABLED: ${{ vars.NUTSNEWS_BACKEND_DB_DASHBOARD_ENABLED || 'true' }}
          NUTSNEWS_BACKEND_POSTGRES_PRIMARY_SHADOW_DATABASE: ${{ vars.NUTSNEWS_BACKEND_POSTGRES_PRIMARY_SHADOW_DATABASE || 'nutsnews_primary_shadow' }}
          NUTSNEWS_BACKEND_POSTGRES_APP_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_APP_PASSWORD }}
          NUTSNEWS_BACKEND_POSTGRES_READONLY_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_READONLY_PASSWORD }}
          NUTSNEWS_BACKEND_POSTGRES_MIGRATION_RESTORE_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_MIGRATION_RESTORE_PASSWORD }}
          NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD }}
          NUTSNEWS_BACKEND_POSTGRES_MIGRATION_REPLICATION_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_MIGRATION_REPLICATION_PASSWORD }}
          NUTSNEWS_BACKEND_POSTGRES_MIGRATION_APP_REHEARSAL_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_MIGRATION_APP_REHEARSAL_PASSWORD }}
          NUTSNEWS_BACKEND_WORKER_API_ENABLED: ${{ vars.NUTSNEWS_BACKEND_WORKER_API_ENABLED || 'false' }}
          NUTSNEWS_BACKEND_WORKER_API_WRITES_ENABLED: ${{ vars.NUTSNEWS_BACKEND_WORKER_API_WRITES_ENABLED || 'false' }}
          NUTSNEWS_BACKEND_API_TOKEN: ${{ secrets.NUTSNEWS_BACKEND_API_TOKEN }}
        run: |
          set -euo pipefail

          enforce=false
          phase=dry-run
          if [[ "$RUN_MODE" == "apply" ]]; then
            enforce=true
            phase=pre
          fi

          python3 scripts/backend_deployment_safety.py \
            --profile baseline_apply \
            --phase "$phase" \
            --enforce "$enforce" \
            --change-description "protected-backend-ansible-apply:${RUN_MODE}" \
            --ssh-host "$NUTSNEWS_BACKEND_HOST" \
            --ssh-user "${NUTSNEWS_BACKEND_ANSIBLE_USER:-rami}" \
            --ssh-key "$HOME/.ssh/nutsnews_backend" \
            --known-hosts "$HOME/.ssh/known_hosts" \
            --required-secret NUTSNEWS_BACKEND_SSH_PRIVATE_KEY \
            --required-secret NUTSNEWS_BACKEND_KNOWN_HOSTS \
            --required-secret RESTIC_REPOSITORY \
            --required-secret RESTIC_PASSWORD \
            --required-secret AWS_ACCESS_KEY_ID \
            --required-secret AWS_SECRET_ACCESS_KEY \
            --required-secret GRAFANA_CLOUD_PROMETHEUS_URL \
            --required-secret GRAFANA_CLOUD_PROMETHEUS_USERNAME \
            --required-secret GRAFANA_CLOUD_PROMETHEUS_PASSWORD \
            --required-secret GRAFANA_CLOUD_LOKI_URL \
            --required-secret GRAFANA_CLOUD_LOKI_USERNAME \
            --required-secret GRAFANA_CLOUD_LOKI_PASSWORD \
            --output "$RUNNER_TEMP/backend-deployment-safety-pre.json" \
            --summary "$RUNNER_TEMP/backend-deployment-safety-pre.md"

      - name: Build runtime extra vars
        shell: bash
        env:
          NUTSNEWS_BACKEND_ANSIBLE_USER: ${{ secrets.NUTSNEWS_BACKEND_ANSIBLE_USER }}
          NUTSNEWS_BACKEND_BECOME_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_BECOME_PASSWORD }}
          NUTSNEWS_BACKEND_RESTIC_PROVIDER: ${{ vars.NUTSNEWS_BACKEND_RESTIC_PROVIDER || 's3' }}
          RESTIC_REPOSITORY: ${{ secrets.RESTIC_REPOSITORY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          GRAFANA_CLOUD_PROMETHEUS_URL: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_URL }}
          GRAFANA_CLOUD_PROMETHEUS_USERNAME: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_USERNAME }}
          GRAFANA_CLOUD_PROMETHEUS_PASSWORD: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_PASSWORD }}
          GRAFANA_CLOUD_LOKI_URL: ${{ secrets.GRAFANA_CLOUD_LOKI_URL }}
          GRAFANA_CLOUD_LOKI_USERNAME: ${{ secrets.GRAFANA_CLOUD_LOKI_USERNAME }}
          GRAFANA_CLOUD_LOKI_PASSWORD: ${{ secrets.GRAFANA_CLOUD_LOKI_PASSWORD }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NEW_RELIC_LICENCE_KEY: ${{ secrets.NEW_RELIC_LICENCE_KEY }}
          NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION || 'us' }}
          B2_ACCOUNT_ID: ${{ secrets.B2_ACCOUNT_ID }}
          B2_ACCOUNT_KEY: ${{ secrets.B2_ACCOUNT_KEY }}
          NUTSNEWS_BACKEND_ENVIRONMENT: ${{ vars.NUTSNEWS_BACKEND_ENVIRONMENT || 'production' }}
          NUTSNEWS_BACKEND_DOMAIN: ${{ vars.NUTSNEWS_BACKEND_DOMAIN || 'backend.nutsnews.com' }}
          NUTSNEWS_BACKUP_CHECK_READ_DATA_SUBSET: ${{ vars.NUTSNEWS_BACKUP_CHECK_READ_DATA_SUBSET || '1%' }}
          NUTSNEWS_BACKUP_STALE_AFTER_HOURS: ${{ vars.NUTSNEWS_BACKUP_STALE_AFTER_HOURS || '30' }}
          NUTSNEWS_BACKUP_QUOTA_WARN_BYTES: ${{ vars.NUTSNEWS_BACKUP_QUOTA_WARN_BYTES || '0' }}
          NUTSNEWS_BACKEND_POSTGRES_ENABLED: ${{ vars.NUTSNEWS_BACKEND_POSTGRES_ENABLED || 'true' }}
          NUTSNEWS_BACKEND_DB_DASHBOARD_ENABLED: ${{ vars.NUTSNEWS_BACKEND_DB_DASHBOARD_ENABLED || 'true' }}
          NUTSNEWS_BACKEND_POSTGRES_APP_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_APP_PASSWORD }}
          NUTSNEWS_BACKEND_POSTGRES_READONLY_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_READONLY_PASSWORD }}
          NUTSNEWS_BACKEND_POSTGRES_MIGRATION_RESTORE_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_MIGRATION_RESTORE_PASSWORD }}
          NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD }}
          NUTSNEWS_BACKEND_POSTGRES_MIGRATION_REPLICATION_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_MIGRATION_REPLICATION_PASSWORD }}
          NUTSNEWS_BACKEND_POSTGRES_MIGRATION_APP_REHEARSAL_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_MIGRATION_APP_REHEARSAL_PASSWORD }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          extra_vars = {}
          identifier_re = re.compile(r"^[A-Za-z_][A-Za-z0-9_]*$")

          ansible_user = os.environ.get("NUTSNEWS_BACKEND_ANSIBLE_USER", "").strip()
          if ansible_user:
              extra_vars["ansible_user"] = ansible_user

          become_password = os.environ.get("NUTSNEWS_BACKEND_BECOME_PASSWORD", "")
          if become_password:
              extra_vars["ansible_become_password"] = become_password

          restic_repository = os.environ.get("RESTIC_REPOSITORY", "").strip()
          restic_password = os.environ.get("RESTIC_PASSWORD", "")
          if restic_repository and restic_password:
              extra_vars["backend_backup_enabled"] = True
              extra_vars["backend_backup_restic_repository"] = restic_repository
              extra_vars["backend_backup_restic_password"] = restic_password
              extra_vars["backend_backup_restic_provider"] = os.environ.get("NUTSNEWS_BACKEND_RESTIC_PROVIDER", "s3").strip() or "s3"
              extra_vars["backend_backup_check_read_data_subset"] = os.environ.get("NUTSNEWS_BACKUP_CHECK_READ_DATA_SUBSET", "1%").strip() or "1%"
              extra_vars["backend_backup_stale_after_hours"] = int(os.environ.get("NUTSNEWS_BACKUP_STALE_AFTER_HOURS", "30") or "30")
              extra_vars["backend_backup_quota_warn_bytes"] = int(os.environ.get("NUTSNEWS_BACKUP_QUOTA_WARN_BYTES", "0") or "0")
              backup_environment = {}
              for name in (
                  "AWS_ACCESS_KEY_ID",
                  "AWS_SECRET_ACCESS_KEY",
                  "AWS_DEFAULT_REGION",
                  "B2_ACCOUNT_ID",
                  "B2_ACCOUNT_KEY",
              ):
                  value = os.environ.get(name, "")
                  if value:
                      backup_environment[name] = value
              extra_vars["backend_backup_environment"] = backup_environment

          metrics_values = {
              "backend_metrics_prometheus_remote_write_url": os.environ.get("GRAFANA_CLOUD_PROMETHEUS_URL", "").strip(),
              "backend_metrics_prometheus_username": os.environ.get("GRAFANA_CLOUD_PROMETHEUS_USERNAME", "").strip(),
              "backend_metrics_prometheus_password": os.environ.get("GRAFANA_CLOUD_PROMETHEUS_PASSWORD", ""),
          }
          if all(metrics_values.values()):
              extra_vars["backend_metrics_enabled"] = True
              extra_vars.update(metrics_values)
              extra_vars["backend_metrics_environment_label"] = os.environ.get("NUTSNEWS_BACKEND_ENVIRONMENT", "production").strip() or "production"
              extra_vars["backend_metrics_instance_label"] = os.environ.get("NUTSNEWS_BACKEND_DOMAIN", "backend.nutsnews.com").strip() or "backend.nutsnews.com"

          logs_values = {
              "backend_logs_loki_url": os.environ.get("GRAFANA_CLOUD_LOKI_URL", "").strip(),
              "backend_logs_loki_username": os.environ.get("GRAFANA_CLOUD_LOKI_USERNAME", "").strip(),
              "backend_logs_loki_password": os.environ.get("GRAFANA_CLOUD_LOKI_PASSWORD", ""),
          }
          if all(logs_values.values()):
              extra_vars["backend_logs_enabled"] = True
              extra_vars.update(logs_values)

          new_relic_license_key = os.environ.get("NEW_RELIC_LICENSE_KEY", "") or os.environ.get("NEW_RELIC_LICENCE_KEY", "")
          if new_relic_license_key:
              extra_vars["backend_newrelic_logs_enabled"] = True
              extra_vars["backend_newrelic_metrics_enabled"] = True
              extra_vars["backend_newrelic_metric_license_key"] = new_relic_license_key
              extra_vars["backend_newrelic_metric_region"] = os.environ.get("NEW_RELIC_REGION", "us").strip().lower() or "us"
              extra_vars["backend_newrelic_metric_environment_label"] = os.environ.get("NUTSNEWS_BACKEND_ENVIRONMENT", "production").strip() or "production"
              extra_vars["backend_newrelic_metric_host"] = os.environ.get("NUTSNEWS_BACKEND_DOMAIN", "backend.nutsnews.com").strip() or "backend.nutsnews.com"

          postgres_enabled = os.environ.get("NUTSNEWS_BACKEND_POSTGRES_ENABLED", "true").strip().lower() in {"1", "true", "yes"}
          if postgres_enabled:
              app_password = os.environ.get("NUTSNEWS_BACKEND_POSTGRES_APP_PASSWORD", "")
              readonly_password = os.environ.get("NUTSNEWS_BACKEND_POSTGRES_READONLY_PASSWORD", "")
              missing = [
                  name
                  for name, value in (
                      ("NUTSNEWS_BACKEND_POSTGRES_APP_PASSWORD", app_password),
                      ("NUTSNEWS_BACKEND_POSTGRES_READONLY_PASSWORD", readonly_password),
                      ("NUTSNEWS_BACKEND_POSTGRES_MIGRATION_RESTORE_PASSWORD", os.environ.get("NUTSNEWS_BACKEND_POSTGRES_MIGRATION_RESTORE_PASSWORD", "")),
                      ("NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD", os.environ.get("NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD", "")),
                      ("NUTSNEWS_BACKEND_POSTGRES_MIGRATION_REPLICATION_PASSWORD", os.environ.get("NUTSNEWS_BACKEND_POSTGRES_MIGRATION_REPLICATION_PASSWORD", "")),
                      ("NUTSNEWS_BACKEND_POSTGRES_MIGRATION_APP_REHEARSAL_PASSWORD", os.environ.get("NUTSNEWS_BACKEND_POSTGRES_MIGRATION_APP_REHEARSAL_PASSWORD", "")),
                  )
                  if not value
              ]
              if missing:
                  raise SystemExit(f"Missing required PostgreSQL environment secret names: {', '.join(missing)}")
              extra_vars["backend_postgres_enabled"] = True
              extra_vars["backend_db_dashboard_enabled"] = (
                  os.environ.get("NUTSNEWS_BACKEND_DB_DASHBOARD_ENABLED", "true").strip().lower() in {"1", "true", "yes"}
              )
              primary_shadow_database = os.environ.get("NUTSNEWS_BACKEND_POSTGRES_PRIMARY_SHADOW_DATABASE", "nutsnews_primary_shadow").strip() or "nutsnews_primary_shadow"
              if not identifier_re.match(primary_shadow_database):
                  raise SystemExit("NUTSNEWS_BACKEND_POSTGRES_PRIMARY_SHADOW_DATABASE must be a safe PostgreSQL identifier")
              extra_vars["backend_postgres_primary_shadow_database"] = primary_shadow_database
              extra_vars["backend_postgres_app_password"] = app_password
              extra_vars["backend_postgres_readonly_password"] = readonly_password
              extra_vars["backend_postgres_restore_password"] = os.environ["NUTSNEWS_BACKEND_POSTGRES_MIGRATION_RESTORE_PASSWORD"]
              extra_vars["backend_postgres_validation_password"] = os.environ["NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD"]
              extra_vars["backend_postgres_replication_password"] = os.environ["NUTSNEWS_BACKEND_POSTGRES_MIGRATION_REPLICATION_PASSWORD"]
              extra_vars["backend_postgres_app_rehearsal_password"] = os.environ["NUTSNEWS_BACKEND_POSTGRES_MIGRATION_APP_REHEARSAL_PASSWORD"]

          worker_api_enabled = os.environ.get("NUTSNEWS_BACKEND_WORKER_API_ENABLED", "false").strip().lower() in {"1", "true", "yes"}
          if worker_api_enabled:
              token = os.environ.get("NUTSNEWS_BACKEND_API_TOKEN", "")
              if not token:
                  raise SystemExit("Missing required Worker database API secret: NUTSNEWS_BACKEND_API_TOKEN")
              writes_enabled = os.environ.get("NUTSNEWS_BACKEND_WORKER_API_WRITES_ENABLED", "false").strip().lower() in {"1", "true", "yes"}
              extra_vars["backend_worker_api_enabled"] = True
              extra_vars["backend_worker_api_token"] = token
              extra_vars["backend_worker_api_db_name"] = extra_vars.get(
                  "backend_postgres_primary_shadow_database",
                  os.environ.get("NUTSNEWS_BACKEND_POSTGRES_PRIMARY_SHADOW_DATABASE", "nutsnews_primary_shadow").strip() or "nutsnews_primary_shadow",
              )
              extra_vars["backend_worker_api_writes_enabled"] = writes_enabled
              if writes_enabled:
                  if not os.environ.get("NUTSNEWS_BACKEND_POSTGRES_APP_PASSWORD", ""):
                      raise SystemExit("Worker database API writes require NUTSNEWS_BACKEND_POSTGRES_APP_PASSWORD")
                  extra_vars["backend_worker_api_db_user"] = "nutsnews_app"
                  extra_vars["backend_worker_api_db_password"] = os.environ["NUTSNEWS_BACKEND_POSTGRES_APP_PASSWORD"]
              else:
                  if not os.environ.get("NUTSNEWS_BACKEND_POSTGRES_READONLY_PASSWORD", ""):
                      raise SystemExit("Worker database API shadow reads require NUTSNEWS_BACKEND_POSTGRES_READONLY_PASSWORD")
                  extra_vars["backend_worker_api_db_user"] = "nutsnews_readonly"
                  extra_vars["backend_worker_api_db_password"] = os.environ["NUTSNEWS_BACKEND_POSTGRES_READONLY_PASSWORD"]

          path = Path(os.environ["RUNNER_TEMP"]) / "backend-extra-vars.json"
          path.write_text(json.dumps(extra_vars), encoding="utf-8")
          path.chmod(0o600)
          PY

      - name: Run backend Ansible baseline
        shell: bash
        working-directory: ansible
        env:
          RUN_MODE: ${{ inputs.run_mode }}
        run: |
          set -euo pipefail

          args=(
            playbooks/bootstrap.yml
            -i inventories/production/hosts.yml
            --private-key "$HOME/.ssh/nutsnews_backend"
            --extra-vars "@$RUNNER_TEMP/backend-extra-vars.json"
          )

          if [[ "$RUN_MODE" == "check" ]]; then
            args+=(--check --diff)
          fi

          ansible-playbook "${args[@]}"

      - name: Run deployment safety postcheck
        if: always() && inputs.run_mode == 'apply'
        shell: bash
        env:
          NUTSNEWS_BACKEND_HOST: ${{ vars.NUTSNEWS_BACKEND_HOST || '65.75.201.18' }}
          NUTSNEWS_BACKEND_ANSIBLE_USER: ${{ secrets.NUTSNEWS_BACKEND_ANSIBLE_USER }}
          NUTSNEWS_BACKEND_SSH_PRIVATE_KEY: ${{ secrets.NUTSNEWS_BACKEND_SSH_PRIVATE_KEY }}
          NUTSNEWS_BACKEND_KNOWN_HOSTS: ${{ secrets.NUTSNEWS_BACKEND_KNOWN_HOSTS }}
          RESTIC_REPOSITORY: ${{ secrets.RESTIC_REPOSITORY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GRAFANA_CLOUD_PROMETHEUS_URL: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_URL }}
          GRAFANA_CLOUD_PROMETHEUS_USERNAME: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_USERNAME }}
          GRAFANA_CLOUD_PROMETHEUS_PASSWORD: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_PASSWORD }}
          GRAFANA_CLOUD_LOKI_URL: ${{ secrets.GRAFANA_CLOUD_LOKI_URL }}
          GRAFANA_CLOUD_LOKI_USERNAME: ${{ secrets.GRAFANA_CLOUD_LOKI_USERNAME }}
          GRAFANA_CLOUD_LOKI_PASSWORD: ${{ secrets.GRAFANA_CLOUD_LOKI_PASSWORD }}
        run: |
          set -euo pipefail

          python3 scripts/backend_deployment_safety.py \
            --profile baseline_apply \
            --phase post \
            --enforce true \
            --change-description "protected-backend-ansible-apply:apply" \
            --ssh-host "$NUTSNEWS_BACKEND_HOST" \
            --ssh-user "${NUTSNEWS_BACKEND_ANSIBLE_USER:-rami}" \
            --ssh-key "$HOME/.ssh/nutsnews_backend" \
            --known-hosts "$HOME/.ssh/known_hosts" \
            --required-secret NUTSNEWS_BACKEND_SSH_PRIVATE_KEY \
            --required-secret NUTSNEWS_BACKEND_KNOWN_HOSTS \
            --required-secret RESTIC_REPOSITORY \
            --required-secret RESTIC_PASSWORD \
            --required-secret AWS_ACCESS_KEY_ID \
            --required-secret AWS_SECRET_ACCESS_KEY \
            --required-secret GRAFANA_CLOUD_PROMETHEUS_URL \
            --required-secret GRAFANA_CLOUD_PROMETHEUS_USERNAME \
            --required-secret GRAFANA_CLOUD_PROMETHEUS_PASSWORD \
            --required-secret GRAFANA_CLOUD_LOKI_URL \
            --required-secret GRAFANA_CLOUD_LOKI_USERNAME \
            --required-secret GRAFANA_CLOUD_LOKI_PASSWORD \
            --output "$RUNNER_TEMP/backend-deployment-safety-post.json" \
            --summary "$RUNNER_TEMP/backend-deployment-safety-post.md"

      - name: Upload deployment safety reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: backend-deployment-safety-reports
          path: |
            ${{ runner.temp }}/backend-deployment-safety-pre.json
            ${{ runner.temp }}/backend-deployment-safety-pre.md
            ${{ runner.temp }}/backend-deployment-safety-post.json
            ${{ runner.temp }}/backend-deployment-safety-post.md
          if-no-files-found: ignore
