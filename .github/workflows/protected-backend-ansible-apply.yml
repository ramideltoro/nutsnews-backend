name: Protected Backend Ansible Apply

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: Run the backend baseline in check mode or apply mode.
        required: true
        default: check
        type: choice
        options:
          - check
          - apply
      deployment_scope:
        description: Fixed Ansible deployment scope.
        required: true
        default: full-baseline
        type: choice
        options:
          - full-baseline
          - rabbitmq-recovery-helper
      confirm_apply:
        description: For apply mode only, type backend.nutsnews.com. Leave blank for check mode.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: production-backend-ansible-baseline
  cancel-in-progress: false

jobs:
  baseline:
    name: Backend baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-backend

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Validate dispatch inputs
        shell: bash
        env:
          RUN_MODE: ${{ inputs.run_mode }}
          DEPLOYMENT_SCOPE: ${{ inputs.deployment_scope }}
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
        run: |
          set -euo pipefail

          if [[ "$RUN_MODE" != "check" && "$RUN_MODE" != "apply" ]]; then
            echo "Unsupported run_mode: $RUN_MODE" >&2
            exit 1
          fi

          case "$DEPLOYMENT_SCOPE" in
            full-baseline|rabbitmq-recovery-helper) ;;
            *)
              echo "Unsupported deployment_scope: $DEPLOYMENT_SCOPE" >&2
              exit 1
              ;;
          esac

          if [[ "$RUN_MODE" == "apply" && "$CONFIRM_APPLY" != "backend.nutsnews.com" ]]; then
            echo "Apply mode requires confirm_apply to be exactly backend.nutsnews.com." >&2
            exit 1
          fi

      - name: Install Ansible in temporary venv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ansible-venv"
          "$RUNNER_TEMP/ansible-venv/bin/python" -m pip install ansible-core
          echo "$RUNNER_TEMP/ansible-venv/bin" >> "$GITHUB_PATH"

      - name: Install Ansible collections
        shell: bash
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Validate required environment secrets
        shell: bash
        env:
          NUTSNEWS_BACKEND_SSH_PRIVATE_KEY: ${{ secrets.NUTSNEWS_BACKEND_SSH_PRIVATE_KEY }}
          NUTSNEWS_BACKEND_KNOWN_HOSTS: ${{ secrets.NUTSNEWS_BACKEND_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          missing=0
          for secret_name in \
            NUTSNEWS_BACKEND_SSH_PRIVATE_KEY \
            NUTSNEWS_BACKEND_KNOWN_HOSTS
          do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing required production-backend environment secret: $secret_name" >&2
              missing=1
            fi
          done

          exit "$missing"

      - name: Prepare SSH material
        shell: bash
        env:
          NUTSNEWS_BACKEND_SSH_PRIVATE_KEY: ${{ secrets.NUTSNEWS_BACKEND_SSH_PRIVATE_KEY }}
          NUTSNEWS_BACKEND_KNOWN_HOSTS: ${{ secrets.NUTSNEWS_BACKEND_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$NUTSNEWS_BACKEND_SSH_PRIVATE_KEY" > "$HOME/.ssh/nutsnews_backend"
          chmod 0600 "$HOME/.ssh/nutsnews_backend"

          printf '%s\n' "$NUTSNEWS_BACKEND_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

          ssh-keygen -y -f "$HOME/.ssh/nutsnews_backend" > /dev/null
          ssh-keygen -F 65.75.201.18 -f "$HOME/.ssh/known_hosts" > /dev/null

      - name: Check RabbitMQ credential readiness
        shell: bash
        env:
          RABBITMQ_ERLANG_COOKIE: ${{ secrets.RABBITMQ_ERLANG_COOKIE }}
          RABBITMQ_BREAK_GLASS_ADMIN_PASSWORD: ${{ secrets.RABBITMQ_BREAK_GLASS_ADMIN_PASSWORD }}
          RABBITMQ_MONITORING_PASSWORD: ${{ secrets.RABBITMQ_MONITORING_PASSWORD }}
          RABBITMQ_SCHEDULER_PUBLISHER_PASSWORD: ${{ secrets.RABBITMQ_SCHEDULER_PUBLISHER_PASSWORD }}
          RABBITMQ_FETCHER_CONSUMER_PASSWORD: ${{ secrets.RABBITMQ_FETCHER_CONSUMER_PASSWORD }}
          RABBITMQ_FETCHER_PUBLISHER_PASSWORD: ${{ secrets.RABBITMQ_FETCHER_PUBLISHER_PASSWORD }}
          RABBITMQ_CANONICALIZER_CONSUMER_PASSWORD: ${{ secrets.RABBITMQ_CANONICALIZER_CONSUMER_PASSWORD }}
          RABBITMQ_CANONICALIZER_PUBLISHER_PASSWORD: ${{ secrets.RABBITMQ_CANONICALIZER_PUBLISHER_PASSWORD }}
          RABBITMQ_ENRICHMENT_CONSUMER_PASSWORD: ${{ secrets.RABBITMQ_ENRICHMENT_CONSUMER_PASSWORD }}
          RABBITMQ_ENRICHMENT_PUBLISHER_PASSWORD: ${{ secrets.RABBITMQ_ENRICHMENT_PUBLISHER_PASSWORD }}
          RABBITMQ_APPROVAL_CONSUMER_PASSWORD: ${{ secrets.RABBITMQ_APPROVAL_CONSUMER_PASSWORD }}
          RABBITMQ_APPROVAL_PUBLISHER_PASSWORD: ${{ secrets.RABBITMQ_APPROVAL_PUBLISHER_PASSWORD }}
          RABBITMQ_TRANSLATION_CONSUMER_PASSWORD: ${{ secrets.RABBITMQ_TRANSLATION_CONSUMER_PASSWORD }}
          RABBITMQ_TRANSLATION_PUBLISHER_PASSWORD: ${{ secrets.RABBITMQ_TRANSLATION_PUBLISHER_PASSWORD }}
          RABBITMQ_PERSISTENCE_CONSUMER_PASSWORD: ${{ secrets.RABBITMQ_PERSISTENCE_CONSUMER_PASSWORD }}
          RABBITMQ_PERSISTENCE_PUBLISHER_PASSWORD: ${{ secrets.RABBITMQ_PERSISTENCE_PUBLISHER_PASSWORD }}
          RABBITMQ_PUBLICATION_CONSUMER_PASSWORD: ${{ secrets.RABBITMQ_PUBLICATION_CONSUMER_PASSWORD }}
        run: |
          set -euo pipefail

          python3 scripts/check_backend_credential_readiness.py --group rabbitmq --json \
            | tee "$RUNNER_TEMP/backend-rabbitmq-credential-readiness.json"

      - name: Reset fixed one-shot failure state
        if: inputs.run_mode == 'apply' && inputs.deployment_scope == 'full-baseline'
        shell: bash
        env:
          NUTSNEWS_BACKEND_HOST: ${{ vars.NUTSNEWS_BACKEND_HOST || '65.75.201.18' }}
          NUTSNEWS_BACKEND_ANSIBLE_USER: ${{ secrets.NUTSNEWS_BACKEND_ANSIBLE_USER }}
        run: |
          set -euo pipefail

          ssh_user="${NUTSNEWS_BACKEND_ANSIBLE_USER:-rami}"
          ssh -i "$HOME/.ssh/nutsnews_backend" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$ssh_user@$NUTSNEWS_BACKEND_HOST" \
            'set -eu
            for unit in nutsnews-backup.service nutsnews-backup-verify.service nutsnews-restore-drill.service nutsnews-rabbitmq-canary.service; do
              if systemctl list-unit-files "$unit" --no-legend 2>/dev/null | grep -q "$unit"; then
                sudo -n systemctl reset-failed "$unit"
              fi
            done'

      - name: Run deployment safety preflight
        shell: bash
        env:
          RUN_MODE: ${{ inputs.run_mode }}
          DEPLOYMENT_SCOPE: ${{ inputs.deployment_scope }}
          NUTSNEWS_BACKEND_HOST: ${{ vars.NUTSNEWS_BACKEND_HOST || '65.75.201.18' }}
          NUTSNEWS_BACKEND_ANSIBLE_USER: ${{ secrets.NUTSNEWS_BACKEND_ANSIBLE_USER }}
          NUTSNEWS_BACKEND_SSH_PRIVATE_KEY: ${{ secrets.NUTSNEWS_BACKEND_SSH_PRIVATE_KEY }}
          NUTSNEWS_BACKEND_KNOWN_HOSTS: ${{ secrets.NUTSNEWS_BACKEND_KNOWN_HOSTS }}
          RESTIC_REPOSITORY: ${{ secrets.RESTIC_REPOSITORY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GRAFANA_CLOUD_PROMETHEUS_URL: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_URL }}
          GRAFANA_CLOUD_PROMETHEUS_USERNAME: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_USERNAME }}
          GRAFANA_CLOUD_PROMETHEUS_PASSWORD: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_PASSWORD }}
          GRAFANA_CLOUD_LOKI_URL: ${{ secrets.GRAFANA_CLOUD_LOKI_URL }}
          GRAFANA_CLOUD_LOKI_USERNAME: ${{ secrets.GRAFANA_CLOUD_LOKI_USERNAME }}
          GRAFANA_CLOUD_LOKI_PASSWORD: ${{ secrets.GRAFANA_CLOUD_LOKI_PASSWORD }}
          NUTSNEWS_BACKEND_POSTGRES_ENABLED: ${{ vars.NUTSNEWS_BACKEND_POSTGRES_ENABLED || 'true' }}
          NUTSNEWS_BACKEND_DB_DASHBOARD_ENABLED: ${{ vars.NUTSNEWS_BACKEND_DB_DASHBOARD_ENABLED || 'true' }}
          NUTSNEWS_BACKEND_POSTGRES_PRIMARY_SHADOW_DATABASE: ${{ vars.NUTSNEWS_BACKEND_POSTGRES_PRIMARY_SHADOW_DATABASE || 'nutsnews_primary_shadow' }}
          NUTSNEWS_BACKEND_POSTGRES_PRIMARY_DATABASE: ${{ vars.NUTSNEWS_BACKEND_POSTGRES_PRIMARY_DATABASE || vars.NUTSNEWS_BACKEND_POSTGRES_PRIMARY_SHADOW_DATABASE || 'nutsnews_primary_shadow' }}
          NUTSNEWS_BACKEND_POSTGRES_APP_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_APP_PASSWORD }}
          NUTSNEWS_BACKEND_POSTGRES_READONLY_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_READONLY_PASSWORD }}
          NUTSNEWS_BACKEND_POSTGRES_MIGRATION_RESTORE_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_MIGRATION_RESTORE_PASSWORD }}
          NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD }}
          NUTSNEWS_BACKEND_POSTGRES_MIGRATION_REPLICATION_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_MIGRATION_REPLICATION_PASSWORD }}
          NUTSNEWS_BACKEND_POSTGRES_MIGRATION_APP_REHEARSAL_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_MIGRATION_APP_REHEARSAL_PASSWORD }}
          NUTSNEWS_BACKEND_POSTGRES_WORKER_API_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_WORKER_API_PASSWORD }}
          NUTSNEWS_BACKEND_SUPABASE_SYNC_RELAY_ENABLED: ${{ vars.NUTSNEWS_BACKEND_SUPABASE_SYNC_RELAY_ENABLED || 'false' }}
          NUTSNEWS_BACKEND_SUPABASE_SYNC_RELAY_INTERVAL_SECONDS: ${{ vars.NUTSNEWS_BACKEND_SUPABASE_SYNC_RELAY_INTERVAL_SECONDS || '30' }}
          NUTSNEWS_BACKEND_SUPABASE_SYNC_RELAY_BATCH_SIZE: ${{ vars.NUTSNEWS_BACKEND_SUPABASE_SYNC_RELAY_BATCH_SIZE || '500' }}
          NUTSNEWS_PRODUCTION_SUPABASE_DB_URL: ${{ secrets.NUTSNEWS_PRODUCTION_SUPABASE_DB_URL }}
          NUTSNEWS_BACKEND_WORKER_API_ENABLED: ${{ vars.NUTSNEWS_BACKEND_WORKER_API_ENABLED || 'false' }}
          NUTSNEWS_BACKEND_WORKER_API_WRITES_ENABLED: ${{ vars.NUTSNEWS_BACKEND_WORKER_API_WRITES_ENABLED || 'false' }}
          NUTSNEWS_BACKEND_API_TOKEN: ${{ secrets.NUTSNEWS_BACKEND_API_TOKEN }}
          LOCAL_AI_URL: ${{ vars.LOCAL_AI_URL || 'https://ai.nutsnews.com' }}
          LOCAL_AI_API_KEY: ${{ secrets.LOCAL_AI_API_KEY }}
          NUTSNEWS_BACKEND_WORKER_UPLIFT_PERSISTENCE_TOKEN: ${{ secrets.NUTSNEWS_BACKEND_WORKER_UPLIFT_PERSISTENCE_TOKEN }}
          NUTSNEWS_BACKEND_WORKER_UPLIFT_PUBLICATION_TOKEN: ${{ secrets.NUTSNEWS_BACKEND_WORKER_UPLIFT_PUBLICATION_TOKEN }}
          NUTSNEWS_BACKEND_WORKER_UPLIFT_SCOPED_TOKENS_ENABLED: ${{ vars.NUTSNEWS_BACKEND_WORKER_UPLIFT_SCOPED_TOKENS_ENABLED || 'false' }}
          NUTSNEWS_WORKER_UPLIFT_RECONCILIATION_TOKEN: ${{ secrets.NUTSNEWS_WORKER_UPLIFT_RECONCILIATION_TOKEN }}
          NUTSNEWS_WORKER_UPLIFT_RECONCILIATION_APPLY_ENABLED: ${{ vars.NUTSNEWS_WORKER_UPLIFT_RECONCILIATION_APPLY_ENABLED || 'false' }}
          NUTSNEWS_WORKER_UPLIFT_CUTOVER_STATE: ${{ vars.NUTSNEWS_WORKER_UPLIFT_CUTOVER_STATE || 'shadow' }}
          NUTSNEWS_WORKER_UPLIFT_PRODUCTION_WRITES_ENABLED: ${{ vars.NUTSNEWS_WORKER_UPLIFT_PRODUCTION_WRITES_ENABLED || 'false' }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_ENABLED: ${{ vars.NUTSNEWS_WORKER_UPLIFT_POSTGRES_ENABLED || 'true' }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_SCHEDULER_USERNAME: ${{ vars.NUTSNEWS_WORKER_UPLIFT_POSTGRES_SCHEDULER_USERNAME || 'nutsnews_worker_uplift_scheduler' }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_SCHEDULER_PASSWORD: ${{ secrets.NUTSNEWS_WORKER_UPLIFT_POSTGRES_SCHEDULER_PASSWORD }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_FETCHER_USERNAME: ${{ vars.NUTSNEWS_WORKER_UPLIFT_POSTGRES_FETCHER_USERNAME || 'nutsnews_worker_uplift_fetcher' }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_FETCHER_PASSWORD: ${{ secrets.NUTSNEWS_WORKER_UPLIFT_POSTGRES_FETCHER_PASSWORD }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_CANONICALIZER_USERNAME: ${{ vars.NUTSNEWS_WORKER_UPLIFT_POSTGRES_CANONICALIZER_USERNAME || 'nutsnews_worker_uplift_canonicalizer' }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_CANONICALIZER_PASSWORD: ${{ secrets.NUTSNEWS_WORKER_UPLIFT_POSTGRES_CANONICALIZER_PASSWORD }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_ENRICHMENT_USERNAME: ${{ vars.NUTSNEWS_WORKER_UPLIFT_POSTGRES_ENRICHMENT_USERNAME || 'nutsnews_worker_uplift_enrichment' }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_ENRICHMENT_PASSWORD: ${{ secrets.NUTSNEWS_WORKER_UPLIFT_POSTGRES_ENRICHMENT_PASSWORD }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_APPROVAL_USERNAME: ${{ vars.NUTSNEWS_WORKER_UPLIFT_POSTGRES_APPROVAL_USERNAME || 'nutsnews_worker_uplift_approval' }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_APPROVAL_PASSWORD: ${{ secrets.NUTSNEWS_WORKER_UPLIFT_POSTGRES_APPROVAL_PASSWORD }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_TRANSLATION_USERNAME: ${{ vars.NUTSNEWS_WORKER_UPLIFT_POSTGRES_TRANSLATION_USERNAME || 'nutsnews_worker_uplift_translation' }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_TRANSLATION_PASSWORD: ${{ secrets.NUTSNEWS_WORKER_UPLIFT_POSTGRES_TRANSLATION_PASSWORD }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_PERSISTENCE_USERNAME: ${{ vars.NUTSNEWS_WORKER_UPLIFT_POSTGRES_PERSISTENCE_USERNAME || 'nutsnews_worker_uplift_persistence' }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_PERSISTENCE_PASSWORD: ${{ secrets.NUTSNEWS_WORKER_UPLIFT_POSTGRES_PERSISTENCE_PASSWORD }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_PUBLICATION_USERNAME: ${{ vars.NUTSNEWS_WORKER_UPLIFT_POSTGRES_PUBLICATION_USERNAME || 'nutsnews_worker_uplift_publication' }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_PUBLICATION_PASSWORD: ${{ secrets.NUTSNEWS_WORKER_UPLIFT_POSTGRES_PUBLICATION_PASSWORD }}
          NUTSNEWS_BACKEND_RABBITMQ_ENABLED: ${{ vars.NUTSNEWS_BACKEND_RABBITMQ_ENABLED || 'true' }}
          NUTSNEWS_BACKEND_WORKER_RUNTIME_ENABLED: ${{ vars.NUTSNEWS_BACKEND_WORKER_RUNTIME_ENABLED || 'false' }}
          NUTSNEWS_BACKEND_WORKER_RUNTIME_PRODUCTION_WRITES_ENABLED: ${{ vars.NUTSNEWS_BACKEND_WORKER_RUNTIME_PRODUCTION_WRITES_ENABLED || 'false' }}
          RABBITMQ_VHOST: ${{ vars.RABBITMQ_VHOST || 'nutsnews-worker-uplift' }}
          RABBITMQ_BREAK_GLASS_ADMIN_USERNAME: ${{ vars.RABBITMQ_BREAK_GLASS_ADMIN_USERNAME || 'nutsnews_rabbitmq_admin' }}
          RABBITMQ_ERLANG_COOKIE: ${{ secrets.RABBITMQ_ERLANG_COOKIE }}
          RABBITMQ_BREAK_GLASS_ADMIN_PASSWORD: ${{ secrets.RABBITMQ_BREAK_GLASS_ADMIN_PASSWORD }}
          RABBITMQ_MONITORING_USERNAME: ${{ vars.RABBITMQ_MONITORING_USERNAME || 'nutsnews_rabbitmq_monitoring' }}
          RABBITMQ_MONITORING_PASSWORD: ${{ secrets.RABBITMQ_MONITORING_PASSWORD }}
          RABBITMQ_SCHEDULER_PUBLISHER_USERNAME: ${{ vars.RABBITMQ_SCHEDULER_PUBLISHER_USERNAME || 'nutsnews_scheduler_publisher' }}
          RABBITMQ_SCHEDULER_PUBLISHER_PASSWORD: ${{ secrets.RABBITMQ_SCHEDULER_PUBLISHER_PASSWORD }}
          RABBITMQ_FETCHER_CONSUMER_USERNAME: ${{ vars.RABBITMQ_FETCHER_CONSUMER_USERNAME || 'nutsnews_fetcher_consumer' }}
          RABBITMQ_FETCHER_CONSUMER_PASSWORD: ${{ secrets.RABBITMQ_FETCHER_CONSUMER_PASSWORD }}
          RABBITMQ_FETCHER_PUBLISHER_USERNAME: ${{ vars.RABBITMQ_FETCHER_PUBLISHER_USERNAME || 'nutsnews_fetcher_publisher' }}
          RABBITMQ_FETCHER_PUBLISHER_PASSWORD: ${{ secrets.RABBITMQ_FETCHER_PUBLISHER_PASSWORD }}
          RABBITMQ_CANONICALIZER_CONSUMER_USERNAME: ${{ vars.RABBITMQ_CANONICALIZER_CONSUMER_USERNAME || 'nutsnews_canonicalizer_consumer' }}
          RABBITMQ_CANONICALIZER_CONSUMER_PASSWORD: ${{ secrets.RABBITMQ_CANONICALIZER_CONSUMER_PASSWORD }}
          RABBITMQ_CANONICALIZER_PUBLISHER_USERNAME: ${{ vars.RABBITMQ_CANONICALIZER_PUBLISHER_USERNAME || 'nutsnews_canonicalizer_publisher' }}
          RABBITMQ_CANONICALIZER_PUBLISHER_PASSWORD: ${{ secrets.RABBITMQ_CANONICALIZER_PUBLISHER_PASSWORD }}
          RABBITMQ_ENRICHMENT_CONSUMER_USERNAME: ${{ vars.RABBITMQ_ENRICHMENT_CONSUMER_USERNAME || 'nutsnews_enrichment_consumer' }}
          RABBITMQ_ENRICHMENT_CONSUMER_PASSWORD: ${{ secrets.RABBITMQ_ENRICHMENT_CONSUMER_PASSWORD }}
          RABBITMQ_ENRICHMENT_PUBLISHER_USERNAME: ${{ vars.RABBITMQ_ENRICHMENT_PUBLISHER_USERNAME || 'nutsnews_enrichment_publisher' }}
          RABBITMQ_ENRICHMENT_PUBLISHER_PASSWORD: ${{ secrets.RABBITMQ_ENRICHMENT_PUBLISHER_PASSWORD }}
          RABBITMQ_APPROVAL_CONSUMER_USERNAME: ${{ vars.RABBITMQ_APPROVAL_CONSUMER_USERNAME || 'nutsnews_approval_consumer' }}
          RABBITMQ_APPROVAL_CONSUMER_PASSWORD: ${{ secrets.RABBITMQ_APPROVAL_CONSUMER_PASSWORD }}
          RABBITMQ_APPROVAL_PUBLISHER_USERNAME: ${{ vars.RABBITMQ_APPROVAL_PUBLISHER_USERNAME || 'nutsnews_approval_publisher' }}
          RABBITMQ_APPROVAL_PUBLISHER_PASSWORD: ${{ secrets.RABBITMQ_APPROVAL_PUBLISHER_PASSWORD }}
          RABBITMQ_TRANSLATION_CONSUMER_USERNAME: ${{ vars.RABBITMQ_TRANSLATION_CONSUMER_USERNAME || 'nutsnews_translation_consumer' }}
          RABBITMQ_TRANSLATION_CONSUMER_PASSWORD: ${{ secrets.RABBITMQ_TRANSLATION_CONSUMER_PASSWORD }}
          RABBITMQ_TRANSLATION_PUBLISHER_USERNAME: ${{ vars.RABBITMQ_TRANSLATION_PUBLISHER_USERNAME || 'nutsnews_translation_publisher' }}
          RABBITMQ_TRANSLATION_PUBLISHER_PASSWORD: ${{ secrets.RABBITMQ_TRANSLATION_PUBLISHER_PASSWORD }}
          RABBITMQ_PERSISTENCE_CONSUMER_USERNAME: ${{ vars.RABBITMQ_PERSISTENCE_CONSUMER_USERNAME || 'nutsnews_persistence_consumer' }}
          RABBITMQ_PERSISTENCE_CONSUMER_PASSWORD: ${{ secrets.RABBITMQ_PERSISTENCE_CONSUMER_PASSWORD }}
          RABBITMQ_PERSISTENCE_PUBLISHER_USERNAME: ${{ vars.RABBITMQ_PERSISTENCE_PUBLISHER_USERNAME || 'nutsnews_persistence_publisher' }}
          RABBITMQ_PERSISTENCE_PUBLISHER_PASSWORD: ${{ secrets.RABBITMQ_PERSISTENCE_PUBLISHER_PASSWORD }}
          RABBITMQ_PUBLICATION_CONSUMER_USERNAME: ${{ vars.RABBITMQ_PUBLICATION_CONSUMER_USERNAME || 'nutsnews_publication_consumer' }}
          RABBITMQ_PUBLICATION_CONSUMER_PASSWORD: ${{ secrets.RABBITMQ_PUBLICATION_CONSUMER_PASSWORD }}
        run: |
          set -euo pipefail

          enforce=false
          phase=dry-run
          if [[ "$RUN_MODE" == "apply" ]]; then
            enforce=true
            phase=pre
          fi

          python3 scripts/backend_deployment_safety.py \
            --profile baseline_apply \
            --phase "$phase" \
            --enforce "$enforce" \
            --change-description "protected-backend-ansible-apply:${RUN_MODE}" \
            --ssh-host "$NUTSNEWS_BACKEND_HOST" \
            --ssh-user "${NUTSNEWS_BACKEND_ANSIBLE_USER:-rami}" \
            --ssh-key "$HOME/.ssh/nutsnews_backend" \
            --known-hosts "$HOME/.ssh/known_hosts" \
            --required-secret NUTSNEWS_BACKEND_SSH_PRIVATE_KEY \
            --required-secret NUTSNEWS_BACKEND_KNOWN_HOSTS \
            --required-secret RESTIC_REPOSITORY \
            --required-secret RESTIC_PASSWORD \
            --required-secret AWS_ACCESS_KEY_ID \
            --required-secret AWS_SECRET_ACCESS_KEY \
            --required-secret GRAFANA_CLOUD_PROMETHEUS_URL \
            --required-secret GRAFANA_CLOUD_PROMETHEUS_USERNAME \
            --required-secret GRAFANA_CLOUD_PROMETHEUS_PASSWORD \
            --required-secret GRAFANA_CLOUD_LOKI_URL \
            --required-secret GRAFANA_CLOUD_LOKI_USERNAME \
            --required-secret GRAFANA_CLOUD_LOKI_PASSWORD \
            --required-secret NUTSNEWS_WORKER_UPLIFT_POSTGRES_SCHEDULER_PASSWORD \
            --required-secret NUTSNEWS_WORKER_UPLIFT_POSTGRES_FETCHER_PASSWORD \
            --required-secret NUTSNEWS_WORKER_UPLIFT_POSTGRES_CANONICALIZER_PASSWORD \
            --required-secret NUTSNEWS_WORKER_UPLIFT_POSTGRES_ENRICHMENT_PASSWORD \
            --required-secret NUTSNEWS_WORKER_UPLIFT_POSTGRES_APPROVAL_PASSWORD \
            --required-secret NUTSNEWS_WORKER_UPLIFT_POSTGRES_TRANSLATION_PASSWORD \
            --required-secret NUTSNEWS_WORKER_UPLIFT_POSTGRES_PERSISTENCE_PASSWORD \
            --required-secret NUTSNEWS_WORKER_UPLIFT_POSTGRES_PUBLICATION_PASSWORD \
            --required-secret NUTSNEWS_WORKER_UPLIFT_RECONCILIATION_TOKEN \
            --required-secret RABBITMQ_ERLANG_COOKIE \
            --required-secret RABBITMQ_BREAK_GLASS_ADMIN_PASSWORD \
            --required-secret RABBITMQ_MONITORING_PASSWORD \
            --required-secret RABBITMQ_SCHEDULER_PUBLISHER_PASSWORD \
            --required-secret RABBITMQ_FETCHER_CONSUMER_PASSWORD \
            --required-secret RABBITMQ_FETCHER_PUBLISHER_PASSWORD \
            --required-secret RABBITMQ_CANONICALIZER_CONSUMER_PASSWORD \
            --required-secret RABBITMQ_CANONICALIZER_PUBLISHER_PASSWORD \
            --required-secret RABBITMQ_ENRICHMENT_CONSUMER_PASSWORD \
            --required-secret RABBITMQ_ENRICHMENT_PUBLISHER_PASSWORD \
            --required-secret RABBITMQ_APPROVAL_CONSUMER_PASSWORD \
            --required-secret RABBITMQ_APPROVAL_PUBLISHER_PASSWORD \
            --required-secret RABBITMQ_TRANSLATION_CONSUMER_PASSWORD \
            --required-secret RABBITMQ_TRANSLATION_PUBLISHER_PASSWORD \
            --required-secret RABBITMQ_PERSISTENCE_CONSUMER_PASSWORD \
            --required-secret RABBITMQ_PERSISTENCE_PUBLISHER_PASSWORD \
            --required-secret RABBITMQ_PUBLICATION_CONSUMER_PASSWORD \
            --output "$RUNNER_TEMP/backend-deployment-safety-pre.json" \
            --summary "$RUNNER_TEMP/backend-deployment-safety-pre.md"

      - name: Build runtime extra vars
        shell: bash
        env:
          NUTSNEWS_BACKEND_ANSIBLE_USER: ${{ secrets.NUTSNEWS_BACKEND_ANSIBLE_USER }}
          NUTSNEWS_BACKEND_BECOME_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_BECOME_PASSWORD }}
          NUTSNEWS_BACKEND_RESTIC_PROVIDER: ${{ vars.NUTSNEWS_BACKEND_RESTIC_PROVIDER || 's3' }}
          RESTIC_REPOSITORY: ${{ secrets.RESTIC_REPOSITORY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          GRAFANA_CLOUD_PROMETHEUS_URL: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_URL }}
          GRAFANA_CLOUD_PROMETHEUS_USERNAME: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_USERNAME }}
          GRAFANA_CLOUD_PROMETHEUS_PASSWORD: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_PASSWORD }}
          GRAFANA_CLOUD_LOKI_URL: ${{ secrets.GRAFANA_CLOUD_LOKI_URL }}
          GRAFANA_CLOUD_LOKI_USERNAME: ${{ secrets.GRAFANA_CLOUD_LOKI_USERNAME }}
          GRAFANA_CLOUD_LOKI_PASSWORD: ${{ secrets.GRAFANA_CLOUD_LOKI_PASSWORD }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NEW_RELIC_LICENCE_KEY: ${{ secrets.NEW_RELIC_LICENCE_KEY }}
          NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION || 'us' }}
          B2_ACCOUNT_ID: ${{ secrets.B2_ACCOUNT_ID }}
          B2_ACCOUNT_KEY: ${{ secrets.B2_ACCOUNT_KEY }}
          NUTSNEWS_BACKEND_ENVIRONMENT: ${{ vars.NUTSNEWS_BACKEND_ENVIRONMENT || 'production' }}
          NUTSNEWS_BACKEND_DOMAIN: ${{ vars.NUTSNEWS_BACKEND_DOMAIN || 'backend.nutsnews.com' }}
          NUTSNEWS_BACKUP_CHECK_READ_DATA_SUBSET: ${{ vars.NUTSNEWS_BACKUP_CHECK_READ_DATA_SUBSET || '1%' }}
          NUTSNEWS_BACKUP_STALE_AFTER_HOURS: ${{ vars.NUTSNEWS_BACKUP_STALE_AFTER_HOURS || '30' }}
          NUTSNEWS_BACKUP_QUOTA_WARN_BYTES: ${{ vars.NUTSNEWS_BACKUP_QUOTA_WARN_BYTES || '0' }}
          NUTSNEWS_BACKEND_POSTGRES_ENABLED: ${{ vars.NUTSNEWS_BACKEND_POSTGRES_ENABLED || 'true' }}
          NUTSNEWS_BACKEND_DB_DASHBOARD_ENABLED: ${{ vars.NUTSNEWS_BACKEND_DB_DASHBOARD_ENABLED || 'true' }}
          NUTSNEWS_BACKEND_POSTGRES_PRIMARY_DATABASE: ${{ vars.NUTSNEWS_BACKEND_POSTGRES_PRIMARY_DATABASE || vars.NUTSNEWS_BACKEND_POSTGRES_PRIMARY_SHADOW_DATABASE || 'nutsnews_primary_shadow' }}
          NUTSNEWS_BACKEND_POSTGRES_APP_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_APP_PASSWORD }}
          NUTSNEWS_BACKEND_POSTGRES_READONLY_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_READONLY_PASSWORD }}
          NUTSNEWS_BACKEND_POSTGRES_MIGRATION_RESTORE_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_MIGRATION_RESTORE_PASSWORD }}
          NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD }}
          NUTSNEWS_BACKEND_POSTGRES_MIGRATION_REPLICATION_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_MIGRATION_REPLICATION_PASSWORD }}
          NUTSNEWS_BACKEND_POSTGRES_MIGRATION_APP_REHEARSAL_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_MIGRATION_APP_REHEARSAL_PASSWORD }}
          NUTSNEWS_BACKEND_POSTGRES_WORKER_API_PASSWORD: ${{ secrets.NUTSNEWS_BACKEND_POSTGRES_WORKER_API_PASSWORD }}
          NUTSNEWS_BACKEND_SUPABASE_SYNC_RELAY_ENABLED: ${{ vars.NUTSNEWS_BACKEND_SUPABASE_SYNC_RELAY_ENABLED || 'false' }}
          NUTSNEWS_BACKEND_SUPABASE_SYNC_RELAY_INTERVAL_SECONDS: ${{ vars.NUTSNEWS_BACKEND_SUPABASE_SYNC_RELAY_INTERVAL_SECONDS || '30' }}
          NUTSNEWS_BACKEND_SUPABASE_SYNC_RELAY_BATCH_SIZE: ${{ vars.NUTSNEWS_BACKEND_SUPABASE_SYNC_RELAY_BATCH_SIZE || '500' }}
          NUTSNEWS_PRODUCTION_SUPABASE_DB_URL: ${{ secrets.NUTSNEWS_PRODUCTION_SUPABASE_DB_URL }}
          NUTSNEWS_BACKEND_WORKER_API_ENABLED: ${{ vars.NUTSNEWS_BACKEND_WORKER_API_ENABLED || 'false' }}
          NUTSNEWS_BACKEND_WORKER_API_WRITES_ENABLED: ${{ vars.NUTSNEWS_BACKEND_WORKER_API_WRITES_ENABLED || 'false' }}
          NUTSNEWS_BACKEND_API_TOKEN: ${{ secrets.NUTSNEWS_BACKEND_API_TOKEN }}
          LOCAL_AI_URL: ${{ vars.LOCAL_AI_URL || 'https://ai.nutsnews.com' }}
          LOCAL_AI_API_KEY: ${{ secrets.LOCAL_AI_API_KEY }}
          NUTSNEWS_BACKEND_WORKER_UPLIFT_PERSISTENCE_TOKEN: ${{ secrets.NUTSNEWS_BACKEND_WORKER_UPLIFT_PERSISTENCE_TOKEN }}
          NUTSNEWS_BACKEND_WORKER_UPLIFT_PUBLICATION_TOKEN: ${{ secrets.NUTSNEWS_BACKEND_WORKER_UPLIFT_PUBLICATION_TOKEN }}
          NUTSNEWS_BACKEND_WORKER_UPLIFT_SCOPED_TOKENS_ENABLED: ${{ vars.NUTSNEWS_BACKEND_WORKER_UPLIFT_SCOPED_TOKENS_ENABLED || 'false' }}
          NUTSNEWS_WORKER_UPLIFT_RECONCILIATION_TOKEN: ${{ secrets.NUTSNEWS_WORKER_UPLIFT_RECONCILIATION_TOKEN }}
          NUTSNEWS_WORKER_UPLIFT_RECONCILIATION_APPLY_ENABLED: ${{ vars.NUTSNEWS_WORKER_UPLIFT_RECONCILIATION_APPLY_ENABLED || 'false' }}
          NUTSNEWS_WORKER_UPLIFT_CUTOVER_STATE: ${{ vars.NUTSNEWS_WORKER_UPLIFT_CUTOVER_STATE || 'shadow' }}
          NUTSNEWS_WORKER_UPLIFT_PRODUCTION_WRITES_ENABLED: ${{ vars.NUTSNEWS_WORKER_UPLIFT_PRODUCTION_WRITES_ENABLED || 'false' }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_ENABLED: ${{ vars.NUTSNEWS_WORKER_UPLIFT_POSTGRES_ENABLED || 'true' }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_SCHEDULER_USERNAME: ${{ vars.NUTSNEWS_WORKER_UPLIFT_POSTGRES_SCHEDULER_USERNAME || 'nutsnews_worker_uplift_scheduler' }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_SCHEDULER_PASSWORD: ${{ secrets.NUTSNEWS_WORKER_UPLIFT_POSTGRES_SCHEDULER_PASSWORD }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_FETCHER_USERNAME: ${{ vars.NUTSNEWS_WORKER_UPLIFT_POSTGRES_FETCHER_USERNAME || 'nutsnews_worker_uplift_fetcher' }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_FETCHER_PASSWORD: ${{ secrets.NUTSNEWS_WORKER_UPLIFT_POSTGRES_FETCHER_PASSWORD }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_CANONICALIZER_USERNAME: ${{ vars.NUTSNEWS_WORKER_UPLIFT_POSTGRES_CANONICALIZER_USERNAME || 'nutsnews_worker_uplift_canonicalizer' }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_CANONICALIZER_PASSWORD: ${{ secrets.NUTSNEWS_WORKER_UPLIFT_POSTGRES_CANONICALIZER_PASSWORD }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_ENRICHMENT_USERNAME: ${{ vars.NUTSNEWS_WORKER_UPLIFT_POSTGRES_ENRICHMENT_USERNAME || 'nutsnews_worker_uplift_enrichment' }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_ENRICHMENT_PASSWORD: ${{ secrets.NUTSNEWS_WORKER_UPLIFT_POSTGRES_ENRICHMENT_PASSWORD }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_APPROVAL_USERNAME: ${{ vars.NUTSNEWS_WORKER_UPLIFT_POSTGRES_APPROVAL_USERNAME || 'nutsnews_worker_uplift_approval' }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_APPROVAL_PASSWORD: ${{ secrets.NUTSNEWS_WORKER_UPLIFT_POSTGRES_APPROVAL_PASSWORD }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_TRANSLATION_USERNAME: ${{ vars.NUTSNEWS_WORKER_UPLIFT_POSTGRES_TRANSLATION_USERNAME || 'nutsnews_worker_uplift_translation' }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_TRANSLATION_PASSWORD: ${{ secrets.NUTSNEWS_WORKER_UPLIFT_POSTGRES_TRANSLATION_PASSWORD }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_PERSISTENCE_USERNAME: ${{ vars.NUTSNEWS_WORKER_UPLIFT_POSTGRES_PERSISTENCE_USERNAME || 'nutsnews_worker_uplift_persistence' }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_PERSISTENCE_PASSWORD: ${{ secrets.NUTSNEWS_WORKER_UPLIFT_POSTGRES_PERSISTENCE_PASSWORD }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_PUBLICATION_USERNAME: ${{ vars.NUTSNEWS_WORKER_UPLIFT_POSTGRES_PUBLICATION_USERNAME || 'nutsnews_worker_uplift_publication' }}
          NUTSNEWS_WORKER_UPLIFT_POSTGRES_PUBLICATION_PASSWORD: ${{ secrets.NUTSNEWS_WORKER_UPLIFT_POSTGRES_PUBLICATION_PASSWORD }}
          NUTSNEWS_BACKEND_RABBITMQ_ENABLED: ${{ vars.NUTSNEWS_BACKEND_RABBITMQ_ENABLED || 'true' }}
          NUTSNEWS_BACKEND_WORKER_RUNTIME_ENABLED: ${{ vars.NUTSNEWS_BACKEND_WORKER_RUNTIME_ENABLED || 'false' }}
          NUTSNEWS_BACKEND_WORKER_RUNTIME_PRODUCTION_WRITES_ENABLED: ${{ vars.NUTSNEWS_BACKEND_WORKER_RUNTIME_PRODUCTION_WRITES_ENABLED || 'false' }}
          RABBITMQ_VHOST: ${{ vars.RABBITMQ_VHOST || 'nutsnews-worker-uplift' }}
          RABBITMQ_BREAK_GLASS_ADMIN_USERNAME: ${{ vars.RABBITMQ_BREAK_GLASS_ADMIN_USERNAME || 'nutsnews_rabbitmq_admin' }}
          RABBITMQ_ERLANG_COOKIE: ${{ secrets.RABBITMQ_ERLANG_COOKIE }}
          RABBITMQ_BREAK_GLASS_ADMIN_PASSWORD: ${{ secrets.RABBITMQ_BREAK_GLASS_ADMIN_PASSWORD }}
          RABBITMQ_MONITORING_USERNAME: ${{ vars.RABBITMQ_MONITORING_USERNAME || 'nutsnews_rabbitmq_monitoring' }}
          RABBITMQ_MONITORING_PASSWORD: ${{ secrets.RABBITMQ_MONITORING_PASSWORD }}
          RABBITMQ_SCHEDULER_PUBLISHER_USERNAME: ${{ vars.RABBITMQ_SCHEDULER_PUBLISHER_USERNAME || 'nutsnews_scheduler_publisher' }}
          RABBITMQ_SCHEDULER_PUBLISHER_PASSWORD: ${{ secrets.RABBITMQ_SCHEDULER_PUBLISHER_PASSWORD }}
          RABBITMQ_FETCHER_CONSUMER_USERNAME: ${{ vars.RABBITMQ_FETCHER_CONSUMER_USERNAME || 'nutsnews_fetcher_consumer' }}
          RABBITMQ_FETCHER_CONSUMER_PASSWORD: ${{ secrets.RABBITMQ_FETCHER_CONSUMER_PASSWORD }}
          RABBITMQ_FETCHER_PUBLISHER_USERNAME: ${{ vars.RABBITMQ_FETCHER_PUBLISHER_USERNAME || 'nutsnews_fetcher_publisher' }}
          RABBITMQ_FETCHER_PUBLISHER_PASSWORD: ${{ secrets.RABBITMQ_FETCHER_PUBLISHER_PASSWORD }}
          RABBITMQ_CANONICALIZER_CONSUMER_USERNAME: ${{ vars.RABBITMQ_CANONICALIZER_CONSUMER_USERNAME || 'nutsnews_canonicalizer_consumer' }}
          RABBITMQ_CANONICALIZER_CONSUMER_PASSWORD: ${{ secrets.RABBITMQ_CANONICALIZER_CONSUMER_PASSWORD }}
          RABBITMQ_CANONICALIZER_PUBLISHER_USERNAME: ${{ vars.RABBITMQ_CANONICALIZER_PUBLISHER_USERNAME || 'nutsnews_canonicalizer_publisher' }}
          RABBITMQ_CANONICALIZER_PUBLISHER_PASSWORD: ${{ secrets.RABBITMQ_CANONICALIZER_PUBLISHER_PASSWORD }}
          RABBITMQ_ENRICHMENT_CONSUMER_USERNAME: ${{ vars.RABBITMQ_ENRICHMENT_CONSUMER_USERNAME || 'nutsnews_enrichment_consumer' }}
          RABBITMQ_ENRICHMENT_CONSUMER_PASSWORD: ${{ secrets.RABBITMQ_ENRICHMENT_CONSUMER_PASSWORD }}
          RABBITMQ_ENRICHMENT_PUBLISHER_USERNAME: ${{ vars.RABBITMQ_ENRICHMENT_PUBLISHER_USERNAME || 'nutsnews_enrichment_publisher' }}
          RABBITMQ_ENRICHMENT_PUBLISHER_PASSWORD: ${{ secrets.RABBITMQ_ENRICHMENT_PUBLISHER_PASSWORD }}
          RABBITMQ_APPROVAL_CONSUMER_USERNAME: ${{ vars.RABBITMQ_APPROVAL_CONSUMER_USERNAME || 'nutsnews_approval_consumer' }}
          RABBITMQ_APPROVAL_CONSUMER_PASSWORD: ${{ secrets.RABBITMQ_APPROVAL_CONSUMER_PASSWORD }}
          RABBITMQ_APPROVAL_PUBLISHER_USERNAME: ${{ vars.RABBITMQ_APPROVAL_PUBLISHER_USERNAME || 'nutsnews_approval_publisher' }}
          RABBITMQ_APPROVAL_PUBLISHER_PASSWORD: ${{ secrets.RABBITMQ_APPROVAL_PUBLISHER_PASSWORD }}
          RABBITMQ_TRANSLATION_CONSUMER_USERNAME: ${{ vars.RABBITMQ_TRANSLATION_CONSUMER_USERNAME || 'nutsnews_translation_consumer' }}
          RABBITMQ_TRANSLATION_CONSUMER_PASSWORD: ${{ secrets.RABBITMQ_TRANSLATION_CONSUMER_PASSWORD }}
          RABBITMQ_TRANSLATION_PUBLISHER_USERNAME: ${{ vars.RABBITMQ_TRANSLATION_PUBLISHER_USERNAME || 'nutsnews_translation_publisher' }}
          RABBITMQ_TRANSLATION_PUBLISHER_PASSWORD: ${{ secrets.RABBITMQ_TRANSLATION_PUBLISHER_PASSWORD }}
          RABBITMQ_PERSISTENCE_CONSUMER_USERNAME: ${{ vars.RABBITMQ_PERSISTENCE_CONSUMER_USERNAME || 'nutsnews_persistence_consumer' }}
          RABBITMQ_PERSISTENCE_CONSUMER_PASSWORD: ${{ secrets.RABBITMQ_PERSISTENCE_CONSUMER_PASSWORD }}
          RABBITMQ_PERSISTENCE_PUBLISHER_USERNAME: ${{ vars.RABBITMQ_PERSISTENCE_PUBLISHER_USERNAME || 'nutsnews_persistence_publisher' }}
          RABBITMQ_PERSISTENCE_PUBLISHER_PASSWORD: ${{ secrets.RABBITMQ_PERSISTENCE_PUBLISHER_PASSWORD }}
          RABBITMQ_PUBLICATION_CONSUMER_USERNAME: ${{ vars.RABBITMQ_PUBLICATION_CONSUMER_USERNAME || 'nutsnews_publication_consumer' }}
          RABBITMQ_PUBLICATION_CONSUMER_PASSWORD: ${{ secrets.RABBITMQ_PUBLICATION_CONSUMER_PASSWORD }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          from pathlib import Path

          extra_vars = {}
          identifier_re = re.compile(r"^[A-Za-z_][A-Za-z0-9_]*$")

          ansible_user = os.environ.get("NUTSNEWS_BACKEND_ANSIBLE_USER", "").strip()
          if ansible_user:
              extra_vars["ansible_user"] = ansible_user

          become_password = os.environ.get("NUTSNEWS_BACKEND_BECOME_PASSWORD", "")
          if become_password:
              extra_vars["ansible_become_password"] = become_password

          restic_repository = os.environ.get("RESTIC_REPOSITORY", "").strip()
          restic_password = os.environ.get("RESTIC_PASSWORD", "")
          if restic_repository and restic_password:
              extra_vars["backend_backup_enabled"] = True
              extra_vars["backend_backup_restic_repository"] = restic_repository
              extra_vars["backend_backup_restic_password"] = restic_password
              extra_vars["backend_backup_restic_provider"] = os.environ.get("NUTSNEWS_BACKEND_RESTIC_PROVIDER", "s3").strip() or "s3"
              extra_vars["backend_backup_check_read_data_subset"] = os.environ.get("NUTSNEWS_BACKUP_CHECK_READ_DATA_SUBSET", "1%").strip() or "1%"
              extra_vars["backend_backup_stale_after_hours"] = int(os.environ.get("NUTSNEWS_BACKUP_STALE_AFTER_HOURS", "30") or "30")
              extra_vars["backend_backup_quota_warn_bytes"] = int(os.environ.get("NUTSNEWS_BACKUP_QUOTA_WARN_BYTES", "0") or "0")
              backup_environment = {}
              for name in (
                  "AWS_ACCESS_KEY_ID",
                  "AWS_SECRET_ACCESS_KEY",
                  "AWS_DEFAULT_REGION",
                  "B2_ACCOUNT_ID",
                  "B2_ACCOUNT_KEY",
              ):
                  value = os.environ.get(name, "")
                  if value:
                      backup_environment[name] = value
              extra_vars["backend_backup_environment"] = backup_environment

          metrics_values = {
              "backend_metrics_prometheus_remote_write_url": os.environ.get("GRAFANA_CLOUD_PROMETHEUS_URL", "").strip(),
              "backend_metrics_prometheus_username": os.environ.get("GRAFANA_CLOUD_PROMETHEUS_USERNAME", "").strip(),
              "backend_metrics_prometheus_password": os.environ.get("GRAFANA_CLOUD_PROMETHEUS_PASSWORD", ""),
          }
          if all(metrics_values.values()):
              extra_vars["backend_metrics_enabled"] = True
              extra_vars.update(metrics_values)
              extra_vars["backend_metrics_environment_label"] = os.environ.get("NUTSNEWS_BACKEND_ENVIRONMENT", "production").strip() or "production"
              extra_vars["backend_metrics_instance_label"] = os.environ.get("NUTSNEWS_BACKEND_DOMAIN", "backend.nutsnews.com").strip() or "backend.nutsnews.com"

          logs_values = {
              "backend_logs_loki_url": os.environ.get("GRAFANA_CLOUD_LOKI_URL", "").strip(),
              "backend_logs_loki_username": os.environ.get("GRAFANA_CLOUD_LOKI_USERNAME", "").strip(),
              "backend_logs_loki_password": os.environ.get("GRAFANA_CLOUD_LOKI_PASSWORD", ""),
          }
          if all(logs_values.values()):
              extra_vars["backend_logs_enabled"] = True
              extra_vars.update(logs_values)

          new_relic_license_key = os.environ.get("NEW_RELIC_LICENSE_KEY", "") or os.environ.get("NEW_RELIC_LICENCE_KEY", "")
          if new_relic_license_key:
              extra_vars["backend_newrelic_logs_enabled"] = True
              extra_vars["backend_newrelic_metrics_enabled"] = True
              extra_vars["backend_newrelic_metric_license_key"] = new_relic_license_key
              extra_vars["backend_newrelic_metric_region"] = os.environ.get("NEW_RELIC_REGION", "us").strip().lower() or "us"
              extra_vars["backend_newrelic_metric_environment_label"] = os.environ.get("NUTSNEWS_BACKEND_ENVIRONMENT", "production").strip() or "production"
              extra_vars["backend_newrelic_metric_host"] = os.environ.get("NUTSNEWS_BACKEND_DOMAIN", "backend.nutsnews.com").strip() or "backend.nutsnews.com"

          postgres_enabled = os.environ.get("NUTSNEWS_BACKEND_POSTGRES_ENABLED", "true").strip().lower() in {"1", "true", "yes"}
          if postgres_enabled:
              app_password = os.environ.get("NUTSNEWS_BACKEND_POSTGRES_APP_PASSWORD", "")
              readonly_password = os.environ.get("NUTSNEWS_BACKEND_POSTGRES_READONLY_PASSWORD", "")
              missing = [
                  name
                  for name, value in (
                      ("NUTSNEWS_BACKEND_POSTGRES_APP_PASSWORD", app_password),
                      ("NUTSNEWS_BACKEND_POSTGRES_READONLY_PASSWORD", readonly_password),
                      ("NUTSNEWS_BACKEND_POSTGRES_MIGRATION_RESTORE_PASSWORD", os.environ.get("NUTSNEWS_BACKEND_POSTGRES_MIGRATION_RESTORE_PASSWORD", "")),
                      ("NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD", os.environ.get("NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD", "")),
                      ("NUTSNEWS_BACKEND_POSTGRES_MIGRATION_REPLICATION_PASSWORD", os.environ.get("NUTSNEWS_BACKEND_POSTGRES_MIGRATION_REPLICATION_PASSWORD", "")),
                      ("NUTSNEWS_BACKEND_POSTGRES_MIGRATION_APP_REHEARSAL_PASSWORD", os.environ.get("NUTSNEWS_BACKEND_POSTGRES_MIGRATION_APP_REHEARSAL_PASSWORD", "")),
                      ("NUTSNEWS_BACKEND_POSTGRES_WORKER_API_PASSWORD", os.environ.get("NUTSNEWS_BACKEND_POSTGRES_WORKER_API_PASSWORD", "")),
                  )
                  if not value
              ]
              if missing:
                  raise SystemExit(f"Missing required PostgreSQL environment secret names: {', '.join(missing)}")
              extra_vars["backend_postgres_enabled"] = True
              extra_vars["backend_db_dashboard_enabled"] = (
                  os.environ.get("NUTSNEWS_BACKEND_DB_DASHBOARD_ENABLED", "true").strip().lower() in {"1", "true", "yes"}
              )
              primary_shadow_database = os.environ.get("NUTSNEWS_BACKEND_POSTGRES_PRIMARY_SHADOW_DATABASE", "nutsnews_primary_shadow").strip() or "nutsnews_primary_shadow"
              if not identifier_re.match(primary_shadow_database):
                  raise SystemExit("NUTSNEWS_BACKEND_POSTGRES_PRIMARY_SHADOW_DATABASE must be a safe PostgreSQL identifier")
              extra_vars["backend_postgres_primary_shadow_database"] = primary_shadow_database
              extra_vars["backend_postgres_app_password"] = app_password
              extra_vars["backend_postgres_readonly_password"] = readonly_password
              extra_vars["backend_postgres_restore_password"] = os.environ["NUTSNEWS_BACKEND_POSTGRES_MIGRATION_RESTORE_PASSWORD"]
              extra_vars["backend_postgres_validation_password"] = os.environ["NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD"]
              extra_vars["backend_worker_uplift_projection_password"] = os.environ["NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD"]
              extra_vars["backend_postgres_replication_password"] = os.environ["NUTSNEWS_BACKEND_POSTGRES_MIGRATION_REPLICATION_PASSWORD"]
              extra_vars["backend_postgres_app_rehearsal_password"] = os.environ["NUTSNEWS_BACKEND_POSTGRES_MIGRATION_APP_REHEARSAL_PASSWORD"]
              extra_vars["backend_postgres_worker_api_password"] = os.environ["NUTSNEWS_BACKEND_POSTGRES_WORKER_API_PASSWORD"]

          supabase_sync_relay_enabled = (
              os.environ.get("NUTSNEWS_BACKEND_SUPABASE_SYNC_RELAY_ENABLED", "false").strip().lower()
              in {"1", "true", "yes"}
          )
          if supabase_sync_relay_enabled:
              if not postgres_enabled:
                  raise SystemExit("Backend Supabase sync relay requires NUTSNEWS_BACKEND_POSTGRES_ENABLED=true")
              source_password = os.environ.get("NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD", "")
              target_db_url = os.environ.get("NUTSNEWS_PRODUCTION_SUPABASE_DB_URL", "").strip()
              if not source_password:
                  raise SystemExit("Backend Supabase sync relay requires NUTSNEWS_BACKEND_POSTGRES_MIGRATION_VALIDATION_PASSWORD")
              if not target_db_url:
                  raise SystemExit("Backend Supabase sync relay requires NUTSNEWS_PRODUCTION_SUPABASE_DB_URL")
              if "nutsnews-standby" in target_db_url.lower():
                  raise SystemExit("Backend Supabase sync relay must target existing production Supabase, not nutsnews-standby")
              primary_database = (
                  os.environ.get("NUTSNEWS_BACKEND_POSTGRES_PRIMARY_DATABASE", "").strip()
                  or extra_vars.get("backend_postgres_primary_shadow_database", "nutsnews_primary_shadow")
              )
              if not identifier_re.match(str(primary_database)):
                  raise SystemExit("NUTSNEWS_BACKEND_POSTGRES_PRIMARY_DATABASE must be a safe PostgreSQL identifier")
              if any("\n" in value or "\r" in value for value in (source_password, target_db_url, str(primary_database))):
                  raise SystemExit("Backend Supabase sync relay DB URL values must be single-line values")
              interval_seconds = int(os.environ.get("NUTSNEWS_BACKEND_SUPABASE_SYNC_RELAY_INTERVAL_SECONDS", "30") or "30")
              batch_size = int(os.environ.get("NUTSNEWS_BACKEND_SUPABASE_SYNC_RELAY_BATCH_SIZE", "500") or "500")
              if interval_seconds < 10 or interval_seconds > 3600:
                  raise SystemExit("NUTSNEWS_BACKEND_SUPABASE_SYNC_RELAY_INTERVAL_SECONDS must be between 10 and 3600")
              if batch_size < 1 or batch_size > 5000:
                  raise SystemExit("NUTSNEWS_BACKEND_SUPABASE_SYNC_RELAY_BATCH_SIZE must be between 1 and 5000")
              source_user = "nutsnews_migration_validation"
              source_url = (
                  "postgresql://"
                  f"{urllib.parse.quote(source_user, safe='')}:"
                  f"{urllib.parse.quote(source_password, safe='')}"
                  f"@127.0.0.1:5432/{urllib.parse.quote(str(primary_database), safe='')}"
                  "?sslmode=disable"
              )
              extra_vars["backend_supabase_sync_relay_enabled"] = True
              extra_vars["backend_supabase_sync_relay_source_db_url"] = source_url
              extra_vars["backend_supabase_sync_relay_target_db_url"] = target_db_url
              extra_vars["backend_supabase_sync_relay_interval_seconds"] = interval_seconds
              extra_vars["backend_supabase_sync_relay_batch_size"] = batch_size

          worker_uplift_postgres_enabled = postgres_enabled and (
              os.environ.get("NUTSNEWS_WORKER_UPLIFT_POSTGRES_ENABLED", "true").strip().lower() in {"1", "true", "yes"}
          )
          if worker_uplift_postgres_enabled:
              stage_names = (
                  "scheduler",
                  "fetcher",
                  "canonicalizer",
                  "enrichment",
                  "approval",
                  "translation",
                  "persistence",
                  "publication",
              )
              extra_vars["backend_worker_uplift_postgres_enabled"] = True
              extra_vars["backend_worker_uplift_postgres_database"] = extra_vars["backend_postgres_primary_shadow_database"]
              for stage_name in stage_names:
                  env_prefix = f"NUTSNEWS_WORKER_UPLIFT_POSTGRES_{stage_name.upper()}"
                  username = os.environ.get(f"{env_prefix}_USERNAME", "").strip()
                  password = os.environ.get(f"{env_prefix}_PASSWORD", "")
                  if not username:
                      raise SystemExit(f"Missing required worker-uplift PostgreSQL variable: {env_prefix}_USERNAME")
                  if not password:
                      raise SystemExit(f"Missing required worker-uplift PostgreSQL secret: {env_prefix}_PASSWORD")
                  if not identifier_re.match(username):
                      raise SystemExit(f"{env_prefix}_USERNAME must be a safe PostgreSQL identifier")
                  extra_vars[f"backend_worker_uplift_postgres_{stage_name}_user"] = username
                  extra_vars[f"backend_worker_uplift_postgres_{stage_name}_password"] = password

          worker_api_enabled = os.environ.get("NUTSNEWS_BACKEND_WORKER_API_ENABLED", "false").strip().lower() in {"1", "true", "yes"}
          if worker_api_enabled:
              token = os.environ.get("NUTSNEWS_BACKEND_API_TOKEN", "")
              if not token:
                  raise SystemExit("Missing required Worker database API secret: NUTSNEWS_BACKEND_API_TOKEN")
              writes_enabled = os.environ.get("NUTSNEWS_BACKEND_WORKER_API_WRITES_ENABLED", "false").strip().lower() in {"1", "true", "yes"}
              extra_vars["backend_worker_api_enabled"] = True
              extra_vars["backend_worker_api_token"] = token
              scoped_uplift_enabled = (
                  os.environ.get("NUTSNEWS_BACKEND_WORKER_UPLIFT_SCOPED_TOKENS_ENABLED", "false").strip().lower()
                  in {"1", "true", "yes"}
              )
              if scoped_uplift_enabled:
                  persistence_token = os.environ.get("NUTSNEWS_BACKEND_WORKER_UPLIFT_PERSISTENCE_TOKEN", "")
                  publication_token = os.environ.get("NUTSNEWS_BACKEND_WORKER_UPLIFT_PUBLICATION_TOKEN", "")
                  missing_scoped = [
                      name
                      for name, value in (
                          ("NUTSNEWS_BACKEND_WORKER_UPLIFT_PERSISTENCE_TOKEN", persistence_token),
                          ("NUTSNEWS_BACKEND_WORKER_UPLIFT_PUBLICATION_TOKEN", publication_token),
                      )
                      if not value
                  ]
                  if missing_scoped:
                      raise SystemExit(f"Missing required scoped Worker uplift API secrets: {', '.join(missing_scoped)}")
                  if len({token, persistence_token, publication_token}) != 3:
                      raise SystemExit("Worker API legacy, persistence, and publication tokens must be distinct")
                  extra_vars["backend_worker_api_uplift_persistence_token"] = persistence_token
                  extra_vars["backend_worker_api_uplift_publication_token"] = publication_token
              cutover_state = os.environ.get("NUTSNEWS_WORKER_UPLIFT_CUTOVER_STATE", "shadow").strip() or "shadow"
              if cutover_state not in {"shadow", "cutover-approved"}:
                  raise SystemExit("NUTSNEWS_WORKER_UPLIFT_CUTOVER_STATE must be shadow or cutover-approved")
              uplift_production_writes_enabled = (
                  os.environ.get("NUTSNEWS_WORKER_UPLIFT_PRODUCTION_WRITES_ENABLED", "false").strip().lower()
                  in {"1", "true", "yes"}
              )
              if uplift_production_writes_enabled and cutover_state != "cutover-approved":
                  raise SystemExit("Worker uplift production writes require cutover-approved state")
              extra_vars["backend_worker_api_uplift_cutover_state"] = cutover_state
              extra_vars["backend_worker_api_uplift_production_writes_enabled"] = uplift_production_writes_enabled
              extra_vars["backend_worker_api_db_name"] = extra_vars.get(
                  "backend_postgres_primary_shadow_database",
                  os.environ.get("NUTSNEWS_BACKEND_POSTGRES_PRIMARY_SHADOW_DATABASE", "nutsnews_primary_shadow").strip() or "nutsnews_primary_shadow",
              )
              extra_vars["backend_worker_api_writes_enabled"] = writes_enabled
              if writes_enabled:
                  if not os.environ.get("NUTSNEWS_BACKEND_POSTGRES_APP_PASSWORD", ""):
                      raise SystemExit("Worker database API writes require NUTSNEWS_BACKEND_POSTGRES_APP_PASSWORD")
                  extra_vars["backend_worker_api_db_user"] = "nutsnews_app"
                  extra_vars["backend_worker_api_db_password"] = os.environ["NUTSNEWS_BACKEND_POSTGRES_APP_PASSWORD"]
              else:
                  if not os.environ.get("NUTSNEWS_BACKEND_POSTGRES_WORKER_API_PASSWORD", ""):
                      raise SystemExit("Worker database API shadow reads require NUTSNEWS_BACKEND_POSTGRES_WORKER_API_PASSWORD")
                  extra_vars["backend_worker_api_db_user"] = "nutsnews_worker_api"
                  extra_vars["backend_worker_api_db_password"] = os.environ["NUTSNEWS_BACKEND_POSTGRES_WORKER_API_PASSWORD"]

          rabbitmq_enabled = os.environ.get("NUTSNEWS_BACKEND_RABBITMQ_ENABLED", "true").strip().lower() in {"1", "true", "yes"}
          if rabbitmq_enabled:
              rabbitmq_topology_environment_names = (
                  "RABBITMQ_BREAK_GLASS_ADMIN_USERNAME",
                  "RABBITMQ_BREAK_GLASS_ADMIN_PASSWORD",
                  "RABBITMQ_MONITORING_USERNAME",
                  "RABBITMQ_MONITORING_PASSWORD",
                  "RABBITMQ_SCHEDULER_PUBLISHER_USERNAME",
                  "RABBITMQ_SCHEDULER_PUBLISHER_PASSWORD",
                  "RABBITMQ_FETCHER_CONSUMER_USERNAME",
                  "RABBITMQ_FETCHER_CONSUMER_PASSWORD",
                  "RABBITMQ_FETCHER_PUBLISHER_USERNAME",
                  "RABBITMQ_FETCHER_PUBLISHER_PASSWORD",
                  "RABBITMQ_CANONICALIZER_CONSUMER_USERNAME",
                  "RABBITMQ_CANONICALIZER_CONSUMER_PASSWORD",
                  "RABBITMQ_CANONICALIZER_PUBLISHER_USERNAME",
                  "RABBITMQ_CANONICALIZER_PUBLISHER_PASSWORD",
                  "RABBITMQ_ENRICHMENT_CONSUMER_USERNAME",
                  "RABBITMQ_ENRICHMENT_CONSUMER_PASSWORD",
                  "RABBITMQ_ENRICHMENT_PUBLISHER_USERNAME",
                  "RABBITMQ_ENRICHMENT_PUBLISHER_PASSWORD",
                  "RABBITMQ_APPROVAL_CONSUMER_USERNAME",
                  "RABBITMQ_APPROVAL_CONSUMER_PASSWORD",
                  "RABBITMQ_APPROVAL_PUBLISHER_USERNAME",
                  "RABBITMQ_APPROVAL_PUBLISHER_PASSWORD",
                  "RABBITMQ_TRANSLATION_CONSUMER_USERNAME",
                  "RABBITMQ_TRANSLATION_CONSUMER_PASSWORD",
                  "RABBITMQ_TRANSLATION_PUBLISHER_USERNAME",
                  "RABBITMQ_TRANSLATION_PUBLISHER_PASSWORD",
                  "RABBITMQ_PERSISTENCE_CONSUMER_USERNAME",
                  "RABBITMQ_PERSISTENCE_CONSUMER_PASSWORD",
                  "RABBITMQ_PERSISTENCE_PUBLISHER_USERNAME",
                  "RABBITMQ_PERSISTENCE_PUBLISHER_PASSWORD",
                  "RABBITMQ_PUBLICATION_CONSUMER_USERNAME",
                  "RABBITMQ_PUBLICATION_CONSUMER_PASSWORD",
              )
              rabbitmq_values = {
                  "RABBITMQ_VHOST": os.environ.get("RABBITMQ_VHOST", "").strip(),
                  "RABBITMQ_BREAK_GLASS_ADMIN_USERNAME": os.environ.get("RABBITMQ_BREAK_GLASS_ADMIN_USERNAME", "").strip(),
                  "RABBITMQ_ERLANG_COOKIE": os.environ.get("RABBITMQ_ERLANG_COOKIE", ""),
                  "RABBITMQ_BREAK_GLASS_ADMIN_PASSWORD": os.environ.get("RABBITMQ_BREAK_GLASS_ADMIN_PASSWORD", ""),
              }
              rabbitmq_topology_environment = {}
              for name in rabbitmq_topology_environment_names:
                  value = os.environ.get(name, "")
                  if name.endswith("_USERNAME"):
                      value = value.strip()
                  rabbitmq_topology_environment[name] = value
              missing = [name for name, value in {**rabbitmq_values, **rabbitmq_topology_environment}.items() if not value]
              if missing:
                  raise SystemExit(f"Missing required RabbitMQ environment names: {', '.join(missing)}")
              if any("\n" in value or "\r" in value for value in [*rabbitmq_values.values(), *rabbitmq_topology_environment.values()]):
                  raise SystemExit("RabbitMQ environment values must be single-line values")
              extra_vars["backend_rabbitmq_enabled"] = True
              extra_vars["backend_rabbitmq_vhost"] = rabbitmq_values["RABBITMQ_VHOST"]
              extra_vars["backend_rabbitmq_admin_username"] = rabbitmq_values["RABBITMQ_BREAK_GLASS_ADMIN_USERNAME"]
              extra_vars["backend_rabbitmq_erlang_cookie"] = rabbitmq_values["RABBITMQ_ERLANG_COOKIE"]
              extra_vars["backend_rabbitmq_admin_password"] = rabbitmq_values["RABBITMQ_BREAK_GLASS_ADMIN_PASSWORD"]
              extra_vars["backend_rabbitmq_topology_enabled"] = True
              extra_vars["backend_rabbitmq_topology_environment"] = rabbitmq_topology_environment
              if extra_vars.get("backend_metrics_enabled"):
                  extra_vars["backend_metrics_rabbitmq_enabled"] = True
                  extra_vars["backend_metrics_rabbitmq_vhost"] = rabbitmq_values["RABBITMQ_VHOST"]

          worker_runtime_enabled = os.environ.get("NUTSNEWS_BACKEND_WORKER_RUNTIME_ENABLED", "false").strip().lower() in {"1", "true", "yes"}
          if worker_runtime_enabled:
              if not rabbitmq_enabled:
                  raise SystemExit("Worker runtime requires backend RabbitMQ to be enabled.")
              if not worker_uplift_postgres_enabled:
                  raise SystemExit("Worker runtime requires worker-uplift PostgreSQL stage roles to be enabled.")
              production_writes_enabled = (
                  os.environ.get("NUTSNEWS_BACKEND_WORKER_RUNTIME_PRODUCTION_WRITES_ENABLED", "false").strip().lower()
                  in {"1", "true", "yes"}
              )
              if production_writes_enabled:
                  raise SystemExit("Worker runtime production writes must remain disabled until the protected cutover state is implemented.")
              backend_api_token = os.environ.get("NUTSNEWS_BACKEND_API_TOKEN", "")
              if not backend_api_token:
                  raise SystemExit("Worker runtime scheduler requires NUTSNEWS_BACKEND_API_TOKEN for shadow feed-source reads.")
              local_ai_base_url = os.environ.get("LOCAL_AI_URL", "https://ai.nutsnews.com").strip() or "https://ai.nutsnews.com"
              local_ai_api_key = os.environ.get("LOCAL_AI_API_KEY", "")
              if not local_ai_api_key:
                  raise SystemExit("Worker runtime AI shadow services require LOCAL_AI_API_KEY before approval/translation deployment.")
              if not worker_api_enabled:
                  raise SystemExit("Worker runtime final shadow services require NUTSNEWS_BACKEND_WORKER_API_ENABLED=true.")
              scoped_uplift_enabled = (
                  os.environ.get("NUTSNEWS_BACKEND_WORKER_UPLIFT_SCOPED_TOKENS_ENABLED", "false").strip().lower()
                  in {"1", "true", "yes"}
              )
              if not scoped_uplift_enabled:
                  raise SystemExit("Worker runtime final shadow services require NUTSNEWS_BACKEND_WORKER_UPLIFT_SCOPED_TOKENS_ENABLED=true.")
              persistence_token = os.environ.get("NUTSNEWS_BACKEND_WORKER_UPLIFT_PERSISTENCE_TOKEN", "")
              publication_token = os.environ.get("NUTSNEWS_BACKEND_WORKER_UPLIFT_PUBLICATION_TOKEN", "")
              reconciliation_token = os.environ.get("NUTSNEWS_WORKER_UPLIFT_RECONCILIATION_TOKEN", "")
              missing_scoped = [
                  name
                  for name, value in (
                      ("NUTSNEWS_BACKEND_WORKER_UPLIFT_PERSISTENCE_TOKEN", persistence_token),
                      ("NUTSNEWS_BACKEND_WORKER_UPLIFT_PUBLICATION_TOKEN", publication_token),
                      ("NUTSNEWS_WORKER_UPLIFT_RECONCILIATION_TOKEN", reconciliation_token),
                  )
                  if not value
              ]
              if missing_scoped:
                  raise SystemExit(f"Worker runtime final shadow services require scoped Worker API secrets: {', '.join(missing_scoped)}")
              if len({backend_api_token, persistence_token, publication_token}) != 3:
                  raise SystemExit("Worker runtime legacy, persistence, and publication API tokens must be distinct")
              if any("\n" in value or "\r" in value for value in (backend_api_token, local_ai_base_url, local_ai_api_key, persistence_token, publication_token, reconciliation_token)):
                  raise SystemExit("Worker runtime secret values must be single-line values")

              def url_quote(value):
                  return urllib.parse.quote(str(value), safe="")

              def postgres_url(stage_name):
                  username = extra_vars[f"backend_worker_uplift_postgres_{stage_name}_user"]
                  password = os.environ[f"NUTSNEWS_WORKER_UPLIFT_POSTGRES_{stage_name.upper()}_PASSWORD"]
                  database = extra_vars["backend_worker_uplift_postgres_database"]
                  return f"postgresql://{url_quote(username)}:{url_quote(password)}@127.0.0.1:5432/{url_quote(database)}?sslmode=disable"

              def rabbitmq_url(username_name, password_name):
                  username = os.environ.get(username_name, "").strip()
                  password = os.environ.get(password_name, "")
                  vhost = os.environ.get("RABBITMQ_VHOST", "nutsnews-worker-uplift").strip() or "nutsnews-worker-uplift"
                  missing = [name for name, value in ((username_name, username), (password_name, password)) if not value]
                  if missing:
                      raise SystemExit(f"Missing worker runtime RabbitMQ secret names: {', '.join(missing)}")
                  if any("\n" in value or "\r" in value for value in (username, password, vhost)):
                      raise SystemExit("Worker runtime RabbitMQ URL values must be single-line values")
                  return f"amqp://{url_quote(username)}:{url_quote(password)}@127.0.0.1:5672/{url_quote(vhost)}"

              extra_vars["backend_worker_runtime_enabled"] = True
              extra_vars["backend_worker_runtime_default_mode"] = "shadow"
              extra_vars["backend_worker_runtime_production_writes_enabled"] = False
              extra_vars["backend_worker_runtime_reconciliation_apply_enabled"] = (
                  os.environ.get("NUTSNEWS_WORKER_UPLIFT_RECONCILIATION_APPLY_ENABLED", "false").strip().lower()
                  in {"1", "true", "yes"}
              )
              backend_domain = os.environ.get("NUTSNEWS_BACKEND_DOMAIN", "backend.nutsnews.com").strip() or "backend.nutsnews.com"
              extra_vars["backend_worker_runtime_backend_api_url"] = f"https://{backend_domain}"
              extra_vars["backend_worker_runtime_rabbitmq_vhost"] = os.environ.get("RABBITMQ_VHOST", "nutsnews-worker-uplift").strip() or "nutsnews-worker-uplift"
              extra_vars["backend_worker_runtime_secret_values"] = {
                  "scheduler-database-url": postgres_url("scheduler"),
                  "scheduler-rabbitmq-url": rabbitmq_url("RABBITMQ_SCHEDULER_PUBLISHER_USERNAME", "RABBITMQ_SCHEDULER_PUBLISHER_PASSWORD"),
                  "scheduler-backend-api-token": backend_api_token,
                  "fetcher-database-url": postgres_url("fetcher"),
                  "fetcher-rabbitmq-url": rabbitmq_url("RABBITMQ_FETCHER_CONSUMER_USERNAME", "RABBITMQ_FETCHER_CONSUMER_PASSWORD"),
                  "canonicalizer-database-url": postgres_url("canonicalizer"),
                  "canonicalizer-rabbitmq-url": rabbitmq_url("RABBITMQ_CANONICALIZER_CONSUMER_USERNAME", "RABBITMQ_CANONICALIZER_CONSUMER_PASSWORD"),
                  "enrichment-database-url": postgres_url("enrichment"),
                  "enrichment-rabbitmq-url": rabbitmq_url("RABBITMQ_ENRICHMENT_CONSUMER_USERNAME", "RABBITMQ_ENRICHMENT_CONSUMER_PASSWORD"),
                  "approval-database-url": postgres_url("approval"),
                  "approval-rabbitmq-url": rabbitmq_url("RABBITMQ_APPROVAL_CONSUMER_USERNAME", "RABBITMQ_APPROVAL_CONSUMER_PASSWORD"),
                  "approval-qwen-base-url": local_ai_base_url,
                  "approval-qwen-api-key": local_ai_api_key,
                  "translation-database-url": postgres_url("translation"),
                  "translation-rabbitmq-url": rabbitmq_url("RABBITMQ_TRANSLATION_CONSUMER_USERNAME", "RABBITMQ_TRANSLATION_CONSUMER_PASSWORD"),
                  "translation-qwen-base-url": local_ai_base_url,
                  "translation-qwen-api-key": local_ai_api_key,
                  "persistence-database-url": postgres_url("persistence"),
                  "persistence-rabbitmq-url": rabbitmq_url("RABBITMQ_PERSISTENCE_CONSUMER_USERNAME", "RABBITMQ_PERSISTENCE_CONSUMER_PASSWORD"),
                  "persistence-backend-api-token": persistence_token,
                  "publication-database-url": postgres_url("publication"),
                  "publication-rabbitmq-url": rabbitmq_url("RABBITMQ_PUBLICATION_CONSUMER_USERNAME", "RABBITMQ_PUBLICATION_CONSUMER_PASSWORD"),
                  "publication-backend-api-token": publication_token,
                  "reconciliation-token": reconciliation_token,
              }

          path = Path(os.environ["RUNNER_TEMP"]) / "backend-extra-vars.json"
          path.write_text(json.dumps(extra_vars), encoding="utf-8")
          path.chmod(0o600)
          PY

      - name: Run backend Ansible baseline
        shell: bash
        working-directory: ansible
        env:
          RUN_MODE: ${{ inputs.run_mode }}
          DEPLOYMENT_SCOPE: ${{ inputs.deployment_scope }}
        run: |
          set -euo pipefail

          args=(
            playbooks/bootstrap.yml
            -i inventories/production/hosts.yml
            --private-key "$HOME/.ssh/nutsnews_backend"
            --extra-vars "@$RUNNER_TEMP/backend-extra-vars.json"
          )

          if [[ "$RUN_MODE" == "check" ]]; then
            args+=(--check --diff)
          fi
          if [[ "$DEPLOYMENT_SCOPE" == "rabbitmq-recovery-helper" ]]; then
            args+=(--tags worker_uplift_rabbitmq_recovery_helper)
          fi

          ansible-playbook "${args[@]}"

      - name: Run deployment safety postcheck
        if: always() && inputs.run_mode == 'apply'
        shell: bash
        env:
          NUTSNEWS_BACKEND_HOST: ${{ vars.NUTSNEWS_BACKEND_HOST || '65.75.201.18' }}
          NUTSNEWS_BACKEND_ANSIBLE_USER: ${{ secrets.NUTSNEWS_BACKEND_ANSIBLE_USER }}
          NUTSNEWS_BACKEND_SSH_PRIVATE_KEY: ${{ secrets.NUTSNEWS_BACKEND_SSH_PRIVATE_KEY }}
          NUTSNEWS_BACKEND_KNOWN_HOSTS: ${{ secrets.NUTSNEWS_BACKEND_KNOWN_HOSTS }}
          RESTIC_REPOSITORY: ${{ secrets.RESTIC_REPOSITORY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GRAFANA_CLOUD_PROMETHEUS_URL: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_URL }}
          GRAFANA_CLOUD_PROMETHEUS_USERNAME: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_USERNAME }}
          GRAFANA_CLOUD_PROMETHEUS_PASSWORD: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_PASSWORD }}
          GRAFANA_CLOUD_LOKI_URL: ${{ secrets.GRAFANA_CLOUD_LOKI_URL }}
          GRAFANA_CLOUD_LOKI_USERNAME: ${{ secrets.GRAFANA_CLOUD_LOKI_USERNAME }}
          GRAFANA_CLOUD_LOKI_PASSWORD: ${{ secrets.GRAFANA_CLOUD_LOKI_PASSWORD }}
          NUTSNEWS_BACKEND_RABBITMQ_ENABLED: ${{ vars.NUTSNEWS_BACKEND_RABBITMQ_ENABLED || 'true' }}
          RABBITMQ_ERLANG_COOKIE: ${{ secrets.RABBITMQ_ERLANG_COOKIE }}
          RABBITMQ_BREAK_GLASS_ADMIN_PASSWORD: ${{ secrets.RABBITMQ_BREAK_GLASS_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          python3 scripts/backend_deployment_safety.py \
            --profile baseline_apply \
            --phase post \
            --enforce true \
            --change-description "protected-backend-ansible-apply:apply" \
            --ssh-host "$NUTSNEWS_BACKEND_HOST" \
            --ssh-user "${NUTSNEWS_BACKEND_ANSIBLE_USER:-rami}" \
            --ssh-key "$HOME/.ssh/nutsnews_backend" \
            --known-hosts "$HOME/.ssh/known_hosts" \
            --required-secret NUTSNEWS_BACKEND_SSH_PRIVATE_KEY \
            --required-secret NUTSNEWS_BACKEND_KNOWN_HOSTS \
            --required-secret RESTIC_REPOSITORY \
            --required-secret RESTIC_PASSWORD \
            --required-secret AWS_ACCESS_KEY_ID \
            --required-secret AWS_SECRET_ACCESS_KEY \
            --required-secret GRAFANA_CLOUD_PROMETHEUS_URL \
            --required-secret GRAFANA_CLOUD_PROMETHEUS_USERNAME \
            --required-secret GRAFANA_CLOUD_PROMETHEUS_PASSWORD \
            --required-secret GRAFANA_CLOUD_LOKI_URL \
            --required-secret GRAFANA_CLOUD_LOKI_USERNAME \
            --required-secret GRAFANA_CLOUD_LOKI_PASSWORD \
            --required-secret RABBITMQ_ERLANG_COOKIE \
            --required-secret RABBITMQ_BREAK_GLASS_ADMIN_PASSWORD \
            --output "$RUNNER_TEMP/backend-deployment-safety-post.json" \
            --summary "$RUNNER_TEMP/backend-deployment-safety-post.md"

      - name: Upload deployment safety reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: backend-deployment-safety-reports
          path: |
            ${{ runner.temp }}/backend-deployment-safety-pre.json
            ${{ runner.temp }}/backend-deployment-safety-pre.md
            ${{ runner.temp }}/backend-deployment-safety-post.json
            ${{ runner.temp }}/backend-deployment-safety-post.md
            ${{ runner.temp }}/backend-rabbitmq-credential-readiness.json
          if-no-files-found: ignore
