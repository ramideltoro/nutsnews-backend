---
- name: Supabase standby forced-command probe
  hosts: backend
  become: true
  gather_facts: true

  tasks:
    - name: Verify the probe is applied only to the production backend group
      ansible.builtin.assert:
        that:
          - inventory_hostname in (groups.get('backend', []))
          - "'supabase_standby_ipv6_runner' not in group_names"
        fail_msg: "The standby probe role must target only the existing backend host, never the obsolete runner inventory."
        success_msg: "Standby probe inventory target is scoped to backend."

    - name: Apply Supabase standby forced-command probe boundary
      ansible.builtin.include_role:
        name: supabase_standby_probe
