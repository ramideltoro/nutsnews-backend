---
backend_ssh_hardening_dropin: /etc/ssh/sshd_config.d/00-nutsnews-hardening.conf
backend_ssh_managed_directives:
  - PermitRootLogin
  - PasswordAuthentication
  - KbdInteractiveAuthentication
  - PubkeyAuthentication
backend_apt_cache_valid_time: 3600
backend_apply_dist_upgrade: false
backend_apt_autoremove: false
backend_reboot_if_required: false
backend_reboot_timeout: 900
backend_firewall_reset_before_apply: true
backend_firewall_ipv6: "yes"
backend_firewall_logging: "off"
backend_firewall_public_tcp_ports:
  - port: "22"
    comment: Backend SSH
backend_firewall_enable_http_https: true
backend_firewall_future_tcp_ports:
  - port: "80"
    comment: Backend HTTP health and ACME
  - port: "443"
    comment: Backend HTTPS health
backend_fail2ban_sshd_enabled: true
backend_fail2ban_sshd_backend: systemd
backend_fail2ban_sshd_bantime: 1h
backend_fail2ban_sshd_findtime: 10m
backend_fail2ban_sshd_maxretry: 5
backend_fail2ban_sshd_ignoreip:
  - 127.0.0.1/8
  - ::1
backend_swap_enabled: true
backend_swap_file: /swapfile
backend_swap_size_mb: 2048
backend_swap_swappiness: 10
backend_monitoring_log_dir: /var/log/nutsnews
backend_monitoring_journal_system_max_use: 512M
backend_monitoring_journal_max_retention_sec: 14day
backend_monitoring_disk_warn_percent: 80
backend_monitoring_disk_crit_percent: 90
backend_monitoring_memory_warn_percent: 80
backend_monitoring_memory_crit_percent: 90
backend_monitoring_load_warn_per_cpu: 1.5
backend_monitoring_load_crit_per_cpu: 2.5
backend_monitoring_health_path: /healthz
backend_monitoring_app_status: infrastructure_health_only
backend_caddy_enabled: true
backend_caddy_config_path: /etc/caddy/Caddyfile
backend_caddy_candidate_path: "{{ backend_caddy_config_path }}.candidate"
backend_caddy_health_response: ok
backend_ops_dashboard_enabled: true
backend_ops_dashboard_user: nutsnews-dashboard
backend_ops_dashboard_group: nutsnews-dashboard
backend_ops_dashboard_public_dir: /var/www/nutsnews-ops-dashboard
backend_ops_dashboard_collector_path: /usr/local/bin/nutsnews-ops-dashboard-collect
backend_ops_dashboard_status_path: /var/www/nutsnews-ops-dashboard/status.json
backend_ops_dashboard_bind: 127.0.0.1
backend_ops_dashboard_port: "8081"
backend_ops_dashboard_collect_interval: "*:0/2:00"
backend_postgres_enabled: false
backend_postgres_major_version: "18"
backend_postgres_service_name: postgresql
backend_postgres_packages:
  - acl
  - postgresql
  - postgresql-client
  - postgresql-contrib
  - python3-psycopg2
backend_postgres_config_path: "/etc/postgresql/{{ backend_postgres_major_version }}/main/postgresql.conf"
backend_postgres_hba_path: "/etc/postgresql/{{ backend_postgres_major_version }}/main/pg_hba.conf"
backend_postgres_state_dir: /var/lib/nutsnews/postgres
backend_postgres_database: nutsnews_failover
backend_postgres_rehearsal_database: nutsnews_restore_rehearsal
backend_postgres_primary_shadow_database: nutsnews_primary_shadow
backend_postgres_app_user: nutsnews_app
backend_postgres_readonly_user: nutsnews_readonly
backend_postgres_restore_user: nutsnews_migration_restore
backend_postgres_validation_user: nutsnews_migration_validation
backend_postgres_replication_user: nutsnews_migration_replication
backend_postgres_app_rehearsal_user: nutsnews_app_rehearsal
backend_postgres_worker_api_user: nutsnews_worker_api
backend_postgres_app_password: ""
backend_postgres_readonly_password: ""
backend_postgres_restore_password: ""
backend_postgres_validation_password: ""
backend_postgres_replication_password: ""
backend_postgres_app_rehearsal_password: ""
backend_postgres_worker_api_password: ""
backend_worker_uplift_postgres_enabled: false
backend_worker_uplift_postgres_database: "{{ backend_postgres_primary_shadow_database }}"
backend_worker_uplift_postgres_final_schema: worker_uplift_final
backend_worker_uplift_postgres_views_schema: worker_uplift_views
backend_worker_uplift_postgres_scheduler_user: nutsnews_worker_uplift_scheduler
backend_worker_uplift_postgres_fetcher_user: nutsnews_worker_uplift_fetcher
backend_worker_uplift_postgres_canonicalizer_user: nutsnews_worker_uplift_canonicalizer
backend_worker_uplift_postgres_enrichment_user: nutsnews_worker_uplift_enrichment
backend_worker_uplift_postgres_approval_user: nutsnews_worker_uplift_approval
backend_worker_uplift_postgres_translation_user: nutsnews_worker_uplift_translation
backend_worker_uplift_postgres_persistence_user: nutsnews_worker_uplift_persistence
backend_worker_uplift_postgres_publication_user: nutsnews_worker_uplift_publication
backend_worker_uplift_projection_user: nutsnews_worker_uplift_projection
backend_worker_uplift_projection_password: ""
backend_worker_uplift_watermark_user: nutsnews_worker_uplift_watermark
backend_worker_uplift_watermark_password: ""
backend_worker_uplift_cutover_user: nutsnews_worker_uplift_cutover
backend_worker_uplift_cutover_password: ""
backend_worker_uplift_postgres_scheduler_password: ""
backend_worker_uplift_postgres_fetcher_password: ""
backend_worker_uplift_postgres_canonicalizer_password: ""
backend_worker_uplift_postgres_enrichment_password: ""
backend_worker_uplift_postgres_approval_password: ""
backend_worker_uplift_postgres_translation_password: ""
backend_worker_uplift_postgres_persistence_password: ""
backend_worker_uplift_postgres_publication_password: ""
backend_worker_uplift_postgres_stage_roles:
  - stage: scheduler
    schema: worker_uplift_scheduler
    user: "{{ backend_worker_uplift_postgres_scheduler_user }}"
    password: "{{ backend_worker_uplift_postgres_scheduler_password }}"
  - stage: fetcher
    schema: worker_uplift_fetcher
    user: "{{ backend_worker_uplift_postgres_fetcher_user }}"
    password: "{{ backend_worker_uplift_postgres_fetcher_password }}"
  - stage: canonicalizer
    schema: worker_uplift_canonicalizer
    user: "{{ backend_worker_uplift_postgres_canonicalizer_user }}"
    password: "{{ backend_worker_uplift_postgres_canonicalizer_password }}"
  - stage: enrichment
    schema: worker_uplift_enrichment
    user: "{{ backend_worker_uplift_postgres_enrichment_user }}"
    password: "{{ backend_worker_uplift_postgres_enrichment_password }}"
  - stage: approval
    schema: worker_uplift_approval
    user: "{{ backend_worker_uplift_postgres_approval_user }}"
    password: "{{ backend_worker_uplift_postgres_approval_password }}"
  - stage: translation
    schema: worker_uplift_translation
    user: "{{ backend_worker_uplift_postgres_translation_user }}"
    password: "{{ backend_worker_uplift_postgres_translation_password }}"
  - stage: persistence
    schema: worker_uplift_persistence
    user: "{{ backend_worker_uplift_postgres_persistence_user }}"
    password: "{{ backend_worker_uplift_postgres_persistence_password }}"
  - stage: publication
    schema: worker_uplift_publication
    user: "{{ backend_worker_uplift_postgres_publication_user }}"
    password: "{{ backend_worker_uplift_postgres_publication_password }}"
backend_postgres_listen_addresses: localhost
backend_postgres_log_min_duration_statement: "500"
backend_postgres_log_autovacuum_min_duration: "10s"
backend_postgres_track_io_timing: "on"
backend_postgres_autovacuum: "on"
backend_postgres_required_extensions:
  - pg_trgm
backend_worker_api_enabled: false
backend_worker_api_user: nutsnews-worker-api
backend_worker_api_group: nutsnews-worker-api
backend_worker_api_root: /opt/nutsnews-worker-db-api
backend_worker_api_script_path: "{{ backend_worker_api_root }}/nutsnews_worker_db_api.py"
backend_worker_api_env_path: /etc/nutsnews-worker-db-api.env
backend_worker_api_bind: 127.0.0.1
backend_worker_api_port: "8093"
backend_worker_api_monitoring_path: /readyz
backend_worker_api_service_version: "1.2.0"
backend_worker_api_build_revision: unknown
backend_worker_api_deployment_environment: production
backend_worker_api_telemetry_host: backend.nutsnews.com
backend_worker_api_token: ""
backend_worker_api_uplift_persistence_token: ""
backend_worker_api_uplift_publication_token: ""
backend_worker_api_uplift_cutover_state: shadow
backend_worker_api_uplift_production_writes_enabled: false
backend_worker_api_uplift_expected_candidate_sha256: ""
backend_worker_api_uplift_expected_watermark_sha256: ""
backend_worker_api_db_host: 127.0.0.1
backend_worker_api_db_port: "5432"
backend_worker_api_db_name: "{{ backend_postgres_primary_shadow_database }}"
backend_worker_api_db_user: "{{ backend_postgres_worker_api_user }}"
backend_worker_api_db_password: "{{ backend_postgres_worker_api_password }}"
backend_worker_api_writes_enabled: false
backend_worker_api_max_limit: 10000
backend_writer_pause_inventory_source_path: "{{ playbook_dir }}/../../docs/backend-supabase-writer-pause-gate.json"
backend_writer_pause_config_dir: /etc/nutsnews-writer-pause
backend_writer_pause_state_dir: /var/lib/nutsnews/writer-pause
backend_writer_pause_inventory_path: "{{ backend_writer_pause_config_dir }}/inventory.json"
backend_writer_pause_manager_path: /usr/local/sbin/nutsnews-writer-pause
backend_writer_pause_worker_api_dropin_dir: /etc/systemd/system/nutsnews-worker-db-api.service.d
backend_supabase_sync_relay_enabled: false
backend_supabase_sync_relay_user: nutsnews-standby-relay
backend_supabase_sync_relay_group: nutsnews-standby-relay
backend_supabase_sync_relay_config_dir: /etc/nutsnews-supabase-sync-relay
backend_supabase_sync_relay_env_path: /etc/nutsnews-supabase-sync-relay/relay.env
backend_supabase_sync_relay_contract_path: /etc/nutsnews-supabase-sync-relay/contract.json
backend_supabase_sync_relay_state_dir: /var/lib/nutsnews/supabase-sync-relay
backend_supabase_sync_relay_runner_path: /usr/local/libexec/nutsnews-backend-supabase-sync-relay.py
backend_supabase_sync_relay_reconcile_library_path: /usr/local/libexec/backend_supabase_standby_reconcile.py
backend_supabase_sync_relay_source_path: "{{ playbook_dir }}/../../scripts/backend_supabase_sync_relay.py"
backend_supabase_sync_relay_reconcile_library_source_path: "{{ playbook_dir }}/../../scripts/backend_supabase_standby_reconcile.py"
backend_supabase_sync_relay_contract_source_path: "{{ playbook_dir }}/../../docs/backend-supabase-sync-relay.json"
backend_supabase_sync_relay_source_db_url: ""
backend_supabase_sync_relay_target_db_url: ""
backend_supabase_sync_relay_interval_seconds: 30
backend_supabase_sync_relay_batch_size: 500
backend_db_dashboard_enabled: false
backend_db_dashboard_bind: 127.0.0.1
backend_db_dashboard_port: "8082"
backend_db_dashboard_php_version: "8.5"
backend_db_dashboard_php_fpm_service: "php{{ backend_db_dashboard_php_version }}-fpm"
backend_db_dashboard_php_fpm_pool_dir: "/etc/php/{{ backend_db_dashboard_php_version }}/fpm/pool.d"
backend_db_dashboard_php_fpm_listen: 127.0.0.1:9085
backend_db_dashboard_root: /usr/share/adminer
backend_db_dashboard_packages:
  - adminer
  - php-fpm
  - php-pgsql
backend_backup_enabled: false
backend_backup_config_dir: /etc/nutsnews-backup
backend_backup_state_dir: /var/lib/nutsnews/backups
backend_backup_runner_path: /usr/local/sbin/nutsnews-backup
backend_backup_matrix_path: /etc/nutsnews-backup/service-matrix.json
backend_backup_env_path: /etc/nutsnews-backup/restic.env
backend_backup_restic_repository: ""
backend_backup_restic_password: ""
backend_backup_restic_provider: s3
backend_backup_environment: {}
backend_backup_stale_after_hours: 30
backend_backup_check_read_data_subset: "1%"
backend_backup_quota_warn_bytes: 0
backend_backup_restic_init_if_missing: true
backend_backup_calendar: "*-*-* 03:17:00"
backend_backup_verify_calendar: "*-*-* 04:17:00"
backend_backup_restore_drill_calendar: "Sun *-*-* 05:17:00"
backend_metrics_enabled: false
backend_metrics_production_desired_state: false
backend_metrics_alloy_disable_confirmation: ""
backend_metrics_alloy_config_path: /etc/alloy/config.alloy
backend_metrics_alloy_candidate_path: "{{ backend_metrics_alloy_config_path }}.candidate"
backend_metrics_alloy_env_path: /etc/alloy/nutsnews-prometheus.env
backend_metrics_prometheus_remote_write_url: ""
backend_metrics_prometheus_username: ""
backend_metrics_prometheus_password: ""
backend_metrics_environment_label: production
backend_metrics_instance_label: backend.nutsnews.com
backend_metrics_scrape_interval: 60s
backend_metrics_textfile_dir: /var/lib/nutsnews/metrics
backend_metrics_textfile_exporter_path: /usr/local/bin/nutsnews-metrics-textfile
backend_metrics_textfile_calendar: "*:0/5:00"
backend_metrics_public_feed_status_url: https://nutsnews-worker-0.nutsnews.workers.dev/public-feed-snapshot/status
backend_metrics_health_audit_state_dir: /var/lib/nutsnews/health-audit
backend_metrics_health_audit_state_path: "{{ backend_metrics_health_audit_state_dir }}/last-run.json"
backend_metrics_health_audit_state_writer_path: /usr/local/sbin/nutsnews-health-audit-state
backend_metrics_remote_write_capacity: 2500
backend_metrics_remote_write_max_samples_per_send: 500
backend_metrics_remote_write_max_shards: 2
