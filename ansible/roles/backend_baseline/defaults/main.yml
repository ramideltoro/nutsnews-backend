backend_metrics_backend_api_enabled: "{{ backend_worker_api_enabled }}"
backend_metrics_backend_api_scrape_interval: 60s
backend_metrics_backend_api_scrape_timeout: 10s
backend_metrics_backend_api_sample_limit: 4096
backend_metrics_backend_api_label_limit: 12
backend_metrics_worker_uplift_enabled: true
backend_metrics_worker_uplift_scrape_interval: 60s
backend_metrics_worker_uplift_scrape_timeout: 10s
backend_metrics_worker_uplift_sample_limit: 500
backend_metrics_worker_uplift_label_limit: 20
backend_metrics_worker_uplift_relabel_cache_size: 128
backend_metrics_worker_uplift_relabel_cache_ttl: 10m
backend_metrics_worker_uplift_contract_status: awaiting-qualified-v1
backend_metrics_worker_uplift_contract_enabled: false
backend_metrics_worker_uplift_targets:
