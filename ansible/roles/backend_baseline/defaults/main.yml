---
backend_ssh_hardening_dropin: /etc/ssh/sshd_config.d/00-nutsnews-hardening.conf
backend_ssh_managed_directives:
  - PermitRootLogin
  - PasswordAuthentication
  - KbdInteractiveAuthentication
  - PubkeyAuthentication
backend_apt_cache_valid_time: 3600
backend_apply_dist_upgrade: false
backend_apt_autoremove: false
backend_reboot_if_required: false
backend_reboot_timeout: 900
backend_firewall_reset_before_apply: true
backend_firewall_ipv6: "yes"
backend_firewall_logging: "off"
backend_firewall_public_tcp_ports:
  - port: "22"
    comment: Backend SSH
backend_firewall_enable_http_https: true
backend_firewall_future_tcp_ports:
  - port: "80"
    comment: Backend HTTP health and ACME
  - port: "443"
    comment: Backend HTTPS health
backend_fail2ban_sshd_enabled: true
backend_fail2ban_sshd_backend: systemd
backend_fail2ban_sshd_bantime: 1h
backend_fail2ban_sshd_findtime: 10m
backend_fail2ban_sshd_maxretry: 5
backend_fail2ban_sshd_ignoreip:
  - 127.0.0.1/8
  - ::1
backend_swap_enabled: true
backend_swap_file: /swapfile
backend_swap_size_mb: 2048
backend_swap_swappiness: 10
backend_monitoring_log_dir: /var/log/nutsnews
backend_monitoring_journal_system_max_use: 512M
backend_monitoring_journal_max_retention_sec: 14day
backend_monitoring_disk_warn_percent: 80
backend_monitoring_disk_crit_percent: 90
backend_monitoring_memory_warn_percent: 80
backend_monitoring_memory_crit_percent: 90
backend_monitoring_load_warn_per_cpu: 1.5
backend_monitoring_load_crit_per_cpu: 2.5
backend_monitoring_health_path: /healthz
backend_monitoring_app_status: infrastructure_health_only
backend_caddy_enabled: true
backend_caddy_config_path: /etc/caddy/Caddyfile
backend_caddy_health_response: ok
backend_ops_dashboard_enabled: true
backend_ops_dashboard_user: nutsnews-dashboard
backend_ops_dashboard_group: nutsnews-dashboard
backend_ops_dashboard_public_dir: /var/www/nutsnews-ops-dashboard
backend_ops_dashboard_collector_path: /usr/local/bin/nutsnews-ops-dashboard-collect
backend_ops_dashboard_status_path: /var/www/nutsnews-ops-dashboard/status.json
backend_ops_dashboard_bind: 127.0.0.1
backend_ops_dashboard_port: "8081"
backend_ops_dashboard_collect_interval: "*:0/2:00"
backend_postgres_enabled: false
backend_postgres_major_version: "18"
backend_postgres_service_name: postgresql
backend_postgres_packages:
  - acl
  - postgresql
  - postgresql-client
  - postgresql-contrib
  - python3-psycopg2
backend_postgres_config_path: "/etc/postgresql/{{ backend_postgres_major_version }}/main/postgresql.conf"
backend_postgres_hba_path: "/etc/postgresql/{{ backend_postgres_major_version }}/main/pg_hba.conf"
backend_postgres_state_dir: /var/lib/nutsnews/postgres
backend_postgres_database: nutsnews_failover
backend_postgres_rehearsal_database: nutsnews_restore_rehearsal
backend_postgres_app_user: nutsnews_app
backend_postgres_readonly_user: nutsnews_readonly
backend_postgres_restore_user: nutsnews_migration_restore
backend_postgres_validation_user: nutsnews_migration_validation
backend_postgres_replication_user: nutsnews_migration_replication
backend_postgres_app_rehearsal_user: nutsnews_app_rehearsal
backend_postgres_app_password: ""
backend_postgres_readonly_password: ""
backend_postgres_restore_password: ""
backend_postgres_validation_password: ""
backend_postgres_replication_password: ""
backend_postgres_app_rehearsal_password: ""
backend_postgres_listen_addresses: localhost
backend_postgres_required_extensions:
  - pg_trgm
backend_db_dashboard_enabled: false
backend_db_dashboard_bind: 127.0.0.1
backend_db_dashboard_port: "8082"
backend_db_dashboard_php_version: "8.5"
backend_db_dashboard_php_fpm_service: "php{{ backend_db_dashboard_php_version }}-fpm"
backend_db_dashboard_php_fpm_pool_dir: "/etc/php/{{ backend_db_dashboard_php_version }}/fpm/pool.d"
backend_db_dashboard_php_fpm_listen: 127.0.0.1:9085
backend_db_dashboard_root: /usr/share/adminer
backend_db_dashboard_packages:
  - adminer
  - php-fpm
  - php-pgsql
backend_backup_enabled: false
backend_backup_config_dir: /etc/nutsnews-backup
backend_backup_state_dir: /var/lib/nutsnews/backups
backend_backup_runner_path: /usr/local/sbin/nutsnews-backup
backend_backup_matrix_path: /etc/nutsnews-backup/service-matrix.json
backend_backup_env_path: /etc/nutsnews-backup/restic.env
backend_backup_restic_repository: ""
backend_backup_restic_password: ""
backend_backup_restic_provider: s3
backend_backup_environment: {}
backend_backup_stale_after_hours: 30
backend_backup_check_read_data_subset: "1%"
backend_backup_quota_warn_bytes: 0
backend_backup_restic_init_if_missing: true
backend_backup_calendar: "*-*-* 03:17:00"
backend_backup_verify_calendar: "*-*-* 04:17:00"
backend_backup_restore_drill_calendar: "Sun *-*-* 05:17:00"
backend_metrics_enabled: false
backend_metrics_alloy_config_path: /etc/alloy/config.alloy
backend_metrics_alloy_env_path: /etc/alloy/nutsnews-prometheus.env
backend_metrics_prometheus_remote_write_url: ""
backend_metrics_prometheus_username: ""
backend_metrics_prometheus_password: ""
backend_metrics_environment_label: production
backend_metrics_instance_label: backend.nutsnews.com
backend_metrics_scrape_interval: 60s
backend_metrics_textfile_dir: /var/lib/nutsnews/metrics
backend_metrics_textfile_exporter_path: /usr/local/bin/nutsnews-metrics-textfile
backend_metrics_textfile_calendar: "*:0/1:00"
backend_metrics_remote_write_capacity: 2500
backend_metrics_remote_write_max_samples_per_send: 500
backend_metrics_remote_write_max_shards: 2
backend_logs_enabled: false
backend_logs_loki_url: ""
backend_logs_loki_username: ""
backend_logs_loki_password: ""
backend_logs_journal_max_age: 24h
backend_logs_file_ignore_older_than: 48h
backend_logs_line_drop_max_size: 16KiB
backend_logs_line_truncate_limit: 4KiB
backend_logs_loki_max_streams: 64
backend_logs_loki_batch_size: 256KiB
backend_logs_loki_batch_wait: 5s
backend_logs_journal_units:
  - service: caddy
    unit: caddy.service
  - service: alloy
    unit: alloy.service
  - service: backup
    unit: nutsnews-backup.service
  - service: backup
    unit: nutsnews-backup-verify.service
  - service: backup
    unit: nutsnews-restore-drill.service
  - service: timer
    unit: nutsnews-metrics-textfile.service
  - service: timer
    unit: nutsnews-ops-dashboard-collect.service
  - service: security
    unit: fail2ban.service
  - service: security
    unit: ufw.service
  - service: security
    unit: ssh.service
  - service: updates
    unit: unattended-upgrades.service
  - service: updates
    unit: apt-daily.service
  - service: updates
    unit: apt-daily-upgrade.service
backend_logs_file_targets:
  - service: security
    unit: auth.log
    path: /var/log/auth.log
  - service: security
    unit: fail2ban.log
    path: /var/log/fail2ban.log
  - service: caddy
    unit: caddy-access.log
    path: /var/log/caddy/access.log
  - service: caddy
    unit: caddy-error.log
    path: /var/log/caddy/error.log
  - service: backend
    unit: nutsnews-app
    path: /var/log/nutsnews/*.log
