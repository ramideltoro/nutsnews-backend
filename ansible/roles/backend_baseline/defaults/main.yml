---
backend_ssh_hardening_dropin: /etc/ssh/sshd_config.d/00-nutsnews-hardening.conf
backend_ssh_managed_directives:
  - PermitRootLogin
  - PasswordAuthentication
  - KbdInteractiveAuthentication
  - PubkeyAuthentication
backend_apt_cache_valid_time: 3600
backend_apply_dist_upgrade: false
backend_apt_autoremove: false
backend_reboot_if_required: false
backend_reboot_timeout: 900
backend_firewall_reset_before_apply: true
backend_firewall_ipv6: "yes"
backend_firewall_logging: "off"
backend_firewall_public_tcp_ports:
  - port: "22"
    comment: Backend SSH
backend_firewall_enable_http_https: true
backend_firewall_future_tcp_ports:
  - port: "80"
    comment: Backend HTTP health and ACME
  - port: "443"
    comment: Backend HTTPS health
backend_fail2ban_sshd_enabled: true
backend_fail2ban_sshd_backend: systemd
backend_fail2ban_sshd_bantime: 1h
backend_fail2ban_sshd_findtime: 10m
backend_fail2ban_sshd_maxretry: 5
backend_fail2ban_sshd_ignoreip:
  - 127.0.0.1/8
  - ::1
backend_swap_enabled: true
backend_swap_file: /swapfile
backend_swap_size_mb: 2048
backend_swap_swappiness: 10
backend_monitoring_log_dir: /var/log/nutsnews
backend_monitoring_journal_system_max_use: 512M
backend_monitoring_journal_max_retention_sec: 14day
backend_monitoring_disk_warn_percent: 80
backend_monitoring_disk_crit_percent: 90
backend_monitoring_memory_warn_percent: 80
backend_monitoring_memory_crit_percent: 90
backend_monitoring_load_warn_per_cpu: 1.5
backend_monitoring_load_crit_per_cpu: 2.5
backend_monitoring_health_path: /healthz
backend_monitoring_app_status: infrastructure_health_only
backend_caddy_enabled: true
backend_caddy_config_path: /etc/caddy/Caddyfile
backend_caddy_health_response: ok
backend_ops_dashboard_enabled: true
backend_ops_dashboard_user: nutsnews-dashboard
backend_ops_dashboard_group: nutsnews-dashboard
backend_ops_dashboard_public_dir: /var/www/nutsnews-ops-dashboard
backend_ops_dashboard_collector_path: /usr/local/bin/nutsnews-ops-dashboard-collect
backend_ops_dashboard_status_path: /var/www/nutsnews-ops-dashboard/status.json
backend_ops_dashboard_bind: 127.0.0.1
backend_ops_dashboard_port: "8081"
backend_ops_dashboard_collect_interval: "*:0/2:00"
backend_backup_enabled: false
backend_backup_config_dir: /etc/nutsnews-backup
backend_backup_state_dir: /var/lib/nutsnews/backups
backend_backup_runner_path: /usr/local/sbin/nutsnews-backup
backend_backup_matrix_path: /etc/nutsnews-backup/service-matrix.json
backend_backup_env_path: /etc/nutsnews-backup/restic.env
backend_backup_restic_repository: ""
backend_backup_restic_password: ""
backend_backup_restic_provider: s3
backend_backup_environment: {}
backend_backup_stale_after_hours: 30
backend_backup_check_read_data_subset: "1%"
backend_backup_quota_warn_bytes: 0
backend_backup_restic_init_if_missing: true
backend_backup_calendar: "*-*-* 03:17:00"
backend_backup_verify_calendar: "*-*-* 04:17:00"
backend_backup_restore_drill_calendar: "Sun *-*-* 05:17:00"
