    address: 127.0.0.1:18081
  - service: fetcher
    stage: fetch
    address: 127.0.0.1:18082
  - service: canonicalizer
    stage: canonicalization
    address: 127.0.0.1:18083
  - service: enrichment
    stage: enrichment
    address: 127.0.0.1:18084
  - service: approval
    stage: approval
    address: 127.0.0.1:18085
  - service: translation
    stage: translation
    address: 127.0.0.1:18086
  - service: persistence
    stage: persistence
    address: 127.0.0.1:18087
  - service: publication
    stage: publication
    address: 127.0.0.1:18088
backend_metrics_caddy_enabled: "{{ backend_caddy_enabled }}"
backend_metrics_caddy_target: 127.0.0.1:2019
backend_metrics_caddy_scrape_interval: 60s
backend_metrics_caddy_scrape_timeout: 10s
backend_metrics_caddy_sample_limit: 500
backend_metrics_caddy_label_limit: 15
