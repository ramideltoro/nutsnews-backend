---
- name: Reload ssh
  ansible.builtin.service:
    name: ssh
    state: reloaded
  when: not ansible_check_mode

- name: Reload ufw
  ansible.builtin.command: ufw reload
  changed_when: true
  when: not ansible_check_mode

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
  when: not ansible_check_mode

- name: Apply backend sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
  when: not ansible_check_mode

- name: Restart systemd-journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted
  when: not ansible_check_mode

- name: Restart sysstat
  ansible.builtin.service:
    name: sysstat
    state: restarted
  when: not ansible_check_mode

- name: Restart newrelic-infra
  ansible.builtin.service:
    name: newrelic-infra
    state: restarted
  when: not ansible_check_mode

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  when: not ansible_check_mode

- name: Restart alloy
  ansible.builtin.service:
    name: alloy
    state: restarted
  when: not ansible_check_mode

- name: Reload caddy
  ansible.builtin.service:
    name: caddy
    state: reloaded
  when: not ansible_check_mode

- name: Restart postgresql
  ansible.builtin.service:
    name: "{{ backend_postgres_service_name }}"
    state: restarted
  when: not ansible_check_mode

- name: Restart database dashboard php-fpm
  ansible.builtin.service:
    name: "{{ backend_db_dashboard_php_fpm_service }}"
    state: restarted
  when: not ansible_check_mode

- name: Restart worker database API
  ansible.builtin.service:
    name: nutsnews-worker-db-api
    state: restarted
  when: not ansible_check_mode
