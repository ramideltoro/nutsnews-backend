---
- name: Reload ssh
  ansible.builtin.service:
    name: ssh
    state: reloaded

- name: Reload ufw
  ansible.builtin.command: ufw reload
  changed_when: true

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Apply backend sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
