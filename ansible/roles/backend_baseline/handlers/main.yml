---
- name: Reload ssh
  ansible.builtin.service:
    name: ssh
    state: reloaded
  when: not ansible_check_mode

- name: Reload ufw
  ansible.builtin.command: ufw reload
  changed_when: true
  when: not ansible_check_mode

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
  when: not ansible_check_mode

- name: Apply backend sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
  when: not ansible_check_mode

- name: Restart systemd-journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted
  when: not ansible_check_mode

- name: Restart sysstat
  ansible.builtin.service:
    name: sysstat
    state: restarted
  when: not ansible_check_mode

- name: Reload caddy
  ansible.builtin.service:
    name: caddy
    state: reloaded
  when: not ansible_check_mode
