---
- name: Require explicit confirmation before disabling production Alloy
  ansible.builtin.assert:
    that:
      - backend_metrics_alloy_disable_confirmation == 'DISABLE_PRODUCTION_ALLOY'
    fail_msg: >-
      Production Alloy is an enabled desired state. Set
      backend_metrics_alloy_disable_confirmation=DISABLE_PRODUCTION_ALLOY together with
      backend_metrics_enabled=false only for an intentional, approved shutdown.
  when:
    - backend_metrics_production_desired_state | bool
    - not (backend_metrics_enabled | bool)

- name: Disable production Alloy after explicit confirmation
  ansible.builtin.systemd:
    name: alloy
    enabled: false
    state: stopped
  when:
    - backend_metrics_production_desired_state | bool
    - not (backend_metrics_enabled | bool)
    - backend_metrics_alloy_disable_confirmation == 'DISABLE_PRODUCTION_ALLOY'
    - not ansible_check_mode

- name: Configure SSH hardening
  ansible.builtin.import_tasks: ssh.yml

- name: Apply OS package maintenance
  ansible.builtin.import_tasks: maintenance.yml

- name: Configure UFW firewall baseline
  ansible.builtin.import_tasks: firewall.yml

- name: Configure SSH brute-force protection
  ansible.builtin.import_tasks: fail2ban.yml

- name: Configure swap safety buffer
  ansible.builtin.import_tasks: swap.yml

- name: Configure monitoring and log retention baseline
  ansible.builtin.import_tasks: monitoring.yml

- name: Configure private PostgreSQL failover target
  ansible.builtin.import_tasks: postgres.yml
  when: backend_postgres_enabled | bool

- name: Configure PostgreSQL replication health telemetry
  ansible.builtin.import_tasks: postgres_replication_health.yml

- name: Configure Worker database compatibility API
  ansible.builtin.import_tasks: worker_api.yml
  when: backend_worker_api_enabled | bool

- name: Install backend writer pause boundary
  ansible.builtin.import_tasks: writer_pause.yml
  when: backend_postgres_enabled | bool

- name: Suspend backend to Supabase standby sync relay
  ansible.builtin.import_tasks: standby_sync_relay_disabled.yml

- name: Guard against re-enabling snapshot-based Supabase relay
  ansible.builtin.assert:
    that:
      - not (backend_supabase_sync_relay_enabled | bool)
    fail_msg: >-
      Snapshot-based Supabase relay cannot be enabled. Replace it with reviewed
      incremental replication and update the enforced relay contract first.

- name: Configure service-aware backup baseline
  ansible.builtin.import_tasks: backup.yml
  when: backend_backup_enabled | bool

- name: Configure Grafana Cloud backend metrics
  ansible.builtin.import_tasks: metrics.yml
  when: backend_metrics_enabled | bool

- name: Configure New Relic background job metrics
  ansible.builtin.import_tasks: newrelic_metrics.yml
  when: backend_newrelic_metrics_enabled | bool

- name: Configure read-only ops dashboard
  ansible.builtin.import_tasks: ops_dashboard.yml
  when: backend_ops_dashboard_enabled | bool

- name: Configure backend reverse proxy health endpoint
  ansible.builtin.import_tasks: caddy.yml
  when: backend_caddy_enabled | bool
