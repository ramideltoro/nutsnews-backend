---
- name: Validate Grafana Cloud Prometheus settings
  ansible.builtin.assert:
    that:
      - backend_metrics_prometheus_remote_write_url is match('^https://')
      - backend_metrics_prometheus_username | length > 0
      - backend_metrics_prometheus_password | length > 0
    fail_msg: Grafana Cloud Prometheus URL, username, and password are required when backend_metrics_enabled is true.
  no_log: true

- name: Validate Grafana Cloud Loki settings
  ansible.builtin.assert:
    that:
      - backend_logs_loki_url is match('^https://')
      - backend_logs_loki_username | length > 0
      - backend_logs_loki_password | length > 0
    fail_msg: Grafana Cloud Loki URL, username, and password are required when backend_logs_enabled is true.
  no_log: true
  when: backend_logs_enabled | bool

- name: Ensure Grafana Alloy apt prerequisites are installed
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gpg
    state: present
    update_cache: true
    cache_valid_time: "{{ backend_apt_cache_valid_time }}"

- name: Ensure apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Grafana apt repository key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    owner: root
    group: root
    mode: "0644"
  register: backend_metrics_repo_key

- name: Configure Grafana apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
    filename: grafana
    state: present
    update_cache: true
  register: backend_metrics_apt_repo

- name: Track whether Alloy package can be managed in this run
  ansible.builtin.set_fact:
    backend_metrics_alloy_manageable: "{{ (not ansible_check_mode) or not ((backend_metrics_repo_key is changed) or (backend_metrics_apt_repo is changed)) }}"

- name: Install Grafana Alloy
  ansible.builtin.apt:
    name: alloy
    state: present
    update_cache: true
    cache_valid_time: "{{ backend_apt_cache_valid_time }}"
  when: backend_metrics_alloy_manageable | bool

- name: Validate bounded worker-uplift scrape targets
  ansible.builtin.assert:
    that:
      - backend_metrics_worker_uplift_targets | length == 8
      - backend_metrics_worker_uplift_targets | map(attribute='address') | list | unique | length == 8
      - backend_metrics_worker_uplift_targets | selectattr('deployment_mode', 'defined') | list | length == 0
      - backend_metrics_worker_uplift_targets | selectattr('expected_active', 'defined') | list | length == 0
      - backend_metrics_worker_uplift_contract_status == 'awaiting-qualified-v1'
      - not (backend_metrics_worker_uplift_contract_enabled | bool)
      - >-
        backend_metrics_worker_uplift_targets
        | map(attribute='address')
        | list
        | difference([
            '127.0.0.1:18081',
            '127.0.0.1:18082',
            '127.0.0.1:18083',
            '127.0.0.1:18084',
            '127.0.0.1:18085',
            '127.0.0.1:18086',
            '127.0.0.1:18087',
            '127.0.0.1:18088'
          ])
        | length == 0
    fail_msg: Worker-uplift metrics must contain each loopback endpoint from 18081 through 18088 exactly once.
  when: backend_metrics_worker_uplift_enabled | bool

- name: Validate private PostgreSQL exporter settings
  ansible.builtin.assert:
    that:
      - backend_postgres_enabled | bool
      - backend_metrics_postgres_username | length > 0
      - backend_metrics_postgres_password | length > 0
      - backend_metrics_postgres_database is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - backend_metrics_postgres_relation_budget | int >= 42
      - backend_metrics_postgres_samples_per_relation_budget | int >= 32
      - backend_metrics_postgres_fixed_sample_budget | int >= 512
      - >-
        backend_metrics_postgres_sample_limit | int >=
        ((backend_metrics_postgres_relation_budget | int)
        * (backend_metrics_postgres_samples_per_relation_budget | int)
        + (backend_metrics_postgres_fixed_sample_budget | int))
      - backend_metrics_postgres_sample_limit | int <= 4096
    fail_msg: PostgreSQL metrics require the private PostgreSQL target and protected read-only credentials.
  no_log: true
  when: backend_metrics_postgres_enabled | bool

- name: Allow Alloy to read journal and adm-owned log files
  ansible.builtin.user:
    name: alloy
    groups:
      - adm
      - systemd-journal
    append: true
  when:
    - backend_logs_enabled | bool
    - not ansible_check_mode
  notify: Restart alloy

- name: Ensure Alloy config directory exists
  ansible.builtin.file:
    path: /etc/alloy
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Validate Alloy candidate installation path
  ansible.builtin.assert:
    that:
      - backend_metrics_alloy_candidate_path != backend_metrics_alloy_config_path
      - (backend_metrics_alloy_candidate_path | dirname) == (backend_metrics_alloy_config_path | dirname)
    fail_msg: Alloy candidate and live paths must be distinct files in the same directory for atomic installation.

- name: Ensure NutsNews metrics textfile directory exists
  ansible.builtin.file:
    path: "{{ backend_metrics_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Validate fixed bounded health-audit state paths
  ansible.builtin.assert:
    that:
      - backend_metrics_health_audit_state_dir == '/var/lib/nutsnews/health-audit'
      - backend_metrics_health_audit_state_path == '/var/lib/nutsnews/health-audit/last-run.json'
      - backend_metrics_health_audit_state_writer_path == '/usr/local/sbin/nutsnews-health-audit-state'
    fail_msg: Health-audit state and its root-owned writer must use the fixed publication paths.

- name: Ensure bounded health-audit state directory exists
  ansible.builtin.file:
    path: "{{ backend_metrics_health_audit_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install bounded health-audit state writer
  ansible.builtin.copy:
    src: nutsnews_health_audit_state.py
    dest: "{{ backend_metrics_health_audit_state_writer_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Authorize only the fixed health-audit state write command
  ansible.builtin.copy:
    dest: /etc/sudoers.d/nutsnews-health-audit-state
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
    content: |
      # Managed by ramideltoro/nutsnews-backend.
      rami ALL=(root) NOPASSWD: /usr/local/sbin/nutsnews-health-audit-state write

- name: Validate durable content metrics database
  ansible.builtin.assert:
    that:
      - backend_postgres_enabled | bool
      - backend_postgres_primary_shadow_database is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - backend_metrics_public_feed_status_url is match('^https://')
    fail_msg: Durable backend content metrics require a safe local primary-shadow PostgreSQL database name.

- name: Install NutsNews textfile metrics exporter
  ansible.builtin.copy:
    src: nutsnews_metrics_textfile.py
    dest: "{{ backend_metrics_textfile_exporter_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Install NutsNews textfile metrics service
  ansible.builtin.copy:
    dest: /etc/systemd/system/nutsnews-metrics-textfile.service
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ramideltoro/nutsnews-backend.
      [Unit]
      Description=NutsNews backend Prometheus textfile metrics

      [Service]
      Type=oneshot
      Environment=NUTSNEWS_METRICS_POSTGRES_DATABASE={{ backend_postgres_primary_shadow_database }}
      Environment=NUTSNEWS_PUBLIC_FEED_STATUS_URL={{ backend_metrics_public_feed_status_url }}
      Environment=NUTSNEWS_HEALTH_AUDIT_STATE_PATH={{ backend_metrics_health_audit_state_path }}
      Environment=NUTSNEWS_BACKUP_STALE_AFTER_HOURS={{ backend_backup_stale_after_hours }}
      Environment=NUTSNEWS_WORKER_UPLIFT_OBSERVABILITY_CONTRACT_STATUS={{ backend_metrics_worker_uplift_contract_status }}
      Environment=NUTSNEWS_WORKER_UPLIFT_OBSERVABILITY_CONTRACT_ENABLED={{ backend_metrics_worker_uplift_contract_enabled | ternary('true', 'false') }}
      Environment=NUTSNEWS_DEPLOYMENT_ENVIRONMENT={{ backend_metrics_environment_label }}
      Environment=NUTSNEWS_TELEMETRY_HOST={{ backend_metrics_instance_label }}
      ExecStart={{ backend_metrics_textfile_exporter_path }} --output {{ backend_metrics_textfile_dir }}/nutsnews.prom
      TimeoutStartSec=120
  notify: Reload systemd

- name: Install NutsNews textfile metrics timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/nutsnews-metrics-textfile.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ramideltoro/nutsnews-backend.
      [Unit]
      Description=Refresh NutsNews backend Prometheus textfile metrics

      [Timer]
      OnCalendar={{ backend_metrics_textfile_calendar }}
      Persistent=true
      Unit=nutsnews-metrics-textfile.service

      [Install]
      WantedBy=timers.target
  notify: Reload systemd

- name: Install Alloy remote write environment
  ansible.builtin.copy:
    dest: "{{ backend_metrics_alloy_env_path }}"
    owner: root
    group: root
    mode: "0600"
    content: |
      GRAFANA_CLOUD_PROMETHEUS_URL={{ backend_metrics_prometheus_remote_write_url | quote }}
      GRAFANA_CLOUD_PROMETHEUS_USERNAME={{ backend_metrics_prometheus_username | quote }}
      GRAFANA_CLOUD_PROMETHEUS_PASSWORD={{ backend_metrics_prometheus_password | quote }}
      {% if backend_metrics_postgres_enabled | bool %}
      NUTSNEWS_POSTGRES_EXPORTER_USERNAME={{ backend_metrics_postgres_username | quote }}
      NUTSNEWS_POSTGRES_EXPORTER_PASSWORD={{ backend_metrics_postgres_password | quote }}
      NUTSNEWS_POSTGRES_EXPORTER_DATABASE={{ backend_metrics_postgres_database | quote }}
      {% endif %}
      {% if backend_logs_enabled | bool %}
      GRAFANA_CLOUD_LOKI_URL={{ backend_logs_loki_url | quote }}
      GRAFANA_CLOUD_LOKI_USERNAME={{ backend_logs_loki_username | quote }}
      GRAFANA_CLOUD_LOKI_PASSWORD={{ backend_logs_loki_password | quote }}
      {% endif %}
  no_log: true
  notify: Restart alloy

- name: Install Alloy systemd environment drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/alloy.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Alloy systemd environment drop-in
  ansible.builtin.copy:
    dest: /etc/systemd/system/alloy.service.d/10-nutsnews-prometheus.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ramideltoro/nutsnews-backend.
      [Service]
      EnvironmentFile={{ backend_metrics_alloy_env_path }}
  notify:
    - Reload systemd
    - Restart alloy

- name: Render Alloy metrics configuration candidate
  ansible.builtin.template:
    src: alloy-config.alloy.j2
    dest: "{{ backend_metrics_alloy_candidate_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Validate Alloy metrics configuration candidate
  ansible.builtin.command:
    argv:
      - alloy
      - validate
      - "{{ backend_metrics_alloy_candidate_path }}"
  environment:
    GRAFANA_CLOUD_PROMETHEUS_URL: "{{ backend_metrics_prometheus_remote_write_url }}"
    GRAFANA_CLOUD_PROMETHEUS_USERNAME: "{{ backend_metrics_prometheus_username }}"
    GRAFANA_CLOUD_PROMETHEUS_PASSWORD: "{{ backend_metrics_prometheus_password }}"
    NUTSNEWS_POSTGRES_EXPORTER_USERNAME: "{{ backend_metrics_postgres_username }}"
    NUTSNEWS_POSTGRES_EXPORTER_PASSWORD: "{{ backend_metrics_postgres_password }}"
    NUTSNEWS_POSTGRES_EXPORTER_DATABASE: "{{ backend_metrics_postgres_database }}"
    GRAFANA_CLOUD_LOKI_URL: "{{ backend_logs_loki_url }}"
    GRAFANA_CLOUD_LOKI_USERNAME: "{{ backend_logs_loki_username }}"
    GRAFANA_CLOUD_LOKI_PASSWORD: "{{ backend_logs_loki_password }}"
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Atomically install validated Alloy metrics configuration
  ansible.builtin.copy:
    src: "{{ backend_metrics_alloy_candidate_path }}"
    dest: "{{ backend_metrics_alloy_config_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  notify: Restart alloy
  when: not ansible_check_mode

- name: Flush handlers before running metrics services
  ansible.builtin.meta: flush_handlers

- name: Generate NutsNews textfile metrics once
  ansible.builtin.command: "{{ backend_metrics_textfile_exporter_path }} --output {{ backend_metrics_textfile_dir }}/nutsnews.prom"
  changed_when: false
  when: not ansible_check_mode

- name: Ensure NutsNews textfile metrics timer is enabled and started
  ansible.builtin.systemd:
    name: nutsnews-metrics-textfile.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

- name: Ensure Alloy is enabled and started
  ansible.builtin.systemd:
    name: alloy
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

- name: Wait for Alloy readiness
  ansible.builtin.uri:
    url: http://127.0.0.1:12345/-/ready
    method: GET
    status_code: 200
    return_content: false
  register: backend_metrics_alloy_readiness
  retries: 6
  delay: 5
  until: backend_metrics_alloy_readiness.status | default(0) == 200
  changed_when: false
  when: not ansible_check_mode

- name: Require healthy Alloy components after configuration
  ansible.builtin.uri:
    url: http://127.0.0.1:12345/-/healthy
    method: GET
    status_code: 200
    return_content: false
  register: backend_metrics_alloy_health
  retries: 3
  delay: 5
  until: backend_metrics_alloy_health.status | default(0) == 200
  changed_when: false
  when: not ansible_check_mode

- name: Report backend metrics summary
  ansible.builtin.debug:
    msg:
      enabled: "{{ backend_metrics_enabled }}"
      logs_enabled: "{{ backend_logs_enabled }}"
      alloy_config_path: "{{ backend_metrics_alloy_config_path }}"
      textfile_dir: "{{ backend_metrics_textfile_dir }}"
      scrape_interval: "{{ backend_metrics_scrape_interval }}"
      worker_uplift_targets: "{{ backend_metrics_worker_uplift_targets | map(attribute='service') | list }}"
      postgres_exporter: "{{ 'enabled' if backend_metrics_postgres_enabled else 'disabled' }}"
      caddy_metrics: "{{ 'enabled' if backend_metrics_caddy_enabled else 'disabled' }}"
      endpoint: grafana_cloud_prometheus_remote_write
      logs_endpoint: "{{ 'grafana_cloud_loki' if backend_logs_enabled else 'disabled' }}"
      alloy_package_manageable: "{{ backend_metrics_alloy_manageable }}"
