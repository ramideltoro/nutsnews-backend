---
- name: Ensure monitoring and log retention packages are installed
  ansible.builtin.apt:
    name:
      - logrotate
      - sysstat
    state: present
    update_cache: true
  register: backend_monitoring_packages

- name: Track whether sysstat service can be managed in this run
  ansible.builtin.set_fact:
    backend_monitoring_sysstat_manageable: "{{ (not ansible_check_mode) or not (backend_monitoring_packages is changed) }}"

- name: Ensure backend log directory exists
  ansible.builtin.file:
    path: "{{ backend_monitoring_log_dir }}"
    state: directory
    owner: root
    group: adm
    mode: "0750"

- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure backend journald retention
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/99-nutsnews-backend.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ramideltoro/nutsnews-backend.
      [Journal]
      Storage=persistent
      SystemMaxUse={{ backend_monitoring_journal_system_max_use }}
      MaxRetentionSec={{ backend_monitoring_journal_max_retention_sec }}
  notify: Restart systemd-journald

- name: Configure backend log rotation
  ansible.builtin.copy:
    dest: /etc/logrotate.d/nutsnews-backend
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ramideltoro/nutsnews-backend.
      {{ backend_monitoring_log_dir }}/*.log {
          daily
          rotate 14
          missingok
          notifempty
          compress
          delaycompress
          copytruncate
          create 0640 root adm
      }

- name: Ensure New Relic log forwarder directory exists
  ansible.builtin.file:
    path: "{{ backend_newrelic_logs_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: backend_newrelic_logs_enabled | bool

- name: Remove unmanaged New Relic auto log configs
  ansible.builtin.file:
    path: "{{ backend_newrelic_logs_config_dir }}/{{ item }}"
    state: absent
  loop: "{{ backend_newrelic_logs_disabled_config_files }}"
  when: backend_newrelic_logs_enabled | bool
  notify: Restart newrelic-infra

- name: Install curated New Relic backend log forwarding config
  ansible.builtin.copy:
    dest: "{{ backend_newrelic_logs_config_dir }}/nutsnews-backend.yml"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ramideltoro/nutsnews-backend.
      # Keep this allowlisted and low-volume; do not forward New Relic CLI logs.
      logs:
        - name: nutsnews-caddy-access-errors
          file: /var/log/caddy/access.log
          max_line_kb: {{ backend_newrelic_logs_max_line_kb }}
          pattern: '"status":(4|5)[0-9][0-9]|[[:space:]](4|5)[0-9][0-9][[:space:]]'
          attributes:
            service.name: nutsnews-backend-production
            environment: {{ backend_metrics_environment_label }}
            host.name: {{ backend_metrics_instance_label }}
            repository: ramideltoro/nutsnews-backend
            unit: caddy
            logtype: caddy-access

        - name: nutsnews-caddy-error
          file: /var/log/caddy/error.log
          max_line_kb: {{ backend_newrelic_logs_max_line_kb }}
          attributes:
            service.name: nutsnews-backend-production
            environment: {{ backend_metrics_environment_label }}
            host.name: {{ backend_metrics_instance_label }}
            repository: ramideltoro/nutsnews-backend
            unit: caddy
            logtype: caddy-error

        - name: nutsnews-postgresql-operational
          file: /var/log/postgresql/postgresql*.log
          max_line_kb: {{ backend_newrelic_logs_max_line_kb }}
          pattern: '(ERROR|Error|error|FATAL|Fatal|fatal|PANIC|Panic|panic|WARNING|Warning|warning|deadlock|Deadlock|checkpoint|Checkpoint|autovacuum|Autovacuum|duration:)'
          attributes:
            service.name: nutsnews-backend-production
            environment: {{ backend_metrics_environment_label }}
            host.name: {{ backend_metrics_instance_label }}
            repository: ramideltoro/nutsnews-backend
            unit: postgresql
            logtype: postgresql

        - name: nutsnews-app-warn-error
          file: /var/log/nutsnews/*.log
          max_line_kb: {{ backend_newrelic_logs_max_line_kb }}
          pattern: '(WARN|Warn|warn|WARNING|Warning|warning|ERROR|Error|error|CRITICAL|Critical|critical|FATAL|Fatal|fatal|Exception|exception|trace_id|request_id)'
          attributes:
            service.name: nutsnews-backend-production
            environment: {{ backend_metrics_environment_label }}
            host.name: {{ backend_metrics_instance_label }}
            repository: ramideltoro/nutsnews-backend
            unit: nutsnews-app
            logtype: nutsnews-app

        - name: nutsnews-auth-security
          file: /var/log/auth.log
          max_line_kb: {{ backend_newrelic_logs_max_line_kb }}
          pattern: '(fail|failed|Failed|FAILED|denied|Denied|DENIED|invalid|Invalid|INVALID|refused|Refused|authentication failure|Authentication failure|sudo|session opened|session closed)'
          attributes:
            service.name: nutsnews-backend-production
            environment: {{ backend_metrics_environment_label }}
            host.name: {{ backend_metrics_instance_label }}
            repository: ramideltoro/nutsnews-backend
            unit: auth.log
            logtype: linux_auth

        - name: nutsnews-fail2ban-security
          file: /var/log/fail2ban.log
          max_line_kb: {{ backend_newrelic_logs_max_line_kb }}
          pattern: '(Ban|ban|Unban|unban|Found|found|ERROR|Error|error|WARNING|Warning|warning)'
          attributes:
            service.name: nutsnews-backend-production
            environment: {{ backend_metrics_environment_label }}
            host.name: {{ backend_metrics_instance_label }}
            repository: ramideltoro/nutsnews-backend
            unit: fail2ban.log
            logtype: fail2ban

        - name: nutsnews-newrelic-infra-warn-error
          file: /var/log/newrelic-infra/newrelic-infra.log
          max_line_kb: {{ backend_newrelic_logs_max_line_kb }}
          pattern: '(WARN|Warn|warn|WARNING|Warning|warning|ERROR|Error|error|FATAL|Fatal|fatal)'
          attributes:
            service.name: nutsnews-backend-production
            environment: {{ backend_metrics_environment_label }}
            host.name: {{ backend_metrics_instance_label }}
            repository: ramideltoro/nutsnews-backend
            unit: newrelic-infra
            logtype: newrelic-infra
  when: backend_newrelic_logs_enabled | bool
  notify: Restart newrelic-infra

- name: Enable sysstat collection
  ansible.builtin.lineinfile:
    path: /etc/default/sysstat
    regexp: '^ENABLED='
    line: 'ENABLED="true"'
    owner: root
    group: root
    mode: "0644"
  notify: Restart sysstat
  when: backend_monitoring_sysstat_manageable | bool

- name: Ensure sysstat service is enabled and started
  ansible.builtin.service:
    name: sysstat
    enabled: true
    state: started
  when: backend_monitoring_sysstat_manageable | bool

- name: Install backend smoke check
  ansible.builtin.template:
    src: nutsnews-backend-smoke.sh.j2
    dest: /usr/local/sbin/nutsnews-backend-smoke
    owner: root
    group: root
    mode: "0755"

- name: Run backend smoke check after monitoring setup
  ansible.builtin.command: /usr/local/sbin/nutsnews-backend-smoke
  register: backend_smoke_check
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Report monitoring baseline summary
  ansible.builtin.debug:
    msg:
      log_dir: "{{ backend_monitoring_log_dir }}"
      journal_system_max_use: "{{ backend_monitoring_journal_system_max_use }}"
      journal_max_retention_sec: "{{ backend_monitoring_journal_max_retention_sec }}"
      disk_warn_percent: "{{ backend_monitoring_disk_warn_percent }}"
      disk_crit_percent: "{{ backend_monitoring_disk_crit_percent }}"
      memory_warn_percent: "{{ backend_monitoring_memory_warn_percent }}"
      memory_crit_percent: "{{ backend_monitoring_memory_crit_percent }}"
      health_path: "{{ backend_monitoring_health_path }}"
      app_status: "{{ backend_monitoring_app_status }}"
      sysstat_service_manageable: "{{ backend_monitoring_sysstat_manageable }}"
      smoke_output: "{{ backend_smoke_check.stdout_lines | default([]) }}"
