---
- name: Install PostgreSQL failover target packages
  ansible.builtin.apt:
    name: "{{ backend_postgres_packages }}"
    state: present
    update_cache: true
  register: backend_postgres_package_result

- name: Install database dashboard packages
  ansible.builtin.apt:
    name: "{{ backend_db_dashboard_packages }}"
    state: present
    update_cache: true
  register: backend_db_dashboard_package_result
  when: backend_db_dashboard_enabled | bool

- name: Track whether PostgreSQL can be configured in this run
  ansible.builtin.set_fact:
    backend_postgres_manageable: "{{ (not ansible_check_mode) or not (backend_postgres_package_result is changed) }}"
    backend_db_dashboard_manageable: >-
      {{
        (not backend_db_dashboard_enabled | bool)
        or (not ansible_check_mode)
        or (
          backend_db_dashboard_package_result is defined
          and not (backend_db_dashboard_package_result is changed)
        )
      }}

- name: Ensure PostgreSQL state directory exists
  ansible.builtin.file:
    path: "{{ backend_postgres_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: backend_postgres_manageable | bool

- name: Keep PostgreSQL bound to loopback only
  ansible.builtin.lineinfile:
    path: "{{ backend_postgres_config_path }}"
    regexp: "^#?listen_addresses\\s*="
    line: "listen_addresses = '{{ backend_postgres_listen_addresses }}'"
    owner: postgres
    group: postgres
    mode: "0644"
  notify: Restart postgresql
  when: backend_postgres_manageable | bool

- name: Require SCRAM password hashing for PostgreSQL roles
  ansible.builtin.lineinfile:
    path: "{{ backend_postgres_config_path }}"
    regexp: "^#?password_encryption\\s*="
    line: "password_encryption = 'scram-sha-256'"
    owner: postgres
    group: postgres
    mode: "0644"
  notify: Restart postgresql
  when: backend_postgres_manageable | bool

- name: Configure PostgreSQL benchmark and maintenance observability
  ansible.builtin.lineinfile:
    path: "{{ backend_postgres_config_path }}"
    regexp: "^#?{{ item.name }}\\s*="
    line: "{{ item.name }} = {{ item.value }}"
    owner: postgres
    group: postgres
    mode: "0644"
  loop:
    - name: log_min_duration_statement
      value: "{{ backend_postgres_log_min_duration_statement }}"
    - name: log_autovacuum_min_duration
      value: "{{ backend_postgres_log_autovacuum_min_duration }}"
    - name: track_io_timing
      value: "{{ backend_postgres_track_io_timing }}"
    - name: autovacuum
      value: "{{ backend_postgres_autovacuum }}"
  notify: Restart postgresql
  when: backend_postgres_manageable | bool

- name: Allow only loopback TCP PostgreSQL password auth
  ansible.builtin.blockinfile:
    path: "{{ backend_postgres_hba_path }}"
    marker: "# {mark} NUTSNEWS LOOPBACK POSTGRES"
    block: |
      host all all 127.0.0.1/32 scram-sha-256
      host all all ::1/128 scram-sha-256
  notify: Restart postgresql
  when: backend_postgres_manageable | bool

- name: Flush PostgreSQL restart before role and database management
  ansible.builtin.meta: flush_handlers
  when: backend_postgres_manageable | bool

- name: Ensure PostgreSQL service is enabled and started
  ansible.builtin.service:
    name: "{{ backend_postgres_service_name }}"
    enabled: true
    state: started
  when: backend_postgres_manageable | bool

- name: Ensure failover application role exists
  community.postgresql.postgresql_user:
    name: "{{ backend_postgres_app_user }}"
    password: "{{ backend_postgres_app_password }}"
    role_attr_flags: LOGIN,BYPASSRLS
    state: present
  become_user: postgres
  register: backend_postgres_app_user_result
  no_log: true
  when: backend_postgres_manageable | bool

- name: Ensure failover read-only role exists
  community.postgresql.postgresql_user:
    name: "{{ backend_postgres_readonly_user }}"
    password: "{{ backend_postgres_readonly_password }}"
    role_attr_flags: LOGIN
    state: present
  become_user: postgres
  register: backend_postgres_readonly_user_result
  no_log: true
  when: backend_postgres_manageable | bool

- name: Grant PostgreSQL monitoring statistics to the read-only role
  community.postgresql.postgresql_membership:
    groups:
      - pg_monitor
    target_roles:
      - "{{ backend_postgres_readonly_user }}"
    state: present
  become_user: postgres
  when:
    - backend_postgres_manageable | bool
    - (not ansible_check_mode) or not (backend_postgres_readonly_user_result is changed)

- name: Ensure migration restore role exists
  community.postgresql.postgresql_user:
    name: "{{ backend_postgres_restore_user }}"
    password: "{{ backend_postgres_restore_password }}"
    role_attr_flags: LOGIN,CREATEDB
    state: present
  become_user: postgres
  register: backend_postgres_restore_user_result
  no_log: true
  when: backend_postgres_manageable | bool

- name: Ensure migration validation role exists
  community.postgresql.postgresql_user:
    name: "{{ backend_postgres_validation_user }}"
    password: "{{ backend_postgres_validation_password }}"
    role_attr_flags: LOGIN,BYPASSRLS
    state: present
  become_user: postgres
  register: backend_postgres_validation_user_result
  no_log: true
  when: backend_postgres_manageable | bool

- name: Ensure migration replication role exists
  community.postgresql.postgresql_user:
    name: "{{ backend_postgres_replication_user }}"
    password: "{{ backend_postgres_replication_password }}"
    role_attr_flags: LOGIN
    state: present
  become_user: postgres
  register: backend_postgres_replication_user_result
  no_log: true
  when: backend_postgres_manageable | bool

- name: Ensure application rehearsal role exists
  community.postgresql.postgresql_user:
    name: "{{ backend_postgres_app_rehearsal_user }}"
    password: "{{ backend_postgres_app_rehearsal_password }}"
    role_attr_flags: LOGIN
    state: present
  become_user: postgres
  register: backend_postgres_app_rehearsal_user_result
  no_log: true
  when: backend_postgres_manageable | bool

- name: Ensure Worker API read role exists
  community.postgresql.postgresql_user:
    name: "{{ backend_postgres_worker_api_user }}"
    password: "{{ backend_postgres_worker_api_password }}"
    role_attr_flags: LOGIN,BYPASSRLS
    state: present
  become_user: postgres
  register: backend_postgres_worker_api_user_result
  no_log: true
  when: backend_postgres_manageable | bool

- name: Ensure Supabase compatibility roles exist
  community.postgresql.postgresql_user:
    name: "{{ item.name }}"
    role_attr_flags: "{{ item.flags }}"
    state: present
  loop:
    - name: anon
      flags: NOLOGIN
    - name: authenticated
      flags: NOLOGIN
    - name: service_role
      flags: NOLOGIN,BYPASSRLS
  become_user: postgres
  when: backend_postgres_manageable | bool

- name: Validate worker-uplift PostgreSQL stage role identifiers
  ansible.builtin.assert:
    that:
      - backend_worker_uplift_postgres_database is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - backend_worker_uplift_postgres_final_schema is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - backend_worker_uplift_postgres_views_schema is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - item.stage is match('^[a-z][a-z0-9_]*$')
      - item.schema is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - item.user is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - item.password | length > 0
    fail_msg: Worker-uplift PostgreSQL stage roles must use safe identifiers and configured passwords.
  loop: "{{ backend_worker_uplift_postgres_stage_roles }}"
  no_log: true
  when:
    - backend_postgres_manageable | bool
    - backend_worker_uplift_postgres_enabled | bool

- name: Ensure worker-uplift PostgreSQL stage roles exist
  community.postgresql.postgresql_user:
    name: "{{ item.user }}"
    password: "{{ item.password }}"
    role_attr_flags: LOGIN
    state: present
  loop: "{{ backend_worker_uplift_postgres_stage_roles }}"
  become_user: postgres
  register: backend_worker_uplift_postgres_stage_user_results
  no_log: true
  when:
    - backend_postgres_manageable | bool
    - backend_worker_uplift_postgres_enabled | bool

- name: Validate worker-uplift projection role boundary
  ansible.builtin.assert:
    that:
      - backend_worker_uplift_projection_user is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - backend_worker_uplift_projection_password | length > 0
      - backend_worker_uplift_projection_user not in (backend_worker_uplift_postgres_stage_roles | map(attribute='user') | list)
      - backend_worker_uplift_projection_user != backend_postgres_app_user
      - backend_worker_uplift_projection_user != backend_postgres_worker_api_user
    fail_msg: Worker-uplift projection role must be dedicated and use a configured protected password.
  no_log: true
  when:
    - backend_postgres_manageable | bool
    - backend_worker_uplift_postgres_enabled | bool

- name: Ensure worker-uplift projection role exists
  community.postgresql.postgresql_user:
    name: "{{ backend_worker_uplift_projection_user }}"
    password: "{{ backend_worker_uplift_projection_password }}"
    role_attr_flags: LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOREPLICATION
    state: present
  become_user: postgres
  register: backend_worker_uplift_projection_user_result
  no_log: true
  when:
    - backend_postgres_manageable | bool
    - backend_worker_uplift_postgres_enabled | bool

- name: Validate worker-uplift watermark role boundary
  ansible.builtin.assert:
    that:
      - backend_worker_uplift_watermark_user is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - backend_worker_uplift_watermark_password | length > 0
      - backend_worker_uplift_watermark_user not in (backend_worker_uplift_postgres_stage_roles | map(attribute='user') | list)
      - backend_worker_uplift_watermark_user != backend_postgres_app_user
      - backend_worker_uplift_watermark_user != backend_postgres_worker_api_user
      - backend_worker_uplift_watermark_user != backend_worker_uplift_projection_user
    fail_msg: Worker-uplift watermark role must be dedicated and use a configured protected password.
  no_log: true
  when:
    - backend_postgres_manageable | bool
    - backend_worker_uplift_postgres_enabled | bool

- name: Ensure worker-uplift watermark role exists
  community.postgresql.postgresql_user:
    name: "{{ backend_worker_uplift_watermark_user }}"
    password: "{{ backend_worker_uplift_watermark_password }}"
    role_attr_flags: LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOREPLICATION,NOINHERIT,NOBYPASSRLS
    state: present
  become_user: postgres
  register: backend_worker_uplift_watermark_user_result
  no_log: true
  when:
    - backend_postgres_manageable | bool
    - backend_worker_uplift_postgres_enabled | bool

- name: Validate worker-uplift cutover role boundary
  ansible.builtin.assert:
    that:
      - backend_worker_uplift_cutover_user is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - backend_worker_uplift_cutover_password | length > 0
      - backend_worker_uplift_cutover_user not in (backend_worker_uplift_postgres_stage_roles | map(attribute='user') | list)
      - backend_worker_uplift_cutover_user != backend_postgres_app_user
      - backend_worker_uplift_cutover_user != backend_postgres_worker_api_user
      - backend_worker_uplift_cutover_user != backend_worker_uplift_projection_user
      - backend_worker_uplift_cutover_user != backend_worker_uplift_watermark_user
    fail_msg: Worker-uplift cutover role must be dedicated and use a configured protected password.
  no_log: true
  when:
    - backend_postgres_manageable | bool
    - backend_worker_uplift_postgres_enabled | bool

- name: Ensure worker-uplift cutover role exists
  community.postgresql.postgresql_user:
    name: "{{ backend_worker_uplift_cutover_user }}"
    password: "{{ backend_worker_uplift_cutover_password }}"
    role_attr_flags: LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOREPLICATION
    state: present
  become_user: postgres
  register: backend_worker_uplift_cutover_user_result
  no_log: true
  when:
    - backend_postgres_manageable | bool
    - backend_worker_uplift_postgres_enabled | bool

- name: Track whether PostgreSQL role-dependent tasks can run in this check
  ansible.builtin.set_fact:
    backend_postgres_database_manageable: >-
      {{
        (not ansible_check_mode)
        or not (
          (backend_postgres_app_user_result is changed)
          or (backend_postgres_restore_user_result is changed)
        )
      }}
    backend_postgres_privilege_roles_manageable: >-
      {{
        (not ansible_check_mode)
        or not (
          (backend_postgres_app_user_result is changed)
          or (backend_postgres_readonly_user_result is changed)
          or (backend_postgres_validation_user_result is changed)
          or (backend_postgres_replication_user_result is changed)
          or (backend_postgres_app_rehearsal_user_result is changed)
          or (backend_postgres_worker_api_user_result is changed)
          or (
            backend_worker_uplift_postgres_stage_user_results is defined
            and (backend_worker_uplift_postgres_stage_user_results is changed)
          )
          or (
            backend_worker_uplift_projection_user_result is defined
            and (backend_worker_uplift_projection_user_result is changed)
          )
          or (
            backend_worker_uplift_watermark_user_result is defined
            and (backend_worker_uplift_watermark_user_result is changed)
          )
          or (
            backend_worker_uplift_cutover_user_result is defined
            and (backend_worker_uplift_cutover_user_result is changed)
          )
        )
      }}
  when: backend_postgres_manageable | bool

- name: Ensure failover database exists
  community.postgresql.postgresql_db:
    name: "{{ backend_postgres_database }}"
    owner: "{{ backend_postgres_app_user }}"
    encoding: UTF8
    state: present
  become_user: postgres
  register: backend_postgres_database_result
  when:
    - backend_postgres_manageable | bool
    - backend_postgres_database_manageable | default(false) | bool

- name: Ensure future-primary shadow database exists
  community.postgresql.postgresql_db:
    name: "{{ backend_postgres_primary_shadow_database }}"
    owner: "{{ backend_postgres_restore_user }}"
    encoding: UTF8
    state: present
  become_user: postgres
  register: backend_postgres_primary_shadow_database_result
  when:
    - backend_postgres_manageable | bool
    - backend_postgres_database_manageable | default(false) | bool

- name: Track whether PostgreSQL database-dependent tasks can run in this check
  ansible.builtin.set_fact:
    backend_postgres_database_dependents_manageable: >-
      {{
        (backend_postgres_database_manageable | default(false) | bool)
        and (
          (not ansible_check_mode)
          or (
            backend_postgres_database_result is defined
            and not (backend_postgres_database_result is changed)
            and backend_postgres_primary_shadow_database_result is defined
            and not (backend_postgres_primary_shadow_database_result is changed)
          )
        )
      }}
  when: backend_postgres_manageable | bool

- name: Ensure required PostgreSQL extensions exist in the failover database
  community.postgresql.postgresql_ext:
    name: "{{ item }}"
    db: "{{ backend_postgres_database }}"
    state: present
  loop: "{{ backend_postgres_required_extensions }}"
  become_user: postgres
  when:
    - backend_postgres_manageable | bool
    - backend_postgres_database_dependents_manageable | default(false) | bool

- name: Ensure required PostgreSQL extensions exist in the future-primary shadow database
  community.postgresql.postgresql_ext:
    name: "{{ item }}"
    db: "{{ backend_postgres_primary_shadow_database }}"
    state: present
  loop: "{{ backend_postgres_required_extensions }}"
  become_user: postgres
  when:
    - backend_postgres_manageable | bool
    - backend_postgres_database_dependents_manageable | default(false) | bool

- name: Allow read-only role to connect to the failover database
  community.postgresql.postgresql_privs:
    db: "{{ backend_postgres_database }}"
    type: database
    objs: "{{ backend_postgres_database }}"
    privs: CONNECT
    roles: "{{ backend_postgres_readonly_user }},{{ backend_postgres_validation_user }},{{ backend_postgres_app_rehearsal_user }}"
    state: present
  become_user: postgres
  when:
    - backend_postgres_manageable | bool
    - backend_postgres_database_dependents_manageable | default(false) | bool
    - backend_postgres_privilege_roles_manageable | default(false) | bool

- name: Allow migration roles to connect to the future-primary shadow database
  community.postgresql.postgresql_privs:
    db: "{{ backend_postgres_primary_shadow_database }}"
    type: database
    objs: "{{ backend_postgres_primary_shadow_database }}"
    privs: CONNECT
    roles: "{{ backend_postgres_readonly_user }},{{ backend_postgres_validation_user }},{{ backend_postgres_replication_user }},{{ backend_postgres_app_user }},{{ backend_postgres_worker_api_user }}"
    state: present
  become_user: postgres
  when:
    - backend_postgres_manageable | bool
    - backend_postgres_database_dependents_manageable | default(false) | bool
    - backend_postgres_privilege_roles_manageable | default(false) | bool

- name: Enforce future-primary shadow database CONNECT grants
  community.postgresql.postgresql_query:
    login_db: postgres
    query: |
      DO $$
      DECLARE
        grant_role name;
      BEGIN
        FOREACH grant_role IN ARRAY ARRAY[
          '{{ backend_postgres_readonly_user }}',
          '{{ backend_postgres_validation_user }}',
          '{{ backend_postgres_replication_user }}',
          '{{ backend_postgres_app_user }}',
          '{{ backend_postgres_worker_api_user }}'
        ]::name[] LOOP
          EXECUTE format(
            'GRANT CONNECT ON DATABASE %I TO %I',
            '{{ backend_postgres_primary_shadow_database }}',
            grant_role
          );
        END LOOP;
      END $$;
  become_user: postgres
  when:
    - backend_postgres_manageable | bool
    - backend_postgres_database_dependents_manageable | default(false) | bool
    - backend_postgres_privilege_roles_manageable | default(false) | bool
    - not ansible_check_mode

- name: Allow worker-uplift stage roles to connect to the future-primary shadow database
  community.postgresql.postgresql_privs:
    db: "{{ backend_worker_uplift_postgres_database }}"
    type: database
    objs: "{{ backend_worker_uplift_postgres_database }}"
    privs: CONNECT
    roles: "{{ backend_worker_uplift_postgres_stage_roles | map(attribute='user') | join(',') }}"
    state: present
  become_user: postgres
  when:
    - backend_postgres_manageable | bool
    - backend_worker_uplift_postgres_enabled | bool
    - backend_postgres_database_dependents_manageable | default(false) | bool
    - backend_postgres_privilege_roles_manageable | default(false) | bool

- name: Allow worker-uplift projection role to connect to the future-primary shadow database
  community.postgresql.postgresql_privs:
    db: "{{ backend_worker_uplift_postgres_database }}"
    type: database
    objs: "{{ backend_worker_uplift_postgres_database }}"
    privs: CONNECT
    roles: "{{ backend_worker_uplift_projection_user }}"
    state: present
  become_user: postgres
  when:
    - backend_postgres_manageable | bool
    - backend_worker_uplift_postgres_enabled | bool
    - backend_postgres_database_dependents_manageable | default(false) | bool
    - backend_postgres_privilege_roles_manageable | default(false) | bool

- name: Allow worker-uplift cutover role to connect to the future-primary shadow database
  community.postgresql.postgresql_privs:
    db: "{{ backend_worker_uplift_postgres_database }}"
    type: database
    objs: "{{ backend_worker_uplift_postgres_database }}"
    privs: CONNECT
    roles: "{{ backend_worker_uplift_cutover_user }}"
    state: present
  become_user: postgres
  when:
    - backend_postgres_manageable | bool
    - backend_worker_uplift_postgres_enabled | bool
    - backend_postgres_database_dependents_manageable | default(false) | bool
    - backend_postgres_privilege_roles_manageable | default(false) | bool

- name: Allow read-only role to use the public schema
  community.postgresql.postgresql_privs:
    db: "{{ backend_postgres_database }}"
    type: schema
    objs: public
    privs: USAGE
    roles: "{{ backend_postgres_readonly_user }},{{ backend_postgres_validation_user }},{{ backend_postgres_app_rehearsal_user }}"
    state: present
  become_user: postgres
  when:
    - backend_postgres_manageable | bool
    - backend_postgres_database_dependents_manageable | default(false) | bool
    - backend_postgres_privilege_roles_manageable | default(false) | bool

- name: Allow validation roles to use the future-primary shadow public schema
  community.postgresql.postgresql_privs:
    db: "{{ backend_postgres_primary_shadow_database }}"
    type: schema
    objs: public
    privs: USAGE
    roles: "{{ backend_postgres_readonly_user }},{{ backend_postgres_validation_user }},{{ backend_postgres_worker_api_user }}"
    state: present
  become_user: postgres
  when:
    - backend_postgres_manageable | bool
    - backend_postgres_database_dependents_manageable | default(false) | bool
    - backend_postgres_privilege_roles_manageable | default(false) | bool

- name: Validate required worker-uplift PostgreSQL migrations
  ansible.builtin.assert:
    that:
      - "'001_fetcher_durable_state_contract.sql' in backend_worker_uplift_postgres_migrations"
      - "backend_worker_uplift_postgres_migrations == (backend_worker_uplift_postgres_migrations | sort)"
      - "(backend_worker_uplift_postgres_migrations | unique | length) == (backend_worker_uplift_postgres_migrations | length)"
    fail_msg: "The fetcher durable-state migration must remain in the protected worker-uplift migration set."
  when:
    - backend_postgres_manageable | bool
    - backend_worker_uplift_postgres_enabled | bool

- name: Validate versioned worker-uplift PostgreSQL migration filenames
  ansible.builtin.assert:
    that:
      - item is match('^[0-9]{3}_[a-z0-9_]+[.]sql$')
    fail_msg: "Worker-uplift PostgreSQL migrations must use a bounded versioned SQL filename."
  loop: "{{ backend_worker_uplift_postgres_migrations }}"
  loop_control:
    label: "{{ item }}"
  when:
    - backend_postgres_manageable | bool
    - backend_worker_uplift_postgres_enabled | bool

- name: Install worker-uplift shadow PostgreSQL data model
  community.postgresql.postgresql_query:
    db: "{{ backend_worker_uplift_postgres_database }}"
    query: "{{ lookup('ansible.builtin.template', role_path ~ '/templates/worker-uplift-shadow-data-model.sql.j2') }}"
  become_user: postgres
  when:
    - backend_postgres_manageable | bool
    - backend_worker_uplift_postgres_enabled | bool
    - backend_postgres_database_dependents_manageable | default(false) | bool
    - backend_postgres_privilege_roles_manageable | default(false) | bool
    - not ansible_check_mode

- name: Apply versioned worker-uplift PostgreSQL migrations
  community.postgresql.postgresql_query:
    db: "{{ backend_worker_uplift_postgres_database }}"
    query: >-
      {{
        lookup(
          'ansible.builtin.file',
          role_path ~ '/files/worker-uplift-migrations/' ~ item
        )
      }}
  become_user: postgres
  loop: "{{ backend_worker_uplift_postgres_migrations }}"
  loop_control:
    label: "{{ item }}"
  when:
    - backend_postgres_manageable | bool
    - backend_worker_uplift_postgres_enabled | bool
    - backend_postgres_database_dependents_manageable | default(false) | bool
    - backend_postgres_privilege_roles_manageable | default(false) | bool
    - not ansible_check_mode

- name: Allow database API roles to read future-primary shadow app and worker objects
  community.postgresql.postgresql_query:
    db: "{{ backend_postgres_primary_shadow_database }}"
    query: |
      DO $$
      DECLARE
        api_object text;
        api_read_role name;
        api_write_object text;
      BEGIN
        FOREACH api_read_role IN ARRAY ARRAY[
          '{{ backend_postgres_worker_api_user }}',
          '{{ backend_postgres_app_user }}'
        ]::name[] LOOP
          EXECUTE format('GRANT USAGE ON SCHEMA public TO %I', api_read_role);
          FOREACH api_object IN ARRAY ARRAY[
            'public.articles',
            'public.article_ai_reviews',
            'public.article_summaries',
            'public.ai_usage_runs',
            'public.admin_audit_events',
            'public.article_engagement_article_summary',
            'public.article_engagement_daily',
            'public.article_engagement_source_category_summary',
            'public.ai_decision_version_report',
            'public.feed_health',
            'public.feed_quality_scores',
            'public.public_feed_snapshot',
            'public.quota_usage_events',
            'public.rss_feeds',
            'public.worker_runs',
            'public.runtime_feature_flags'
          ]::text[] LOOP
            IF to_regclass(api_object) IS NOT NULL THEN
              EXECUTE format(
                'GRANT SELECT ON TABLE %s TO %I',
                to_regclass(api_object),
                api_read_role
              );
            END IF;
          END LOOP;
        END LOOP;

        IF to_regclass('public.quota_usage_events') IS NOT NULL THEN
          EXECUTE format(
            'GRANT INSERT ON TABLE public.quota_usage_events TO %I',
            '{{ backend_postgres_worker_api_user }}'
          );
        END IF;

        IF to_regclass('public.quota_usage_events_id_seq') IS NOT NULL THEN
          EXECUTE format(
            'GRANT USAGE ON SEQUENCE public.quota_usage_events_id_seq TO %I',
            '{{ backend_postgres_worker_api_user }}'
          );
        END IF;

        IF to_regclass('public.runtime_feature_flags') IS NOT NULL THEN
          EXECUTE format(
            'GRANT INSERT, UPDATE ON TABLE public.runtime_feature_flags TO %I',
            '{{ backend_postgres_worker_api_user }}'
          );
        END IF;

        FOREACH api_write_object IN ARRAY ARRAY[
          'public.articles',
          'public.article_ai_reviews',
          'public.article_summaries',
          'public.ai_usage_runs',
          'public.feed_health',
          'public.worker_runs',
          'public.quota_usage_events',
          'public.runtime_feature_flags'
        ]::text[] LOOP
          IF to_regclass(api_write_object) IS NOT NULL THEN
            EXECUTE format(
              'GRANT INSERT, UPDATE ON TABLE %s TO %I',
              to_regclass(api_write_object),
              '{{ backend_postgres_app_user }}'
            );
          END IF;
        END LOOP;

        EXECUTE format(
          'GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO %I',
          '{{ backend_postgres_app_user }}'
        );

        IF to_regprocedure('public.record_article_engagement_event(text,uuid,text,text,integer)') IS NOT NULL THEN
          EXECUTE format(
            'GRANT EXECUTE ON FUNCTION public.record_article_engagement_event(text,uuid,text,text,integer) TO %I',
            '{{ backend_postgres_worker_api_user }}'
          );
          EXECUTE format(
            'GRANT EXECUTE ON FUNCTION public.record_article_engagement_event(text,uuid,text,text,integer) TO %I',
            '{{ backend_postgres_app_user }}'
          );
        END IF;

        IF to_regprocedure('public.search_articles(text,integer,integer)') IS NOT NULL THEN
          EXECUTE format(
            'GRANT EXECUTE ON FUNCTION public.search_articles(text,integer,integer) TO %I',
            '{{ backend_postgres_worker_api_user }}'
          );
          EXECUTE format(
            'GRANT EXECUTE ON FUNCTION public.search_articles(text,integer,integer) TO %I',
            '{{ backend_postgres_app_user }}'
          );
        END IF;

        IF to_regprocedure('public.nutsnews_migration_schema_contract()') IS NOT NULL THEN
          EXECUTE format(
            'GRANT EXECUTE ON FUNCTION public.nutsnews_migration_schema_contract() TO %I',
            '{{ backend_postgres_worker_api_user }}'
          );
          EXECUTE format(
            'GRANT EXECUTE ON FUNCTION public.nutsnews_migration_schema_contract() TO %I',
            '{{ backend_postgres_app_user }}'
          );
        END IF;

        IF to_regprocedure('public.refresh_public_feed_snapshot()') IS NOT NULL THEN
          EXECUTE format(
            'GRANT EXECUTE ON FUNCTION public.refresh_public_feed_snapshot() TO %I',
            '{{ backend_postgres_app_user }}'
          );
        END IF;
      END $$;
  become_user: postgres
  when:
    - backend_postgres_manageable | bool
    - backend_postgres_database_dependents_manageable | default(false) | bool
    - backend_postgres_privilege_roles_manageable | default(false) | bool
    - not ansible_check_mode

- name: Preserve initial PostgreSQL readiness status
  ansible.builtin.copy:
    dest: "{{ backend_postgres_state_dir }}/status.json"
    owner: root
    group: root
    mode: "0644"
    force: false
    content: |
      {
        "status": "warning",
        "database": "{{ backend_postgres_database }}",
        "rehearsal_database": "{{ backend_postgres_rehearsal_database }}",
        "primary_shadow_database": "{{ backend_postgres_primary_shadow_database }}",
        "source_of_truth": "Supabase remains the only production writer until a protected cutover is separately approved.",
        "last_restore_drill": {
          "status": "not_configured"
        },
        "replication": {
          "mode": "manual_dump_restore",
          "lag_status": "not_configured",
          "split_brain_guard": "no multi-writer topology"
        },
        "dashboard": {
          "tool": "Adminer",
          "access_boundary": "loopback_only_ssh_tunnel",
          "url": "http://{{ backend_db_dashboard_bind }}:{{ backend_db_dashboard_port }}/"
        }
      }
  when: backend_postgres_manageable | bool

- name: Write future-primary shadow provisioning status
  ansible.builtin.copy:
    dest: "{{ backend_postgres_state_dir }}/primary-shadow-provision.json"
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "status": "provisioned",
        "database": "{{ backend_postgres_primary_shadow_database }}",
        "owner_role": "{{ backend_postgres_restore_user }}",
        "validation_role": "{{ backend_postgres_validation_user }}",
        "readonly_role": "{{ backend_postgres_readonly_user }}",
        "replication_role": "{{ backend_postgres_replication_user }}",
        "future_application_role": "{{ backend_postgres_app_user }}",
        "worker_uplift": {
          "enabled": {{ backend_worker_uplift_postgres_enabled | bool | to_json }},
          "database": "{{ backend_worker_uplift_postgres_database }}",
          "stage_schemas": {{ backend_worker_uplift_postgres_stage_roles | map(attribute='schema') | list | to_json }},
          "final_schema": "{{ backend_worker_uplift_postgres_final_schema }}",
          "views_schema": "{{ backend_worker_uplift_postgres_views_schema }}",
          "direct_public_domain_writes_allowed": false
        },
        "network_path": "ssh_tunnel_to_loopback_postgresql",
        "public_5432_allowed": false,
        "source_of_truth": "Supabase remains the only production writer until issue 119 is explicitly approved and executed.",
        "safe_metadata_only": true
      }
  when:
    - backend_postgres_manageable | bool
    - not ansible_check_mode

- name: Install loopback-only Adminer PHP-FPM pool
  ansible.builtin.copy:
    dest: "{{ backend_db_dashboard_php_fpm_pool_dir }}/nutsnews-adminer.conf"
    owner: root
    group: root
    mode: "0644"
    content: |
      ; Managed by ramideltoro/nutsnews-backend.
      [nutsnews-adminer]
      user = www-data
      group = www-data
      listen = {{ backend_db_dashboard_php_fpm_listen }}
      listen.allowed_clients = 127.0.0.1
      pm = ondemand
      pm.max_children = 3
      pm.process_idle_timeout = 30s
      pm.max_requests = 200
      php_admin_value[open_basedir] = {{ backend_db_dashboard_root }}:/tmp
      php_admin_value[session.save_path] = /tmp
  notify: Restart database dashboard php-fpm
  when:
    - backend_db_dashboard_enabled | bool
    - backend_db_dashboard_manageable | bool

- name: Flush PHP-FPM restart before Caddy validation
  ansible.builtin.meta: flush_handlers
  when:
    - backend_db_dashboard_enabled | bool
    - backend_db_dashboard_manageable | bool

- name: Ensure database dashboard PHP-FPM service is enabled and started
  ansible.builtin.service:
    name: "{{ backend_db_dashboard_php_fpm_service }}"
    enabled: true
    state: started
  when:
    - backend_db_dashboard_enabled | bool
    - backend_db_dashboard_manageable | bool

- name: Capture PostgreSQL loopback listener status
  ansible.builtin.command: "ss -H -ltn sport = :5432"
  register: backend_postgres_listener
  changed_when: false
  failed_when: false
  when:
    - backend_postgres_manageable | bool
    - not ansible_check_mode

- name: Report PostgreSQL failover target summary
  ansible.builtin.debug:
    msg:
      enabled: "{{ backend_postgres_enabled }}"
      database: "{{ backend_postgres_database }}"
      rehearsal_database: "{{ backend_postgres_rehearsal_database }}"
      primary_shadow_database: "{{ backend_postgres_primary_shadow_database }}"
      listen_addresses: "{{ backend_postgres_listen_addresses }}"
      dashboard_enabled: "{{ backend_db_dashboard_enabled }}"
      dashboard_route: "http://{{ backend_db_dashboard_bind }}:{{ backend_db_dashboard_port }}/"
      access_boundary: loopback_only_ssh_tunnel
      listener: "{{ backend_postgres_listener.stdout_lines | default([]) }}"
