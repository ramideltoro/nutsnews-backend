---
- name: Ensure OpenSSH server is installed
  ansible.builtin.apt:
    name: openssh-server
    state: present
    update_cache: true

- name: Ensure sshd drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Disable conflicting auth directives in main sshd_config
  ansible.builtin.replace:
    path: /etc/ssh/sshd_config
    regexp: '(?i)^\s*({{ item }})\s+.*$'
    replace: '# Managed by NutsNews backend baseline in {{ backend_ssh_hardening_dropin }}: \1'
    validate: /usr/sbin/sshd -t -f %s
  loop: "{{ backend_ssh_managed_directives }}"
  notify: Reload ssh

- name: Install managed SSH hardening drop-in
  ansible.builtin.copy:
    dest: "{{ backend_ssh_hardening_dropin }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ramideltoro/nutsnews-backend.
      # Keep this file early in sshd_config.d so cloud-init drop-ins cannot override key-only auth.
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
  notify: Reload ssh

- name: Validate effective sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -t -f /etc/ssh/sshd_config
  changed_when: false
