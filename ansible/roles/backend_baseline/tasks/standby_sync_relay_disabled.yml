---
- name: Check whether the backend Supabase sync relay timer is installed
  ansible.builtin.stat:
    path: /etc/systemd/system/nutsnews-supabase-sync-relay.timer
  register: backend_supabase_sync_relay_timer_unit

- name: Check whether the backend Supabase sync relay service is installed
  ansible.builtin.stat:
    path: /etc/systemd/system/nutsnews-supabase-sync-relay.service
  register: backend_supabase_sync_relay_service_unit

- name: Stop and disable the unsafe backend Supabase sync relay timer
  ansible.builtin.systemd:
    name: nutsnews-supabase-sync-relay.timer
    enabled: false
    state: stopped
    daemon_reload: true
  when: backend_supabase_sync_relay_timer_unit.stat.exists

- name: Stop any in-flight backend Supabase sync relay service
  ansible.builtin.systemd:
    name: nutsnews-supabase-sync-relay.service
    state: stopped
  when: backend_supabase_sync_relay_service_unit.stat.exists

- name: Inspect backend Supabase sync relay timer failure state
  ansible.builtin.command:
    argv:
      - systemctl
      - is-failed
      - --quiet
      - nutsnews-supabase-sync-relay.timer
  register: backend_supabase_sync_relay_timer_failed
  changed_when: false
  failed_when: false
  when: backend_supabase_sync_relay_timer_unit.stat.exists

- name: Clear historical backend Supabase sync relay timer failure state
  ansible.builtin.command:
    argv:
      - systemctl
      - reset-failed
      - nutsnews-supabase-sync-relay.timer
  changed_when: false
  when:
    - backend_supabase_sync_relay_timer_unit.stat.exists
    - backend_supabase_sync_relay_timer_failed.rc == 0

- name: Inspect backend Supabase sync relay service failure state
  ansible.builtin.command:
    argv:
      - systemctl
      - is-failed
      - --quiet
      - nutsnews-supabase-sync-relay.service
  register: backend_supabase_sync_relay_service_failed
  changed_when: false
  failed_when: false
  when: backend_supabase_sync_relay_service_unit.stat.exists

- name: Clear historical backend Supabase sync relay service failure state
  ansible.builtin.command:
    argv:
      - systemctl
      - reset-failed
      - nutsnews-supabase-sync-relay.service
  changed_when: false
  when:
    - backend_supabase_sync_relay_service_unit.stat.exists
    - backend_supabase_sync_relay_service_failed.rc == 0

- name: Report backend Supabase sync relay suspension
  ansible.builtin.debug:
    msg:
      enabled: false
      service: nutsnews-supabase-sync-relay.service
      timer: nutsnews-supabase-sync-relay.timer
      state: suspended
      reason: snapshot parity scans can exhaust the shared production Supabase database
      reenable_boundary: replace snapshot polling with reviewed incremental replication
