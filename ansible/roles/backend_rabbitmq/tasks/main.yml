---
- name: Validate RabbitMQ bootstrap settings
  ansible.builtin.assert:
    that:
      - backend_rabbitmq_image is match('^rabbitmq@sha256:[0-9a-f]{64}$')
      - backend_rabbitmq_vhost | length > 0
      - backend_rabbitmq_admin_username | length > 0
      - backend_rabbitmq_admin_password | length > 0
      - backend_rabbitmq_erlang_cookie | length >= 20
      - backend_rabbitmq_bind_address == '127.0.0.1'
      - backend_rabbitmq_amqp_port | string == '5672'
      - backend_rabbitmq_management_port | string == '15672'
      - backend_rabbitmq_prometheus_port | string == '15692'
      - backend_rabbitmq_nofile | int == 65536
    fail_msg: "RabbitMQ provisioning requires pinned image, protected credentials, loopback listeners, and approved limits."
  no_log: true

- name: Validate RabbitMQ topology credential settings
  ansible.builtin.assert:
    that:
      - backend_rabbitmq_topology_environment is mapping
      - (backend_rabbitmq_topology_required_environment_names | difference(backend_rabbitmq_topology_environment.keys() | list) | length) == 0
      - backend_rabbitmq_topology_environment['RABBITMQ_BREAK_GLASS_ADMIN_USERNAME'] == backend_rabbitmq_admin_username
      - backend_rabbitmq_topology_environment['RABBITMQ_BREAK_GLASS_ADMIN_PASSWORD'] == backend_rabbitmq_admin_password
      - backend_rabbitmq_topology_required_environment_names | length == 32
    fail_msg: "RabbitMQ topology provisioning requires protected least-privilege usernames and passwords for every managed identity."
  no_log: true
  when: backend_rabbitmq_topology_enabled | bool

- name: Capture root filesystem free bytes before RabbitMQ bootstrap
  ansible.builtin.command:
    argv:
      - df
      - -B1
      - --output=avail
      - /
  register: backend_rabbitmq_root_df
  changed_when: false
  check_mode: false

- name: Require root filesystem headroom for RabbitMQ
  ansible.builtin.assert:
    that:
      - (backend_rabbitmq_root_df.stdout_lines | last | trim | int) >= backend_rabbitmq_minimum_root_free_bytes | int
    fail_msg: "RabbitMQ bootstrap requires at least {{ backend_rabbitmq_minimum_root_free_bytes }} bytes free on /."

- name: Install Docker and Compose packages for RabbitMQ
  ansible.builtin.apt:
    name: "{{ backend_rabbitmq_packages }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ backend_apt_cache_valid_time | default(3600) }}"
  register: backend_rabbitmq_package_result

- name: Track whether RabbitMQ runtime can be managed in this run
  ansible.builtin.set_fact:
    backend_rabbitmq_runtime_manageable: "{{ (not ansible_check_mode) or not (backend_rabbitmq_package_result is changed) }}"

- name: Ensure Docker service is enabled and started for RabbitMQ
  ansible.builtin.systemd:
    name: docker.service
    enabled: true
    state: started
    daemon_reload: true
  when:
    - backend_rabbitmq_runtime_manageable | bool
    - not ansible_check_mode

- name: Ensure RabbitMQ config directory exists
  ansible.builtin.file:
    path: "{{ backend_rabbitmq_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Ensure RabbitMQ compose directory exists
  ansible.builtin.file:
    path: "{{ backend_rabbitmq_base_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Ensure RabbitMQ persistent data directory exists
  ansible.builtin.file:
    path: "{{ backend_rabbitmq_data_dir }}"
    state: directory
    owner: "{{ backend_rabbitmq_container_uid }}"
    group: "{{ backend_rabbitmq_container_gid }}"
    mode: "0750"

- name: Repair RabbitMQ persistent data tree ownership
  ansible.builtin.file:
    path: "{{ backend_rabbitmq_data_dir }}"
    state: directory
    owner: "{{ backend_rabbitmq_container_uid }}"
    group: "{{ backend_rabbitmq_container_gid }}"
    mode: "u+rwX"
    recurse: true
  register: backend_rabbitmq_data_tree_permissions

- name: Ensure RabbitMQ probe state directory exists
  ansible.builtin.file:
    path: "{{ backend_rabbitmq_probe_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Ensure RabbitMQ recovery state directory exists
  ansible.builtin.file:
    path: "{{ backend_rabbitmq_recovery_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Remove legacy probe state from RabbitMQ broker data directory
  ansible.builtin.file:
    path: "{{ backend_rabbitmq_legacy_probe_state_path }}"
    state: absent
  register: backend_rabbitmq_legacy_probe_state_file

- name: Render RabbitMQ root-only environment
  ansible.builtin.copy:
    dest: "{{ backend_rabbitmq_env_path }}"
    owner: root
    group: root
    mode: "0600"
    content: |
      RABBITMQ_DEFAULT_USER={{ backend_rabbitmq_admin_username }}
      RABBITMQ_DEFAULT_PASS={{ backend_rabbitmq_admin_password }}
      RABBITMQ_DEFAULT_VHOST={{ backend_rabbitmq_vhost }}
      RABBITMQ_ERLANG_COOKIE={{ backend_rabbitmq_erlang_cookie }}
  no_log: true
  register: backend_rabbitmq_env_file
  notify: Restart RabbitMQ

- name: Render RabbitMQ topology root-only credential environment
  ansible.builtin.copy:
    dest: "{{ backend_rabbitmq_topology_env_path }}"
    owner: root
    group: root
    mode: "0600"
    content: |
      {% for name in backend_rabbitmq_topology_required_environment_names %}
      {{ name }}={{ backend_rabbitmq_topology_environment[name] }}
      {% endfor %}
  no_log: true
  register: backend_rabbitmq_topology_env_file
  when: backend_rabbitmq_topology_enabled | bool

- name: Render RabbitMQ config
  ansible.builtin.template:
    src: rabbitmq.conf.j2
    dest: "{{ backend_rabbitmq_config_path }}"
    owner: root
    group: root
    mode: "0644"
  register: backend_rabbitmq_config_file
  notify: Restart RabbitMQ

- name: Render RabbitMQ enabled plugins
  ansible.builtin.template:
    src: enabled_plugins.j2
    dest: "{{ backend_rabbitmq_enabled_plugins_path }}"
    owner: root
    group: root
    mode: "0644"
  register: backend_rabbitmq_plugins_file
  notify: Restart RabbitMQ

- name: Install RabbitMQ durable probe
  ansible.builtin.copy:
    src: nutsnews_rabbitmq_probe.py
    dest: "{{ backend_rabbitmq_probe_path }}"
    owner: root
    group: root
    mode: "0755"
  register: backend_rabbitmq_probe_file

- name: Install RabbitMQ topology bootstrap
  ansible.builtin.copy:
    src: nutsnews_rabbitmq_topology.py
    dest: "{{ backend_rabbitmq_topology_path }}"
    owner: root
    group: root
    mode: "0755"
  register: backend_rabbitmq_topology_file
  when: backend_rabbitmq_topology_enabled | bool

- name: Install RabbitMQ network security check
  ansible.builtin.copy:
    src: nutsnews_rabbitmq_network_check.py
    dest: "{{ backend_rabbitmq_network_check_path }}"
    owner: root
    group: root
    mode: "0755"
  register: backend_rabbitmq_network_check_file

- name: Install RabbitMQ recovery helper
  ansible.builtin.copy:
    src: nutsnews_rabbitmq_recovery.py
    dest: "{{ backend_rabbitmq_recovery_path }}"
    owner: root
    group: root
    mode: "0755"
  register: backend_rabbitmq_recovery_file

- name: Render RabbitMQ worker topology definition
  ansible.builtin.template:
    src: worker-uplift-topology.json.j2
    dest: "{{ backend_rabbitmq_topology_definition_path }}"
    owner: root
    group: root
    mode: "0640"
  register: backend_rabbitmq_topology_definition_file
  when: backend_rabbitmq_topology_enabled | bool

- name: Render RabbitMQ Compose definition
  ansible.builtin.template:
    src: rabbitmq-compose.yml.j2
    dest: "{{ backend_rabbitmq_compose_path }}"
    owner: root
    group: root
    mode: "0644"
  register: backend_rabbitmq_compose_file
  notify: Restart RabbitMQ

- name: Capture RabbitMQ managed file checksum metadata
  ansible.builtin.stat:
    path: "{{ item.path }}"
    checksum_algorithm: sha256
  loop:
    - id: compose
      path: "{{ backend_rabbitmq_compose_path }}"
    - id: config
      path: "{{ backend_rabbitmq_config_path }}"
    - id: enabled_plugins
      path: "{{ backend_rabbitmq_enabled_plugins_path }}"
    - id: topology
      path: "{{ backend_rabbitmq_topology_definition_path }}"
  register: backend_rabbitmq_managed_file_checksums
  changed_when: false
  when: backend_rabbitmq_topology_enabled | bool

- name: Write RabbitMQ protected apply metadata
  ansible.builtin.copy:
    dest: "{{ backend_rabbitmq_apply_metadata_path }}"
    owner: root
    group: root
    mode: "0640"
    content: |
      {
        "version": 1,
        "tracking_issue": 84,
        "generated_by": "protected-backend-ansible-apply",
        "image": "{{ backend_rabbitmq_image }}",
        "container_name": "{{ backend_rabbitmq_container_name }}",
        "vhost": "{{ backend_rabbitmq_vhost }}",
        "paths": {
          "compose": "{{ backend_rabbitmq_compose_path }}",
          "config": "{{ backend_rabbitmq_config_path }}",
          "enabled_plugins": "{{ backend_rabbitmq_enabled_plugins_path }}",
          "topology": "{{ backend_rabbitmq_topology_definition_path }}"
        },
        "checksums": {
      {% for item in backend_rabbitmq_managed_file_checksums.results | default([]) %}
          "{{ item.item.id }}": "{{ item.stat.checksum | default('') }}"{% if not loop.last %},{% endif %}
      {% endfor %}
        },
        "rollback": {
          "preferred_path": "git_revert_then_protected_check_then_protected_apply",
          "runbook": "runbooks/WORKER_UPLIFT_RABBITMQ_PROVISIONING.md",
          "recovery_runbook": "runbooks/WORKER_UPLIFT_RABBITMQ_RECOVERY.md",
          "data_dir": "{{ backend_rabbitmq_data_dir }}",
          "do_not_delete_data_dir_without_review": true
        },
        "reports": {
          "drift": "sudo -n {{ backend_rabbitmq_probe_path }} drift --env {{ backend_rabbitmq_env_path }} --credentials-env {{ backend_rabbitmq_topology_env_path }} --definition {{ backend_rabbitmq_topology_definition_path }} --metadata {{ backend_rabbitmq_apply_metadata_path }}",
          "smoke": "sudo -n {{ backend_rabbitmq_probe_path }} smoke --env {{ backend_rabbitmq_env_path }} --credentials-env {{ backend_rabbitmq_topology_env_path }} --output {{ backend_rabbitmq_smoke_report_path }}",
          "canary": "sudo -n {{ backend_rabbitmq_probe_path }} canary --env {{ backend_rabbitmq_env_path }} --credentials-env {{ backend_rabbitmq_topology_env_path }} --definition {{ backend_rabbitmq_topology_definition_path }} --output {{ backend_rabbitmq_canary_report_path }} --metrics-output {{ backend_rabbitmq_canary_metrics_path }}"
        }
      }
  register: backend_rabbitmq_apply_metadata_file
  when: backend_rabbitmq_topology_enabled | bool

- name: Install RabbitMQ systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/nutsnews-rabbitmq.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=NutsNews RabbitMQ broker
      Wants=network-online.target
      Requires=docker.service
      After=network-online.target docker.service

      [Service]
      Type=oneshot
      WorkingDirectory={{ backend_rabbitmq_base_dir }}
      RemainAfterExit=yes
      ExecStart=/usr/bin/docker compose -f {{ backend_rabbitmq_compose_path }} up -d --remove-orphans
      ExecReload=/usr/bin/docker compose -f {{ backend_rabbitmq_compose_path }} up -d --remove-orphans
      ExecStop=/usr/bin/docker compose -f {{ backend_rabbitmq_compose_path }} down
      TimeoutStartSec=300
      TimeoutStopSec=120

      [Install]
      WantedBy=multi-user.target
  register: backend_rabbitmq_unit_file
  notify:
    - Reload systemd
    - Restart RabbitMQ

- name: Install RabbitMQ private canary service
  ansible.builtin.copy:
    dest: /etc/systemd/system/nutsnews-rabbitmq-canary.service
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ramideltoro/nutsnews-backend.
      [Unit]
      Description=NutsNews worker-uplift private RabbitMQ canary
      Requires=nutsnews-rabbitmq.service
      After=nutsnews-rabbitmq.service

      [Service]
      Type=oneshot
      ExecStart={{ backend_rabbitmq_probe_path }} canary --env {{ backend_rabbitmq_env_path }} --credentials-env {{ backend_rabbitmq_topology_env_path }} --definition {{ backend_rabbitmq_topology_definition_path }} --output {{ backend_rabbitmq_canary_report_path }} --metrics-output {{ backend_rabbitmq_canary_metrics_path }}
  register: backend_rabbitmq_canary_service_file
  when: backend_rabbitmq_topology_enabled | bool
  notify: Reload systemd

- name: Install RabbitMQ private canary timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/nutsnews-rabbitmq-canary.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ramideltoro/nutsnews-backend.
      [Unit]
      Description=Run NutsNews worker-uplift private RabbitMQ canary

      [Timer]
      OnCalendar={{ backend_rabbitmq_canary_calendar }}
      Persistent=true
      Unit=nutsnews-rabbitmq-canary.service

      [Install]
      WantedBy=timers.target
  register: backend_rabbitmq_canary_timer_file
  when: backend_rabbitmq_topology_enabled | bool
  notify: Reload systemd

- name: Validate RabbitMQ Compose definition
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ backend_rabbitmq_compose_path }}"
      - config
  changed_when: false
  when:
    - backend_rabbitmq_runtime_manageable | bool
    - not ansible_check_mode

- name: Pull pinned RabbitMQ image during protected apply
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ backend_rabbitmq_compose_path }}"
      - pull
  changed_when: false
  when:
    - backend_rabbitmq_runtime_manageable | bool
    - not ansible_check_mode

- name: Flush RabbitMQ handlers before health probe
  ansible.builtin.meta: flush_handlers
  when:
    - backend_rabbitmq_runtime_manageable | bool
    - not ansible_check_mode

- name: Ensure RabbitMQ service is enabled and started
  ansible.builtin.systemd:
    name: nutsnews-rabbitmq.service
    enabled: true
    state: started
    daemon_reload: true
  when:
    - backend_rabbitmq_runtime_manageable | bool
    - not ansible_check_mode

- name: Wait for RabbitMQ diagnostics to pass
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ backend_rabbitmq_container_name }}"
      - rabbitmq-diagnostics
      - -q
      - ping
  register: backend_rabbitmq_ping
  retries: 12
  delay: 5
  until: backend_rabbitmq_ping.rc == 0
  changed_when: false
  when:
    - backend_rabbitmq_runtime_manageable | bool
    - not ansible_check_mode

- name: Bootstrap RabbitMQ worker topology
  ansible.builtin.command:
    argv: "{{ [backend_rabbitmq_topology_path, 'bootstrap', '--env', backend_rabbitmq_env_path, '--credentials-env', backend_rabbitmq_topology_env_path, '--definition', backend_rabbitmq_topology_definition_path] + (backend_rabbitmq_topology_rotate_passwords | bool | ternary(['--rotate-passwords'], [])) }}"
  register: backend_rabbitmq_topology_bootstrap
  changed_when: (backend_rabbitmq_topology_bootstrap.stdout | from_json).changed | bool
  when:
    - backend_rabbitmq_runtime_manageable | bool
    - backend_rabbitmq_topology_enabled | bool
    - not ansible_check_mode

- name: Verify RabbitMQ worker topology drift
  ansible.builtin.command:
    argv:
      - "{{ backend_rabbitmq_topology_path }}"
      - check
      - --env
      - "{{ backend_rabbitmq_env_path }}"
      - --credentials-env
      - "{{ backend_rabbitmq_topology_env_path }}"
      - --definition
      - "{{ backend_rabbitmq_topology_definition_path }}"
  register: backend_rabbitmq_topology_drift
  changed_when: false
  when:
    - backend_rabbitmq_runtime_manageable | bool
    - backend_rabbitmq_topology_enabled | bool
    - not ansible_check_mode

- name: Verify RabbitMQ least-privilege permissions
  ansible.builtin.command:
    argv:
      - "{{ backend_rabbitmq_topology_path }}"
      - permissions
      - --env
      - "{{ backend_rabbitmq_env_path }}"
      - --credentials-env
      - "{{ backend_rabbitmq_topology_env_path }}"
      - --definition
      - "{{ backend_rabbitmq_topology_definition_path }}"
  register: backend_rabbitmq_topology_permissions
  changed_when: false
  when:
    - backend_rabbitmq_runtime_manageable | bool
    - backend_rabbitmq_topology_enabled | bool
    - not ansible_check_mode

- name: Probe RabbitMQ retry and DLQ transfer routing
  ansible.builtin.command:
    argv:
      - "{{ backend_rabbitmq_topology_path }}"
      - probe-transfers
      - --env
      - "{{ backend_rabbitmq_env_path }}"
      - --credentials-env
      - "{{ backend_rabbitmq_topology_env_path }}"
      - --definition
      - "{{ backend_rabbitmq_topology_definition_path }}"
      - --skip-non-empty
  register: backend_rabbitmq_topology_transfer_probe
  changed_when: false
  when:
    - backend_rabbitmq_runtime_manageable | bool
    - backend_rabbitmq_topology_enabled | bool
    - backend_rabbitmq_topology_transfer_probe_enabled | bool
    - not ansible_check_mode

- name: Run RabbitMQ private canary once after topology bootstrap
  ansible.builtin.command:
    argv:
      - "{{ backend_rabbitmq_probe_path }}"
      - canary
      - --env
      - "{{ backend_rabbitmq_env_path }}"
      - --credentials-env
      - "{{ backend_rabbitmq_topology_env_path }}"
      - --definition
      - "{{ backend_rabbitmq_topology_definition_path }}"
      - --output
      - "{{ backend_rabbitmq_canary_report_path }}"
      - --metrics-output
      - "{{ backend_rabbitmq_canary_metrics_path }}"
  register: backend_rabbitmq_canary_once
  changed_when: false
  when:
    - backend_rabbitmq_runtime_manageable | bool
    - backend_rabbitmq_topology_enabled | bool
    - not ansible_check_mode

- name: Reset RabbitMQ private canary service failure state after apply canary
  ansible.builtin.command:
    argv:
      - systemctl
      - reset-failed
      - nutsnews-rabbitmq-canary.service
  changed_when: false
  when:
    - backend_rabbitmq_runtime_manageable | bool
    - backend_rabbitmq_topology_enabled | bool
    - not ansible_check_mode
    - backend_rabbitmq_canary_once is succeeded

- name: Ensure RabbitMQ private canary timer is enabled and started
  ansible.builtin.systemd:
    name: nutsnews-rabbitmq-canary.timer
    enabled: true
    state: started
    daemon_reload: true
  when:
    - backend_rabbitmq_runtime_manageable | bool
    - backend_rabbitmq_topology_enabled | bool
    - not ansible_check_mode

- name: Track whether RabbitMQ durable probe should restart the container
  ansible.builtin.set_fact:
    backend_rabbitmq_run_durable_probe_now: >-
      {{
        backend_rabbitmq_durable_probe_enabled | bool and
        (
          backend_rabbitmq_env_file is changed or
          backend_rabbitmq_config_file is changed or
          backend_rabbitmq_plugins_file is changed or
          backend_rabbitmq_compose_file is changed or
          backend_rabbitmq_unit_file is changed or
          backend_rabbitmq_data_tree_permissions is changed or
          backend_rabbitmq_legacy_probe_state_file is changed or
          backend_rabbitmq_probe_file is changed
        )
      }}

- name: Publish RabbitMQ durable restart probe message
  ansible.builtin.command:
    argv:
      - "{{ backend_rabbitmq_probe_path }}"
      - publish
      - --env
      - "{{ backend_rabbitmq_env_path }}"
      - --queue
      - "{{ backend_rabbitmq_durable_probe_queue }}"
      - --state
      - "{{ backend_rabbitmq_probe_state_path }}"
  register: backend_rabbitmq_probe_publish
  changed_when: true
  when:
    - backend_rabbitmq_runtime_manageable | bool
    - backend_rabbitmq_run_durable_probe_now | bool
    - not ansible_check_mode

- name: Restart RabbitMQ for durable probe
  ansible.builtin.systemd:
    name: nutsnews-rabbitmq.service
    state: restarted
    daemon_reload: true
  when:
    - backend_rabbitmq_runtime_manageable | bool
    - backend_rabbitmq_run_durable_probe_now | bool
    - not ansible_check_mode

- name: Verify RabbitMQ durable probe message after restart
  ansible.builtin.command:
    argv:
      - "{{ backend_rabbitmq_probe_path }}"
      - verify
      - --env
      - "{{ backend_rabbitmq_env_path }}"
      - --queue
      - "{{ backend_rabbitmq_durable_probe_queue }}"
      - --state
      - "{{ backend_rabbitmq_probe_state_path }}"
      - --delete-queue
  register: backend_rabbitmq_probe_verify
  changed_when: true
  when:
    - backend_rabbitmq_runtime_manageable | bool
    - backend_rabbitmq_run_durable_probe_now | bool
    - not ansible_check_mode

- name: Capture RabbitMQ read-only health summary
  ansible.builtin.command:
    argv:
      - "{{ backend_rabbitmq_probe_path }}"
      - health
      - --env
      - "{{ backend_rabbitmq_env_path }}"
  register: backend_rabbitmq_health
  changed_when: false
  when:
    - backend_rabbitmq_runtime_manageable | bool
    - not ansible_check_mode

- name: Verify RabbitMQ network security posture
  ansible.builtin.command:
    argv:
      - "{{ backend_rabbitmq_network_check_path }}"
      - --container-name
      - "{{ backend_rabbitmq_container_name }}"
      - --env
      - "{{ backend_rabbitmq_env_path }}"
      - --topology-env
      - "{{ backend_rabbitmq_topology_env_path }}"
      - --amqp-port
      - "{{ backend_rabbitmq_amqp_port }}"
      - --management-port
      - "{{ backend_rabbitmq_management_port }}"
      - --prometheus-port
      - "{{ backend_rabbitmq_prometheus_port }}"
  register: backend_rabbitmq_network_security
  changed_when: false
  when:
    - backend_rabbitmq_runtime_manageable | bool
    - backend_rabbitmq_topology_enabled | bool
    - not ansible_check_mode

- name: Capture RabbitMQ recovery status summary
  ansible.builtin.command:
    argv:
      - "{{ backend_rabbitmq_recovery_path }}"
      - status
      - --state-dir
      - "{{ backend_rabbitmq_recovery_state_dir }}"
  register: backend_rabbitmq_recovery_status
  changed_when: false
  when:
    - backend_rabbitmq_runtime_manageable | bool
    - not ansible_check_mode

- name: Capture RabbitMQ read-only drift summary
  ansible.builtin.command:
    argv:
      - "{{ backend_rabbitmq_probe_path }}"
      - drift
      - --env
      - "{{ backend_rabbitmq_env_path }}"
      - --credentials-env
      - "{{ backend_rabbitmq_topology_env_path }}"
      - --definition
      - "{{ backend_rabbitmq_topology_definition_path }}"
      - --metadata
      - "{{ backend_rabbitmq_apply_metadata_path }}"
      - --topology-path
      - "{{ backend_rabbitmq_topology_path }}"
      - --network-check-path
      - "{{ backend_rabbitmq_network_check_path }}"
      - --container-name
      - "{{ backend_rabbitmq_container_name }}"
  register: backend_rabbitmq_drift_summary
  changed_when: false
  when:
    - backend_rabbitmq_runtime_manageable | bool
    - backend_rabbitmq_topology_enabled | bool
    - not ansible_check_mode

- name: Report RabbitMQ provisioning summary
  ansible.builtin.debug:
    msg:
      enabled: "{{ backend_rabbitmq_enabled }}"
      image: "{{ backend_rabbitmq_image }}"
      vhost: "{{ backend_rabbitmq_vhost }}"
      compose_path: "{{ backend_rabbitmq_compose_path }}"
      data_dir: "{{ backend_rabbitmq_data_dir }}"
      amqp: "{{ backend_rabbitmq_bind_address }}:{{ backend_rabbitmq_amqp_port }}"
      management: "{{ backend_rabbitmq_bind_address }}:{{ backend_rabbitmq_management_port }}"
      prometheus: "{{ backend_rabbitmq_bind_address }}:{{ backend_rabbitmq_prometheus_port }}"
      runtime_manageable: "{{ backend_rabbitmq_runtime_manageable }}"
      topology_enabled: "{{ backend_rabbitmq_topology_enabled }}"
      topology_bootstrap: "{{ backend_rabbitmq_topology_bootstrap.stdout | default('{}') }}"
      topology_drift: "{{ backend_rabbitmq_topology_drift.stdout | default('{}') }}"
      topology_permissions: "{{ backend_rabbitmq_topology_permissions.stdout | default('{}') }}"
      topology_transfer_probe: "{{ backend_rabbitmq_topology_transfer_probe.stdout | default('{}') }}"
      canary: "{{ backend_rabbitmq_canary_once.stdout | default('{}') }}"
      durable_probe_ran: "{{ backend_rabbitmq_run_durable_probe_now | default(false) }}"
