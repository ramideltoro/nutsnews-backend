---
backend_worker_runtime_enabled: false
backend_worker_runtime_project_name: nutsnews-worker-uplift
backend_worker_runtime_base_dir: /opt/nutsnews-worker-uplift
backend_worker_runtime_config_dir: /etc/nutsnews-worker-uplift
backend_worker_runtime_state_dir: /var/lib/nutsnews/worker-uplift-runtime
backend_worker_runtime_report_dir: "{{ backend_worker_runtime_state_dir }}/reports"
backend_worker_runtime_manifest_path: "{{ backend_worker_runtime_config_dir }}/services.json"
backend_worker_runtime_compose_path: "{{ backend_worker_runtime_base_dir }}/compose.yml"
backend_worker_runtime_manager_path: /usr/local/sbin/nutsnews-worker-runtime
backend_worker_runtime_cutover_manager_path: /usr/local/sbin/nutsnews-worker-uplift-cutover-control
backend_worker_runtime_cutover_contract_path: /etc/nutsnews-worker-uplift/cutover-controls.json
backend_worker_runtime_cutover_decision_path: /etc/nutsnews-worker-uplift/final-cutover-decision.json
backend_worker_runtime_cutover_env_path: /etc/nutsnews-worker-uplift/cutover.env
backend_worker_runtime_cutover_db_host: 127.0.0.1
backend_worker_runtime_cutover_db_port: 5432
backend_worker_runtime_cutover_db_name: "{{ backend_worker_uplift_postgres_database | default('nutsnews_primary_shadow') }}"
backend_worker_runtime_cutover_db_user: "{{ backend_worker_uplift_cutover_user | default('nutsnews_worker_uplift_cutover') }}"
backend_worker_runtime_cutover_db_password: "{{ backend_worker_uplift_cutover_password | default('') }}"
backend_worker_runtime_default_mode: shadow
backend_worker_runtime_production_writes_enabled: false
backend_worker_runtime_cutover_state: shadow
backend_worker_runtime_contract_version: "0.3.1"
backend_worker_runtime_runtime_version: "1"
backend_worker_runtime_max_replicas_per_service: 3
backend_worker_runtime_default_replicas: 1
backend_worker_runtime_default_restart_policy: unless-stopped
backend_worker_runtime_default_cpu_limit: "0.50"
backend_worker_runtime_default_memory_limit: 256m
backend_worker_runtime_default_pids_limit: 256
backend_worker_runtime_reconciliation_apply_enabled: false
backend_worker_runtime_reconciliation_stop: false
backend_worker_runtime_allowed_image_repositories:
  - ghcr.io/ramideltoro/nutsnews-worker-uplift/
  - ghcr.io/ramideltoro/nutsnews-backend/worker-uplift/
  - ghcr.io/ramideltoro/nutsnews-worker-feed-scheduler
  - ghcr.io/ramideltoro/nutsnews-worker-feed-fetcher
  - ghcr.io/ramideltoro/nutsnews-worker-article-canonicalizer
  - ghcr.io/ramideltoro/nutsnews-worker-article-enrichment
  - ghcr.io/ramideltoro/nutsnews-worker-article-approval
  - ghcr.io/ramideltoro/nutsnews-worker-article-translation
  - ghcr.io/ramideltoro/nutsnews-worker-article-persistence
  - ghcr.io/ramideltoro/nutsnews-worker-article-publication
backend_worker_runtime_allowed_source_repositories:
  - ramideltoro/nutsnews-backend
  - ramideltoro/nutsnews-worker-services
  - ramideltoro/nutsnews-worker-feed-scheduler
  - ramideltoro/nutsnews-worker-feed-fetcher
  - ramideltoro/nutsnews-worker-article-canonicalizer
  - ramideltoro/nutsnews-worker-article-enrichment
  - ramideltoro/nutsnews-worker-article-approval
  - ramideltoro/nutsnews-worker-article-translation
  - ramideltoro/nutsnews-worker-article-persistence
  - ramideltoro/nutsnews-worker-article-publication
backend_worker_runtime_allowed_stages:
  - scheduler
  - fetcher
  - canonicalizer
  - enrichment
  - approval
  - translation
  - persistence
  - publication
backend_worker_runtime_allowed_actions:
  - check
  - deploy
  - promote
  - restart
  - scale
  - rollback
  - status
  - logs
  - queue-inspect
  - dlq-inspect
  - dlq-replay
  - drain
  - reconciliation
  - smoke
backend_worker_runtime_services:
  - name: scheduler
    stage: scheduler
    tracking_issue: 117
    image: ghcr.io/ramideltoro/nutsnews-worker-feed-scheduler@sha256:03f52c161f6eb7ea9ac38aaed22f3bf09df6f86192eb05aa108c6bde5420ab07
    image_tag: e92d2f93c93fa5ceb507a2e6c9a62f91a46fcc07
    contract_version: "0.3.1"
    runtime_package_version: "0.4.0"
    runtime_mode: shadow
    network_mode: host
    replicas: 1
    resources:
      memory: 256m
      cpus: "0.35"
      pids: 256
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:18081/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    provenance:
      required: true
      signed: true
      source_repository: ramideltoro/nutsnews-worker-feed-scheduler
      subject_digest: sha256:03f52c161f6eb7ea9ac38aaed22f3bf09df6f86192eb05aa108c6bde5420ab07
    env:
      NUTSNEWS_ENVIRONMENT: production
      NUTSNEWS_SCHEDULER_HTTP_HOST: 127.0.0.1
      NUTSNEWS_SCHEDULER_HTTP_PORT: "18081"
      NUTSNEWS_SCHEDULER_DEPENDENCY_MODE: production
      NUTSNEWS_SCHEDULER_BACKEND_API_URL: "{{ backend_worker_runtime_backend_api_url }}"
      NUTSNEWS_SCHEDULER_CADENCE_MS: "300000"
      NUTSNEWS_SCHEDULER_LEASE_MS: "900000"
      NUTSNEWS_SCHEDULER_CONCURRENCY: "1"
      NUTSNEWS_SCHEDULER_SHUTDOWN_TIMEOUT_MS: "30000"
      NUTSNEWS_SCHEDULER_SHADOW_MODE: "true"
      NUTSNEWS_SCHEDULER_TELEMETRY_LOGS: stdout
      NUTSNEWS_SCHEDULER_METRICS_ENABLED: "true"
    secret_env:
      - name: scheduler-database-url
        env_key: NUTSNEWS_SCHEDULER_DATABASE_URL
      - name: scheduler-rabbitmq-url
        env_key: NUTSNEWS_SCHEDULER_RABBITMQ_URL
      - name: scheduler-backend-api-token
        env_key: NUTSNEWS_SCHEDULER_BACKEND_API_TOKEN
      - name: reconciliation-token
        env_key: NUTSNEWS_WORKER_UPLIFT_RECONCILIATION_TOKEN
    queues:
      main: nutsnews.worker.fetch.v1
      retry: []
      dlq: nutsnews.worker.fetch.v1.dlq
      consumes: []
      publishes:
        - nutsnews.worker.fetch.v1
    postgres:
      database: "{{ backend_worker_uplift_postgres_database | default('nutsnews_primary_shadow') }}"
      schemas:
        - worker_uplift_scheduler
      production_write_path: false
    rollback:
      image: ghcr.io/ramideltoro/nutsnews-worker-feed-scheduler@sha256:cfbb3247914a623bb60362d5e983d02c5936987571e72f5ac910391e1602ef8c
      reason: pre-production-adapters-shadow-candidate

  - name: fetcher
    stage: fetcher
    tracking_issue: 117
    image: ghcr.io/ramideltoro/nutsnews-worker-feed-fetcher@sha256:13781f7143820b8b827ddd3c441574595e4e357693f86d160e6cd7123b17270d
    image_tag: 905e6af5989bb4eb1eba772cde728f86026eb229
    contract_version: "0.3.1"
    runtime_package_version: "0.5.0"
    runtime_mode: shadow
    network_mode: host
