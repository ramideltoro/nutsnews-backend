      - name: reconciliation-token
        env_key: NUTSNEWS_WORKER_UPLIFT_RECONCILIATION_TOKEN
    queues:
      main: nutsnews.worker.fetch.v1
      retry:
        - nutsnews.worker.fetch.v1.retry-30s
        - nutsnews.worker.fetch.v1.retry-5m
        - nutsnews.worker.fetch.v1.retry-30m
      dlq: nutsnews.worker.fetch.v1.dlq
      consumes:
        - nutsnews.worker.fetch.v1
      publishes:
        - nutsnews.worker.canonicalization.v1
